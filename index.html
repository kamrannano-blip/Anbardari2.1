<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حسابداری">
<meta name="mobile-web-app-capable" content="yes">
<title>سیستم حسابداری و انبارداری</title>
<link rel="apple-touch-icon" href="DAVIN.PNG">
<link rel="apple-touch-icon" sizes="180x180" href="DAVIN.PNG">
<link rel="apple-touch-icon" sizes="152x152" href="DAVIN.PNG">
<link rel="apple-touch-icon" sizes="167x167" href="DAVIN.PNG">
<link rel="apple-touch-icon" sizes="120x120" href="DAVIN.PNG">
<link rel="apple-touch-icon" sizes="76x76" href="DAVIN.PNG">
<link rel="icon" type="image/png" href="DAVIN.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.6/dist/jalaali.min.js"></script>
<style>
:root{
  --primary:#6366f1; --primary-dark:#4f46e5; --primary-light:#eef2ff;
  --primary-glow:rgba(99,102,241,.35);
  --success:#10b981; --success-light:#ecfdf5; --success-dark:#059669;
  --danger:#ef4444; --danger-light:#fef2f2; --danger-dark:#dc2626;
  --warning:#f59e0b; --warning-light:#fffbeb; --warning-dark:#d97706;
  --info:#3b82f6; --info-light:#eff6ff;
  --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
  --gray-300:#d1d5db; --gray-400:#9ca3af; --gray-500:#6b7280;
  --gray-600:#4b5563; --gray-700:#374151; --gray-800:#1f2937; --gray-900:#111827;
  --radius:14px; --radius-sm:10px;
  --shadow:0 2px 6px rgba(17,24,39,.06),0 1px 3px rgba(17,24,39,.04);
  --shadow-lg:0 15px 35px rgba(17,24,39,.1),0 6px 12px rgba(17,24,39,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Estedad','Vazirmatn',sans-serif;background:linear-gradient(135deg,#f8fafc 0%,#eef2ff 100%);background-attachment:fixed;color:var(--gray-800);font-size:14px;line-height:1.7;min-height:100vh;-webkit-tap-highlight-color:transparent}

.app{display:flex;min-height:100vh}
.sidebar{
  width:262px;background:linear-gradient(180deg,#ffffff 0%,#f8faff 100%);
  border-left:1px solid var(--gray-200);
  padding:20px 0;position:fixed;top:0;right:0;bottom:0;overflow-y:auto;z-index:50;
  transition:transform .3s;box-shadow:2px 0 20px rgba(99,102,241,.06);
}
.sidebar .brand{display:flex;align-items:center;gap:12px;padding:0 20px 20px;border-bottom:1px solid var(--gray-100);margin-bottom:16px}
.sidebar .brand-icon{
  width:46px;height:46px;
  background:linear-gradient(135deg,var(--primary) 0%,#8b5cf6 60%,#a855f7 100%);
  border-radius:13px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:22px;font-weight:800;
  box-shadow:0 4px 0 rgba(76,29,149,.4),0 8px 16px var(--primary-glow),inset 0 1px 0 rgba(255,255,255,.3);
  transform:perspective(300px) rotateX(4deg);
}
.sidebar .brand-text{font-weight:800;font-size:15px;color:var(--gray-900);letter-spacing:-.3px}
.sidebar .brand-sub{font-size:11px;color:var(--gray-500);font-weight:500}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 20px;margin:2px 10px;color:var(--gray-600);cursor:pointer;
  font-weight:600;font-size:13.5px;border-radius:10px;transition:all .18s ease;user-select:none;
}
.nav-item:hover{background:var(--gray-100);color:var(--primary);transform:translateX(-2px)}
.nav-item.active{
  background:linear-gradient(135deg,var(--primary) 0%,#8b5cf6 100%);color:#fff;
  box-shadow:0 4px 0 var(--primary-dark),0 8px 20px var(--primary-glow);
  transform:translateY(-1px);
}
.nav-item .icon{font-size:18px;width:22px;text-align:center;display:inline-block}

.main{margin-right:262px;flex:1;padding:24px 28px 120px;min-height:100vh;position:relative}
.topbar{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(12px);
  padding:14px 20px;border-radius:14px;border:1px solid rgba(255,255,255,.8);
  box-shadow:0 2px 6px rgba(17,24,39,.04);
}
.page-title{
  font-size:22px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(135deg,var(--gray-900),var(--primary-dark));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.menu-toggle{display:none;background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:18px;box-shadow:var(--shadow)}

.card{
  background:#fff;border-radius:var(--radius);padding:22px;
  border:1px solid rgba(229,231,235,.8);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 4px 12px rgba(17,24,39,.06),0 12px 28px rgba(17,24,39,.06);
  transition:transform .25s ease,box-shadow .25s ease;position:relative;
}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 8px 22px rgba(17,24,39,.09),0 20px 40px rgba(99,102,241,.08)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.card-title{font-size:15px;font-weight:800;color:var(--gray-800);letter-spacing:-.3px}

.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.stat{
  padding:20px;border-radius:var(--radius);background:#fff;border:1px solid rgba(229,231,235,.9);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 4px 12px rgba(17,24,39,.05),0 1px 3px rgba(17,24,39,.04);
  position:relative;overflow:hidden;transition:all .25s ease;transform-style:preserve-3d;
}
.stat:hover{transform:translateY(-4px) perspective(500px) rotateX(2deg);box-shadow:0 12px 24px rgba(17,24,39,.1),0 20px 40px rgba(99,102,241,.1)}
.stat::before{content:'';position:absolute;top:0;right:0;width:5px;height:100%;background:linear-gradient(180deg,var(--primary),#8b5cf6);box-shadow:0 0 12px var(--primary-glow)}
.stat::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,rgba(99,102,241,.06),transparent 60%);pointer-events:none}
.stat.s-success::before{background:linear-gradient(180deg,var(--success),#34d399);box-shadow:0 0 12px rgba(16,185,129,.4)}
.stat.s-success::after{background:radial-gradient(circle at 100% 0%,rgba(16,185,129,.08),transparent 60%)}
.stat.s-danger::before{background:linear-gradient(180deg,var(--danger),#f87171);box-shadow:0 0 12px rgba(239,68,68,.4)}
.stat.s-danger::after{background:radial-gradient(circle at 100% 0%,rgba(239,68,68,.08),transparent 60%)}
.stat.s-warning::before{background:linear-gradient(180deg,var(--warning),#fbbf24);box-shadow:0 0 12px rgba(245,158,11,.4)}
.stat.s-warning::after{background:radial-gradient(circle at 100% 0%,rgba(245,158,11,.08),transparent 60%)}
.stat.s-info::before{background:linear-gradient(180deg,var(--info),#60a5fa);box-shadow:0 0 12px rgba(59,130,246,.4)}
.stat.s-info::after{background:radial-gradient(circle at 100% 0%,rgba(59,130,246,.08),transparent 60%)}
.stat-label{font-size:12px;color:var(--gray-500);margin-bottom:6px;font-weight:600;position:relative;z-index:1}
.stat-value{font-size:21px;font-weight:800;color:var(--gray-900);letter-spacing:-.7px;position:relative;z-index:1}
.stat-value.positive{color:var(--success-dark)}
.stat-value.negative{color:var(--danger-dark)}
.stat-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:32px;opacity:.12;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}

.btn{
  display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;border:none;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s ease;white-space:nowrap;position:relative;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(180deg,#6366f1,#4f46e5);color:#fff;box-shadow:0 3px 0 #3730a3,0 6px 14px var(--primary-glow)}
.btn-primary:hover{background:linear-gradient(180deg,#4f46e5,#4338ca)}
.btn-primary:active{box-shadow:0 1px 0 #3730a3,0 2px 6px var(--primary-glow)}
.btn-success{background:linear-gradient(180deg,#10b981,#059669);color:#fff;box-shadow:0 3px 0 #065f46,0 6px 14px rgba(16,185,129,.35)}
.btn-success:hover{background:linear-gradient(180deg,#059669,#047857)}
.btn-success:active{box-shadow:0 1px 0 #065f46,0 2px 6px rgba(16,185,129,.3)}
.btn-danger{background:linear-gradient(180deg,#ef4444,#dc2626);color:#fff;box-shadow:0 3px 0 #991b1b,0 6px 14px rgba(239,68,68,.35)}
.btn-danger:hover{background:linear-gradient(180deg,#dc2626,#b91c1c)}
.btn-danger:active{box-shadow:0 1px 0 #991b1b,0 2px 6px rgba(239,68,68,.3)}
.btn-warning{background:linear-gradient(180deg,#f59e0b,#d97706);color:#fff;box-shadow:0 3px 0 #92400e,0 6px 14px rgba(245,158,11,.35)}
.btn-warning:hover{background:linear-gradient(180deg,#d97706,#b45309)}
.btn-ghost{background:linear-gradient(180deg,#f9fafb,#f3f4f6);color:var(--gray-700);border:1px solid var(--gray-200);box-shadow:0 1px 0 rgba(0,0,0,.03),0 2px 4px rgba(0,0,0,.04)}
.btn-ghost:hover{background:linear-gradient(180deg,#f3f4f6,#e5e7eb)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:8px;width:36px;height:36px;justify-content:center}

.quick-tx{
  width:32px;height:32px;padding:0;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;
  border:none;cursor:pointer;font-size:15px;font-weight:800;
  transition:all .15s ease;position:relative;
}
.quick-tx:active{transform:translateY(2px)}
.quick-tx-in{
  background:linear-gradient(180deg,#10b981,#059669);color:#fff;
  box-shadow:0 2px 0 #065f46,0 4px 8px rgba(16,185,129,.3);
}
.quick-tx-in:hover{background:linear-gradient(180deg,#059669,#047857)}
.quick-tx-in:active{box-shadow:0 1px 0 #065f46,0 2px 4px rgba(16,185,129,.3)}
.quick-tx-out{
  background:linear-gradient(180deg,#ef4444,#dc2626);color:#fff;
  box-shadow:0 2px 0 #991b1b,0 4px 8px rgba(239,68,68,.3);
}
.quick-tx-out:hover{background:linear-gradient(180deg,#dc2626,#b91c1c)}
.quick-tx-out:active{box-shadow:0 1px 0 #991b1b,0 2px 4px rgba(239,68,68,.3)}
.quick-tx svg{width:16px;height:16px;stroke-width:3}

.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:6px}
.form-control{
  width:100%;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:10px;
  font-family:inherit;font-size:13px;background:#fff;transition:all .18s ease;color:var(--gray-800);
  box-shadow:0 1px 2px rgba(0,0,0,.03) inset;
}
.form-control:hover{border-color:var(--gray-300)}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light),0 1px 2px rgba(0,0,0,.03) inset;background:#fff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
input[type=number]{direction:ltr;text-align:right}

.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--gray-100);box-shadow:0 1px 2px rgba(17,24,39,.03)}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{background:linear-gradient(180deg,#f9fafb,#f3f4f6);padding:12px 14px;text-align:right;font-weight:700;color:var(--gray-700);font-size:12px;border-bottom:1px solid var(--gray-200);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:linear-gradient(90deg,var(--primary-light),transparent)}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.badge-success{background:var(--success-light);color:var(--success-dark)}
.badge-danger{background:var(--danger-light);color:var(--danger-dark)}
.badge-warning{background:var(--warning-light);color:var(--warning-dark)}
.badge-info{background:var(--info-light);color:var(--info)}
.badge-gray{background:var(--gray-100);color:var(--gray-600)}

.modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.5) inset;animation:slideUp .25s cubic-bezier(.4,0,.2,1)}
.modal.modal-lg{max-width:960px}
@keyframes slideUp{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1;border-radius:16px 16px 0 0}
.modal-title{font-size:16px;font-weight:800;color:var(--gray-900)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-400);width:32px;height:32px;border-radius:8px;transition:all .15s}
.modal-close:hover{background:var(--gray-100);color:var(--gray-700)}
.modal-body{padding:22px}
.modal-footer{padding:16px 22px;border-top:1px solid var(--gray-100);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px;flex-wrap:wrap}

.empty{text-align:center;padding:40px 20px;color:var(--gray-400)}
.empty .icon{font-size:42px;margin-bottom:10px;opacity:.35}
.empty .title{font-weight:700;color:var(--gray-500);margin-bottom:4px}
.empty .sub{font-size:12px}

.toast{
  position:fixed;bottom:24px;left:24px;background:linear-gradient(180deg,#1f2937,#111827);color:#fff;
  padding:13px 20px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.3);
  z-index:200;font-size:13px;font-weight:600;opacity:0;transform:translateY(15px) scale(.95);
  transition:.3s cubic-bezier(.4,0,.2,1);pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0) scale(1)}
.toast.success{background:linear-gradient(180deg,#10b981,#059669);box-shadow:0 10px 25px rgba(16,185,129,.35),0 4px 0 #065f46}
.toast.error{background:linear-gradient(180deg,#ef4444,#dc2626);box-shadow:0 10px 25px rgba(239,68,68,.35),0 4px 0 #991b1b}
.toast.warning{background:linear-gradient(180deg,#f59e0b,#d97706);box-shadow:0 10px 25px rgba(245,158,11,.35),0 4px 0 #92400e}

.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mb-3{margin-bottom:12px}.mb-4{margin-bottom:18px}.mt-3{margin-top:12px}.mt-4{margin-top:18px}
.text-center{text-align:center}
.text-muted{color:var(--gray-500);font-size:12px}
.text-success{color:var(--success-dark)}.text-danger{color:var(--danger-dark)}.text-warning{color:var(--warning-dark)}
.font-bold{font-weight:800}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--gray-200),transparent);margin:18px 0}
.hidden{display:none!important}
.filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-tab{
  padding:8px 16px;border-radius:20px;background:#fff;color:var(--gray-600);
  font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--gray-200);
  font-family:inherit;transition:all .18s ease;box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.filter-tab:hover{background:var(--gray-50);border-color:var(--gray-300)}
.filter-tab.active{background:linear-gradient(180deg,#6366f1,#4f46e5);color:#fff;border-color:transparent;box-shadow:0 3px 0 #3730a3,0 4px 12px var(--primary-glow)}
.search-box{position:relative;flex:1;max-width:300px}
.search-box input{padding-right:38px}
.search-box::before{content:'🔍';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5}

.footer-signature{
  position:fixed;bottom:0;left:0;right:262px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(248,250,252,.98));
  backdrop-filter:blur(12px);border-top:1px solid rgba(229,231,235,.9);
  padding:11px 24px;text-align:center;font-size:11.5px;color:var(--gray-600);z-index:40;
  box-shadow:0 -4px 20px rgba(17,24,39,.06);
}
.footer-signature .sig-line{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.footer-signature .sig-name{
  font-weight:800;letter-spacing:.6px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:12.5px;
}
.footer-signature .sig-tel{
  direction:ltr;font-variant-numeric:tabular-nums;color:var(--gray-700);font-weight:700;
  padding:2px 10px;border-radius:20px;background:linear-gradient(180deg,#eef2ff,#e0e7ff);font-size:11px;
}
.footer-signature .sig-sep{opacity:.3}
@media(max-width:900px){.footer-signature{right:0}}

@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;top:0;right:0;width:100%;padding:20px;background:#fff}
  .no-print{display:none!important}
  .footer-signature{display:none!important}
}
@media(max-width:900px){
  .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0;padding-bottom:140px}
  .menu-toggle{display:inline-flex}
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gray-300),var(--gray-400));border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--gray-400),var(--gray-500));background-clip:content-box;border:2px solid transparent}

.items-table{min-width:760px}
.items-table th{white-space:nowrap}
.items-table td{padding:8px 10px;vertical-align:middle}
.items-table input,.items-table select{font-size:13px!important;padding:8px 10px!important;min-height:38px}
.items-table .col-product{min-width:220px;width:220px}
.items-table .col-qty{width:100px}
.items-table .col-price{width:150px}
.items-table .col-total{width:130px}
.items-table .col-act{width:50px}
.invoice-total{
  background:linear-gradient(135deg,#f8fafc,#eef2ff);padding:16px 20px;border-radius:var(--radius-sm);
  display:flex;flex-direction:column;gap:7px;border:1px solid var(--gray-100);
}
.invoice-total .row{display:flex;justify-content:space-between;font-size:13px}
.invoice-total .row.total{font-size:16px;font-weight:800;color:var(--primary-dark);padding-top:10px;border-top:2px dashed var(--gray-300);margin-top:6px}
.invoice-total .row.highlight{color:var(--success-dark);font-weight:700}
.invoice-total .row.warn{color:var(--warning-dark);font-weight:700}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">ح</div>
      <div>
        <div class="brand-text" id="sidebarShopName">فروشگاه من</div>
        <div class="brand-sub">سیستم حسابداری</div>
      </div>
    </div>
    <nav>
      <div class="nav-item active" data-page="dashboard"><span class="icon">📊</span>داشبورد</div>

const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];

function formatNum(n){
  if(n===null||n===undefined||n==='')return '0';
  const num = Math.round(Number(n)||0);
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function parseNum(s){
  if(typeof s==='number')return s;
  if(!s)return 0;
  const cleaned = String(s).replace(/[,\u066B\u066C\s]/g,'');
  return Number(cleaned)||0;
}
function formatMoney(n){
  const cur = DB.data.settings.currency || 'تومان';
  return formatNum(n)+' '+cur;
}
function attachThousands(input){
  if(input._thousandsAttached)return;
  input._thousandsAttached = true;
  input.addEventListener('input',()=>{
    const raw = input.value.replace(/[^\d-]/g,'');
    if(raw==='' || raw==='-'){input.value=raw;return;}
    input.value = formatNum(raw);
  });
}

function todayJalali(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return `${j.jy}/${String(j.jm).padStart(2,'0')}/${String(j.jd).padStart(2,'0')}`;
}
function nowJalaliFull(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return `${j.jy}/${String(j.jm).padStart(2,'0')}/${String(j.jd).padStart(2,'0')} - ${String(g.getHours()).padStart(2,'0')}:${String(g.getMinutes()).padStart(2,'0')}`;
}
function jalaliMonth(jstr){
  if(!jstr)return '';
  return jstr.split('/').slice(0,2).join('/');
}
function validJalali(s){
  if(!s)return false;
  const p = s.split('/').map(Number);
  if(p.length!==3)return false;
  return jalaali.isValidJalaaliDate(p[0],p[1],p[2]);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

function toast(msg,type=''){

const DB_KEY = 'hesabdar_v2';
const DB = {
  data: {
    settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
    warehouses:[],products:[],persons:[],invoices:[],transactions:[],stockMoves:[]

      if(raw){
        const parsed = JSON.parse(raw);

        this.data.invoices.forEach(inv=>{
          if(inv.shippingCost===undefined)inv.shippingCost=0;
          if(inv.customsCost===undefined)inv.customsCost=0;
          if(inv.paidAmount===undefined)inv.paidAmount = inv.paid? inv.total : 0;
        });
      }
    }catch(e){console.error(e);}
  },
  save(){
    try{localStorage.setItem(DB_KEY,JSON.stringify(this.data));}

  },

      settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
      warehouses:[],products:[],persons:[],invoices:[],transactions:[],stockMoves:[]
    };
    this.save();
  },
  resetAccounting(){
    this.data.invoices = [];
    this.data.transactions = [];
    this.data.stockMoves = [];
    this.save();
  }
};

/* =========================================================
   محاسبات
   ========================================================= */
function stockOf(productId,warehouseId=null,excludeInvoiceId=null){
  let total = 0;
  for(const m of DB.data.stockMoves){
    if(m.productId!==productId)continue;
    if(warehouseId && m.warehouseId!==warehouseId)continue;
    if(excludeInvoiceId && m.refId===excludeInvoiceId)continue;
    total += (m.type==='in'? m.qty : -m.qty);
  }
  return total;
}

function avgCostOf(productId, excludeInvoiceId=null){
  const ins = DB.data.stockMoves
    .filter(m=>m.productId===productId && m.type==='in' && m.refId!==excludeInvoiceId)
    .map(m=>{
      const inv = DB.data.invoices.find(i=>i.id===m.refId);
      return {qty:m.qty, inv, date:m.date};
    })
    .sort((a,b)=>a.date.localeCompare(b.date));

  const product = DB.data.products.find(p=>p.id===productId);
  let basePrice = product?.purchasePrice || 0;

  let totalQty = 0;
  let totalValue = 0;
  for(const x of ins){
    if(!x.inv)continue;
    const item = x.inv.items.find(it=>it.productId===productId);
    if(!item)continue;
    const itemSubtotal = item.qty * item.price;
    const invoiceItemsSum = x.inv.items.reduce((s,it)=>s+it.qty*it.price,0);
    const ratio = invoiceItemsSum>0 ? itemSubtotal/invoiceItemsSum : 0;
    const shippingShare = (x.inv.shippingCost||0) * ratio;
    const customsShare = (x.inv.customsCost||0) * ratio;
    const itemCost = itemSubtotal + shippingShare + customsShare;
    totalQty += item.qty;
    totalValue += itemCost;
  }
  if(totalQty<=0) return basePrice;
  return totalValue/totalQty;
}

function personBalance(personId){
  let bal = 0;
  for(const inv of DB.data.invoices){
    if(inv.personId!==personId)continue;
    const remaining = inv.total - (inv.paidAmount||0);
    if(remaining<=0)continue;
    if(inv.type==='sale') bal -= remaining;
    if(inv.type==='purchase') bal += remaining;
  }
  for(const t of DB.data.transactions){
    if(t.type==='receive' && t.personId===personId) bal += t.amount;
    if(t.type==='pay' && t.personId===personId) bal -= t.amount;
    if(t.type==='transfer'){
      if(t.personId===personId) bal += t.amount;
      if(t.toPersonId===personId) bal -= t.amount;
    }
  }
  return bal;
}
function personBalanceLabel(bal){
  if(Math.abs(bal)<1) return {text:'تسویه',cls:'badge-gray'};
  if(bal>0) return {text:'بستانکار',cls:'badge-success'};
  return {text:'بدهکار',cls:'badge-danger'};
}

function stockValue(){
  let v=0;
  for(const p of DB.data.products){
    const q = stockOf(p.id);
    if(q>0) v += q * avgCostOf(p.id);
  }
  return v;
}

function totals(){
  let sales=0,purchases=0;
  for(const inv of DB.data.invoices){
    if(inv.type==='sale') sales += inv.total;
    if(inv.type==='purchase') purchases += inv.total;
  }
  let cogs = 0;
  for(const inv of DB.data.invoices){
    if(inv.type!=='sale')continue;
    for(const it of inv.items){
      cogs += avgCostOf(it.productId) * it.qty;
    }
  }
  const profit = sales - cogs;
  let receivable=0,payable=0;
  for(const p of DB.data.persons){
    const b = personBalance(p.id);
    if(b<0) receivable += -b;
    if(b>0) payable += b;
  }
  let cash = DB.data.settings.initialCapital||0;
  for(const inv of DB.data.invoices){
    if(inv.type==='sale') cash += (inv.paidAmount||0);
    if(inv.type==='purchase') cash -= (inv.paidAmount||0);
  }
  for(const t of DB.data.transactions){
    if(t.type==='receive') cash += t.amount;
    if(t.type==='pay') cash -= t.amount;
  }
  return {sales,purchases,cogs,profit,receivable,payable,cash};
}

function currentCapital(){
  const t = totals();
  const stockVal = stockValue();
  return t.cash + stockVal + t.receivable - t.payable;
}

    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{family:'Estedad',weight:'600'}}}},scales:{y:{ticks:{font:{family:'Estedad'},callback:v=>formatNum(v)}},x:{ticks:{font:{family:'Estedad'}}}}}

function monthName(m){
  const names=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const p=m.split('/'); if(p.length<2)return m;
  return names[(Number(p[1])-1)]+' '+p[0].slice(2);
}
function lastSixMonths(){

  const arr=[];let y=j.jy,m=j.jm;
  for(let i=0;i<6;i++){arr.unshift(`${y}/${String(m).padStart(2,'0')}`);m--;if(m<1){m=12;y--;}}
  return arr;
}

function quickTx(personId, type){

  if(!p){toast('شخص یافت نشد','error');return;}
  const isReceive = type==='receive';
  const title = isReceive? `📥 دریافت وجه از ${p.name}` : `📤 پرداخت وجه به ${p.name}`;
  openModal(title, `
    <div class="form-group">
      <label class="form-label">تاریخ</label>
      <input class="form-control" id="qtxDate" value="${todayJalali()}" dir="ltr">
    </div>
    <div class="form-group">
      <label class="form-label">مبلغ *</label>
      <input class="form-control" data-thousands id="qtxAmount" value="0" placeholder="0">
    </div>
    <div class="form-group">
      <label class="form-label">توضیحات (اختیاری)</label>
      <input class="form-control" id="qtxNote" value="${isReceive?'دریافت وجه':'پرداخت وجه'}">
    </div>
    <div class="text-muted" style="font-size:11px;margin-top:8px">
      ${isReceive 
        ? '💡 مبلغی که از این شخص دریافت می‌کنید به صندوق اضافه شده و از بدهی او کم می‌شود.' 
        : '💡 مبلغی که به این شخص پرداخت می‌کنید از صندوق کم شده و از بدهی شما به او کم می‌شود.'}
    </div>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
    <button class="btn ${isReceive?'btn-success':'btn-danger'}" onclick="saveQuickTx('${personId}','${type}')">
      ${isReceive?'📥 ثبت دریافت':'📤 ثبت پرداخت'}
    </button>
  `);
  setTimeout(()=>{
    const inp = $('#qtxAmount');
    if(inp){ inp.focus(); inp.select(); }
  }, 50);
}

function saveQuickTx(personId, type){
  const date = $('#qtxDate').value.trim();
  if(!validJalali(date)){toast('تاریخ معتبر نیست','error');return;}
  const amount = parseNum($('#qtxAmount').value);
  if(amount<=0){toast('مبلغ را وارد کنید','error');return;}
  const note = $('#qtxNote').value.trim();
  DB.data.transactions.push({
    id: uid(),
    date,
    type,
    personId,
    amount,
    note
  });
  DB.save();
  closeModal();
  renderPersons();
  toast(type==='receive'?'دریافت ثبت شد':'پرداخت ثبت شد','success');
}

   ========================================================= */
function personLedger(id){
  const p = DB.data.persons.find(x=>x.id===id);
  const rows = [];
  // فاکتورها
  for(const inv of DB.data.invoices){
    if(inv.personId===id){
      const rem = inv.total - (inv.paidAmount||0);
      rows.push({
        date:inv.date,
        desc:`فاکتور ${inv.type==='sale'?'فروش':'خرید'} #${inv.number}${rem>0?' (نسیه)':''}`,
        amount:inv.total,
        type:inv.type,
        refType:'invoice',
        refId:inv.id
      });
    }
  }
  // تراکنش‌ها
  for(const t of DB.data.transactions){
    if(t.personId===id || t.toPersonId===id){
      let desc = t.type==='receive'?'دریافت وجه':t.type==='pay'?'پرداخت وجه':'انتقال';
      if(t.type==='transfer'){
        const other = t.personId===id? t.toPersonId : t.personId;
        const op = DB.data.persons.find(x=>x.id===other);
        desc = `انتقال ${t.personId===id?'به':'از'} ${op?.name||'?'}`;
      }
      rows.push({
        date:t.date,
        desc,
        amount:t.amount,
        type:t.type,
        refType:'transaction',
        refId:t.id
      });
    }
  }
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  const bal = personBalance(id);
  const label = personBalanceLabel(bal);
  openModal(`گردش حساب: ${p.name}`,`
    <div class="flex justify-between mb-3 flex-wrap gap-2">
      <div class="text-muted">تعداد تراکنش: ${rows.length}</div>
      <div>وضعیت: <span class="badge ${label.cls}">${label.text} ${formatMoney(Math.abs(bal))}</span></div>
    </div>
    <div class="table-wrap"><table><thead><tr>
      <th>تاریخ</th><th>شرح</th><th>مبلغ</th><th>نوع</th><th>عملیات</th>
    </tr></thead><tbody>
      ${rows.length? rows.map(r=>`<tr>
        <td class="num">${r.date}</td>
        <td>${r.desc}</td>
        <td class="num">${formatNum(r.amount)}</td>
        <td><span class="badge ${r.type==='sale'?'badge-success':r.type==='purchase'?'badge-danger':r.type==='receive'?'badge-info':'badge-warning'}">${r.type==='sale'?'فروش':r.type==='purchase'?'خرید':r.type==='receive'?'دریافت':r.type==='pay'?'پرداخت':'انتقال'}</span></td>
        <td style="white-space:nowrap">
          ${r.refType==='invoice'?`
            <button class="btn btn-sm btn-ghost" onclick="closeModal();viewInvoice('${r.refId}')" title="مشاهده فاکتور">👁</button>
            <button class="btn btn-sm btn-warning" onclick="closeModal();invoiceForm('${r.type}','${r.refId}')" title="ویرایش فاکتور">✏️</button>
          `:`
            <button class="btn btn-sm btn-warning" onclick="closeModal();txForm('${r.type}','${r.refId}')" title="ویرایش تراکنش">✏️</button>
          `}
        </td>
      </tr>`).join('') : '<tr><td colspan="5" class="text-center text-muted">موردی ثبت نشده</td></tr>'}
    </tbody></table></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">بستن</button>`,'lg');
}

function nextInvoiceNumber(type){
  const prefix = type==='sale'?'F':'P';
  const nums = DB.data.invoices.filter(i=>i.type===type).map(i=>Number(i.number.replace(/\D/g,''))||0);
  return prefix + '-' + String((Math.max(0,...nums)+1)).padStart(4,'0');
}

function renderInvoiceItems(){
  const body = $('#invItemsBody');
  if(!body)return;
  if(!invoiceItems.length){
    body.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:16px">ردیفی اضافه نشده</td></tr>';
    recalcInvoice();
    return;
  }
  body.innerHTML = invoiceItems.map((it,idx)=>invoiceItemsRowHTML(it,idx)).join('');
  attachAllThousandsIn(body);
  recalcInvoice();
}

function invoiceItemsRowHTML(it,idx){
  return `<tr data-row="${idx}">
    <td class="col-product">
      <select class="form-control product-select" onchange="updateItemProduct(${idx},this.value)">
        <option value="">— انتخاب کالا —</option>
        ${DB.data.products.map(x=>`<option value="${x.id}" ${x.id===it.productId?'selected':''}>${x.code? '['+x.code+'] ':''}${x.name}</option>`).join('')}
      </select>
    </td>
    <td class="col-qty"><input class="form-control num" type="number" min="1" value="${it.qty}" oninput="updateItemQty(${idx},this.value)" style="width:100%"></td>
    <td class="col-price"><input class="form-control num" data-thousands value="${formatNum(it.price)}" oninput="updateItemPrice(${idx},this.value)" style="width:100%"></td>
    <td class="col-total"><span class="num" style="font-weight:700">${formatNum(it.qty*it.price)}</span></td>
    <td class="col-act"><button class="btn btn-sm btn-danger" onclick="removeInvoiceItem(${idx})" title="حذف">✕</button></td>
  </tr>`;
}

function updateItemProduct(idx,val){
  invoiceItems[idx].productId = val;
  if(val){
    const p = DB.data.products.find(x=>x.id===val);
    if(p && !invoiceItems[idx].price){
      const type = $('#invNumber').value.startsWith('F')?'sale':'purchase';
      invoiceItems[idx].price = type==='purchase'? (p.purchasePrice||0) : (p.salePrice||0);
      const row = $(`#invItemsBody tr[data-row="${idx}"]`);
      if(row){ const pi = $('.col-price input',row); if(pi) pi.value = formatNum(invoiceItems[idx].price); }
    }
  }
  updateRowTotal(idx);
  recalcInvoice();
}
function updateItemQty(idx,val){
  invoiceItems[idx].qty = Math.max(1,Number(val)||1);
  updateRowTotal(idx);
  recalcInvoice();
}
function updateItemPrice(idx,val){
  invoiceItems[idx].price = parseNum(val);
  updateRowTotal(idx);
  recalcInvoice();
}
function updateRowTotal(idx){
  const row = $(`#invItemsBody tr[data-row="${idx}"]`);
  if(!row)return;
  const cell = $('.col-total .num',row);
  if(cell) cell.textContent = formatNum(invoiceItems[idx].qty*invoiceItems[idx].price);
}
function addInvoiceItem(){ invoiceItems.push({productId:'',qty:1,price:0}); renderInvoiceItems(); }
function removeInvoiceItem(idx){ invoiceItems.splice(idx,1); renderInvoiceItems(); }

function recalcInvoice(){
  const subtotal = invoiceItems.reduce((s,i)=>s+(i.qty*i.price),0);
  const shipping = parseNum($('#invShipping')?.value||0);
  const customs = parseNum($('#invCustoms')?.value||0);
  const paid = parseNum($('#invPaidAmount')?.value||0);
  const total = subtotal + shipping + customs;
  const remaining = total - paid;
  if($('#invSubtotal'))$('#invSubtotal').textContent = formatNum(subtotal);
  if($('#invShipShow'))$('#invShipShow').textContent = formatNum(shipping);
  if($('#invCustShow'))$('#invCustShow').textContent = formatNum(customs);
  if($('#invTotal'))$('#invTotal').textContent = formatNum(total);
  if($('#invPaidShow'))$('#invPaidShow').textContent = formatNum(paid);
  if($('#invRemShow'))$('#invRemShow').textContent = formatNum(remaining);
}

function saveInvoice(type,editId){
  if(editId){
    const inv = DB.data.invoices.find(x=>x.id===editId);
    if(inv) type = inv.type;
  }
  const personId = $('#invPerson').value;
  const whId = $('#invWh').value;
  const date = $('#invDate').value.trim();
  if(!personId){toast('شخص را انتخاب کنید','error');return;}
  if(!whId){toast('انبار را انتخاب کنید','error');return;}
  if(!validJalali(date)){toast('تاریخ معتبر نیست (مثال: 1403/01/01)','error');return;}
  if(!invoiceItems.length){toast('حداقل یک ردیف اضافه کنید','error');return;}
  if(invoiceItems.some(i=>!i.productId)){toast('کالای هر ردیف را انتخاب کنید','error');return;}

  if(type==='sale'){
    for(const it of invoiceItems){
      const avail = stockOf(it.productId,whId,editId||null);
      if(avail < it.qty){
        const p = DB.data.products.find(x=>x.id===it.productId);
        toast(`موجودی کالای "${p.name}" کافی نیست (موجودی: ${avail})`,'error');
        return;
      }
    }
  }

  const subtotal = invoiceItems.reduce((s,i)=>s+(i.qty*i.price),0);
  const shippingCost = parseNum($('#invShipping').value);
  const customsCost = parseNum($('#invCustoms').value);
  const paidAmount = parseNum($('#invPaidAmount').value);
  const total = subtotal + shippingCost + customsCost;
  const number = $('#invNumber').value.trim();
  const note = $('#invNote').value.trim();

  if(editId){
    DB.data.stockMoves = DB.data.stockMoves.filter(m=>m.refId!==editId);
    const inv = DB.data.invoices.find(x=>x.id===editId);
    Object.assign(inv,{personId,warehouseId:whId,date,items:invoiceItems.map(i=>({...i})),shippingCost,customsCost,total,paidAmount,number,note});
    for(const it of invoiceItems){
      DB.data.stockMoves.push({id:uid(),date,type:type==='purchase'?'in':'out',productId:it.productId,warehouseId:whId,qty:it.qty,refType:'invoice',refId:editId});
    }
  } else {
    const id = uid();
    DB.data.invoices.push({id,type,number,date,personId,warehouseId:whId,items:invoiceItems.map(i=>({...i})),shippingCost,customsCost,total,paidAmount,note,createdAt:nowJalaliFull()});
    for(const it of invoiceItems){
      DB.data.stockMoves.push({id:uid(),date,type:type==='purchase'?'in':'out',productId:it.productId,warehouseId:whId,qty:it.qty,refType:'invoice',refId:id});
    }
  }
  DB.save(); closeModal(); renderInvoices(); toast('فاکتور ذخیره شد','success');
}

function renderTransactions(){
  const list = [...DB.data.transactions].sort((a,b)=>b.date.localeCompare(a.date));
  $('#content').innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <div class="text-muted">دریافت، پرداخت و انتقال بین اشخاص</div>
      <div class="flex gap-2">
        <button class="btn btn-success" onclick="txForm('receive')">📥 دریافت</button>
        <button class="btn btn-danger" onclick="txForm('pay')">📤 پرداخت</button>
        <button class="btn btn-warning" onclick="txForm('transfer')">🔁 انتقال</button>
      </div>
    </div>
    <div class="card"><div class="table-wrap"><table><thead><tr>
      <th>تاریخ</th><th>نوع</th><th>از / به</th><th>مبلغ</th><th>توضیح</th><th>عملیات</th>
    </tr></thead><tbody>
      ${list.length? list.map(t=>{
        let who='-';
        if(t.type==='receive'||t.type==='pay'){
          const p = DB.data.persons.find(x=>x.id===t.personId); who = p?.name||'?';
        } else if(t.type==='transfer'){
          const from = DB.data.persons.find(x=>x.id===t.personId);
          const to = DB.data.persons.find(x=>x.id===t.toPersonId);
          who = `${from?.name||'?'} → ${to?.name||'?'}`;
        }
        return `<tr>
          <td class="num">${t.date}</td>
          <td><span class="badge ${t.type==='receive'?'badge-success':t.type==='pay'?'badge-danger':'badge-warning'}">${t.type==='receive'?'دریافت':t.type==='pay'?'پرداخت':'انتقال'}</span></td>
          <td>${who}</td>
          <td class="num">${formatNum(t.amount)}</td>
          <td>${t.note||'-'}</td>
          <td>
            <button class="btn btn-sm btn-warning" onclick="txForm('${t.type}','${t.id}')" title="ویرایش">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="deleteTx('${t.id}')" title="حذف">🗑</button>
          </td></tr>`;
      }).join('') : `<tr><td colspan="6"><div class="empty"><div class="icon">💸</div><div class="title">تراکنشی ثبت نشده</div></div></td></tr>`}
    </tbody></table></div></div>`;
}
function txForm(type, editId=null){
  if(!DB.data.persons.length){toast('ابتدا شخص اضافه کنید','warning');return;}
  const existing = editId? DB.data.transactions.find(t=>t.id===editId) : null;
  if(existing) type = existing.type;
  const isTransfer = type==='transfer';
  openModal(
    (type==='receive'?'ثبت دریافت وجه':type==='pay'?'ثبت پرداخت وجه':'انتقال بین اشخاص')+(editId?' (ویرایش)':''),
    `
    <div class="form-group"><label class="form-label">تاریخ</label><input class="form-control" id="txDate" value="${existing?existing.date:todayJalali()}" dir="ltr"></div>
    ${isTransfer? `
      <div class="form-group"><label class="form-label">از شخص (پرداخت‌کننده) *</label>
        <select class="form-control" id="txFrom">
          <option value="">انتخاب</option>
          ${DB.data.persons.map(p=>`<option value="${p.id}" ${existing&&existing.personId===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">به شخص (دریافت‌کننده) *</label>
        <select class="form-control" id="txTo">
          <option value="">انتخاب</option>
          ${DB.data.persons.map(p=>`<option value="${p.id}" ${existing&&existing.toPersonId===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select></div>
      <p class="text-muted" style="font-size:11px;margin-bottom:8px">
        💡 انتقال یعنی شخص «از» پول را مستقیم به شخص «به» می‌دهد (بدون دخالت صندوق شما). بدهی/طلب هر دو نفر به‌روز می‌شود.
      </p>
    `:`
      <div class="form-group"><label class="form-label">شخص *</label>
        <select class="form-control" id="txPerson">
          <option value="">انتخاب</option>
          ${DB.data.persons.map(p=>`<option value="${p.id}" ${existing&&existing.personId===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select></div>
    `}
    <div class="form-group"><label class="form-label">مبلغ *</label><input class="form-control" data-thousands id="txAmount" value="${existing?formatNum(existing.amount):'0'}"></div>
    <div class="form-group"><label class="form-label">توضیحات</label><input class="form-control" id="txNote" value="${existing?existing.note||'':''}"></div>
    `,
    `<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
     <button class="btn btn-primary" onclick="saveTx('${type}','${editId||''}')">ذخیره</button>`
  );
}
function saveTx(type, editId=''){
  if(editId){
    const ex = DB.data.transactions.find(t=>t.id===editId);
    if(ex) type = ex.type;
  }
  const date = $('#txDate').value.trim();
  if(!validJalali(date)){toast('تاریخ معتبر نیست','error');return;}
  const amount = parseNum($('#txAmount').value);
  if(amount<=0){toast('مبلغ را وارد کنید','error');return;}
  const note = $('#txNote').value.trim();
  const obj = {date,type,amount,note};
  if(type==='transfer'){
    const from = $('#txFrom').value;
    const to = $('#txTo').value;
    if(!from||!to){toast('هر دو شخص را انتخاب کنید','error');return;}
    if(from===to){toast('اشخاص باید متفاوت باشند','error');return;}
    obj.personId = from; obj.toPersonId = to;
  } else {
    const person = $('#txPerson').value;
    if(!person){toast('شخص را انتخاب کنید','error');return;}
    obj.personId = person;
  }
  if(editId){
    const ex = DB.data.transactions.find(t=>t.id===editId);
    Object.assign(ex,obj);
  } else {
    DB.data.transactions.push({id:uid(),...obj});
  }
  DB.save(); closeModal(); renderTransactions(); toast('تراکنش ذخیره شد','success');
}
function deleteTx(id){
  confirmAction('حذف این تراکنش؟',()=>{
    DB.data.transactions = DB.data.transactions.filter(t=>t.id!==id);
    DB.save(); renderTransactions(); toast('حذف شد','success');
  });
}

        <div class="form-group"><label class="form-label">تاریخ شروع</label><input class="form-control" id="capDate" value="${DB.data.settings.initialCapitalDate||todayJalali()}" dir="ltr"></div>
      </div>
      <button class="btn btn-primary" onclick="saveCapital()">💾 ذخیره سرمایه اولیه</button>
    </div>
  `;
  setTimeout(()=>attachAllThousandsIn($('#content')),10);
}
function saveCapital(){
  DB.data.settings.initialCapital = parseNum($('#capVal').value);
  DB.data.settings.initialCapitalDate = $('#capDate').value.trim();
  DB.save(); toast('سرمایه اولیه ذخیره شد','success'); renderCapital();
}

/* =========================================================
   گزارش‌ها
   ========================================================= */
function renderReports(){
  const t = totals();
  const months = lastSixMonths();
  const monthSales = months.map(m=>{let s=0;for(const i of DB.data.invoices){if(i.type==='sale'&&jalaliMonth(i.date)===m)s+=i.total;}return s;});
  const monthPurchases = months.map(m=>{let s=0;for(const i of DB.data.invoices){if(i.type==='purchase'&&jalaliMonth(i.date)===m)s+=i.total;}return s;});
  const lowStock = DB.data.products.filter(p=>stockOf(p.id)<=p.minStock);
  $('#content').innerHTML = `
    <div class="grid grid-4 mb-4">
      <div class="stat s-success"><div class="stat-label">کل فروش</div><div class="stat-value">${formatMoney(t.sales)}</div></div>
      <div class="stat s-danger"><div class="stat-label">کل خرید</div><div class="stat-value">${formatMoney(t.purchases)}</div></div>
      <div class="stat s-info"><div class="stat-label">سود ناخالص</div><div class="stat-value">${formatMoney(t.profit)}</div></div>
      <div class="stat"><div class="stat-label">ارزش انبار</div><div class="stat-value">${formatMoney(stockValue())}</div></div>
    </div>
    <div class="grid grid-2 mb-4">
      <div class="card"><div class="card-header"><div class="card-title">فروش و خرید ماهانه</div></div><canvas id="rChart1" height="220"></canvas></div>
      <div class="card"><div class="card-header"><div class="card-title">کالاهای کم‌موجود</div></div>
        ${lowStock.length? `<div class="table-wrap"><table><thead><tr><th>کالا</th><th>موجودی</th><th>حداقل</th></tr></thead><tbody>
          ${lowStock.map(p=>`<tr><td>${p.name}</td><td class="num text-danger">${formatNum(stockOf(p.id))}</td><td class="num">${formatNum(p.minStock)}</td></tr>`).join('')}
        </tbody></table></div>`:'<div class="empty"><div class="icon">✓</div><div class="title">همه کالاها موجودی کافی دارند</div></div>'}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">گزارش موجودی و بهای تمام‌شده</div></div>
      <div class="table-wrap"><table><thead><tr><th>کد</th><th>کالا</th><th>موجودی</th><th>میانگین بهای تمام‌شده</th><th>ارزش موجودی</th></tr></thead><tbody>
        ${DB".data.products value.length? DB.data.products.map(p=>{
          const q = stockOf(p.id);
          const avg = avgCostOf(p.id);
          return `<tr><td>${p.code||'-'}</td><td>${p.name}</td><td class="num ${q<=p.minStock?'text-danger':''}">${formatNum(q)}</td><td class="num" style="color:var(--info);font-weight:700">${formatNum(avg)}</td><td class="num">${formatNum(q*avg)}</td></tr>`;
        }).join('') : '<tr><td colspan="5" class="text-center text-muted">کالایی نیست</td></tr>'}
      </tbody></table></div>
    </div>
  `;
  setTimeout(()=>{
    new Chart($('#rChart1'),{
      type:'line',data:{labels:months.map(m=>monthName(m)),datasets:[
        {label:'فروش',data:monthSales,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.1)',tension:.35,fill:true,borderWidth:3},
        {label:'خرید',data:monthPurchases,borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,.1)',tension:.35,fill:true,borderWidth:3}
      ]},
      options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{family:'Estedad',weight:'600'}}}},scales:{y:{ticks:{font:{family:'Estedad'},callback:v=>formatNum(v)}},x:{ticks:{font:{family:'Estedad'}}}}}
    });
  },10);
}

/* =========================================================
   تنظیمات
   ========================================================= */
function renderSettings(){
  const s = DB.data.settings;
  $('#content').innerHTML = `
    <div class="grid grid-2">
      <div class="card">
        <div class="card-header"><div class="card-title">تنظیمات عمومی</div></div>
        <div class="form-group"><label class="form-label">نام فروشگاه</label><input class="form-control" id="setShop="${s.shopName}"></div>
        <div class="form-group"><label class="form-label">واحد پول</label>
          <select class="form-control" id="setCurrency">
            <option value="تومان" ${s.currency==='تومان'?'selected':''}>تومان</option>
            <option value="ریال" ${s.currency==='ریال'?'selected':''}>ریال</option>
          </select></div>
        <button class="btn btn-primary" onclick="saveSettings()">💾 ذخیره تنظیمات</button>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">پشتیبان‌گیری</div></div>
        <p class="text-muted mb-3">اطلاعات را در فایل JSON ذخیره یا بازیابی کنید.</p>
        <div class="flex gap-2" style="flex-wrap:wrap">
          <button class="btn btn-primary" onclick="exportData()">📤 دریافت فایل پشتیبان</button>
          <label class="btn btn-success" style="cursor:pointer">
            📥 بازیابی از فایل
            <input type="file" accept=".json" onchange="importData(event)" style="display:none">
          </label>
        </div>
        <div class="divider"></div>
        <div class="card-header"><div class="card-title text-danger">منطقه خطر</div></div>
        <div class="flex gap-2" style="flex-wrap:wrap">
          <button class="btn btn-warning" onclick="resetAccountingData()">🧹 حذف اطلاعات حسابداری</button>
          <button class="btn btn-danger" onclick="resetAllData()">🗑 حذف کل اطلاعات</button>
        </div>
        <p class="text-muted mt-3" style="font-size:11px">
          - «حذف اطلاعات حسابداری» فقط فاکتورها، تراکنش‌ها و گردش انبار را پاک می‌کند.<br>
          - «حذف کل اطلاعات» همه چیز را پاک می‌کند.
        </p>
      </div>
    </div>
    <div class="card mt-4">
      <div class="card-header"><div class="card-title">اطلاعات سیستم</div></div>
      <div class="grid grid-4">
        <div class="stat"><div class="stat-label">اشخاص</div><div class="stat-value">${formatNum(DB.data.persons.length)}</div></div>
        <div class="stat"><div class="stat-label">کالاها</div><div class="stat-value">${formatNum(DB.data.products.length)}</div></div>
        <div class="stat"><div class="stat-label">انبارها</div><div class="stat-value">${formatNum(DB.data.warehouses.length)}</div></div>
        <div class="stat"><div class="stat-label">فاکتورها</div><div class="stat-value">${formatNum(DB.data.invoices.length)}</div></div>
      </div>
    </div>
  `;
}
function saveSettings(){
  DB.data.settings.shopName = $('#setShop').value.trim()||'فروشگاه من';
  DB.data.settings.currency = $('#setCurrency').value;
  DB.save();
  $('#sidebarShopName').textContent = DB.data.settings.shopName;
  toast('تنظیمات ذخیره شد','success');
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB.data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('فایل پشتیبان دانلود شد','success');
}
function importData(e){
  const file = e.target.files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      confirmAction('اطلاعات فعلی جایگزین شود؟',()=>{
        DB.data = {...DB.data,...parsed};
        DB.save();
        $('#sidebarShopName').textContent = DB.data.settings.shopName;
        toast('بازیابی انجام شد','success');
        navigate('dashboard');
      });
    }catch(err){toast('فایل معتبر نیست','error');}
  };
  reader.readAsText(file);
  e.target.value='';
}
function resetAccountingData(){
  confirmAction('همه فاکتورها، تراکنش‌ها و گردش انبار پاک شوند؟ (اشخاص، کالاها و انبارها حفظ می‌شوند)',()=>{
    DB.resetAccounting();
    toast('اطلاعات حسابداری پاک شد','success');
    navigate('dashboard');
  });
}
function resetAllData(){
  confirmAction('⚠️ کل اطلاعات (فاکتورها، اشخاص، کالاها، انبارها) حذف شود؟ این عملیات برگشت‌پذیر نیست.',()=>{
    DB.resetAll();
    toast('همه اطلاعات پاک شد','success');
    navigate('dashboard');
  });
}

/* =========================================================
   شروع
   ========================================================= */
navigate('dashboard');
</script>
</body>
</html>
