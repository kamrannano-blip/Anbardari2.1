<style>
/* =====================================================
   🎨 طراحی جدید - 3D لوکس
   ===================================================== */
:root{
  --primary:#7c3aed;
  --primary-dark:#5b21b6;
  --primary-light:#f3e8ff;
  --primary-glow:rgba(124,58,237,.45);
  --accent:#f59e0b;
  --accent-dark:#d97706;
  --accent-glow:rgba(245,158,11,.4);
  --success:#10b981;
  --success-dark:#047857;
  --success-light:#d1fae5;
  --danger:#ef4444;
  --danger-dark:#b91c1c;
  --danger-light:#fee2e2;
  --warning:#f59e0b;
  --warning-dark:#b45309;
  --warning-light:#fef3c7;
  --info:#06b6d4;
  --info-dark:#0e7490;
  --info-light:#cffafe;
  --gray-50:#f8fafc;
  --gray-100:#f1f5f9;
  --gray-200:#e2e8f0;
  --gray-300:#cbd5e1;
  --gray-400:#94a3b8;
  --gray-500:#64748b;
  --gray-600:#475569;
  --gray-700:#334155;
  --gray-800:#1e293b;
  --gray-900:#0f172a;
  --radius:18px;
  --radius-sm:12px;
  --radius-lg:24px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.1);
  --shadow:0 4px 6px -1px rgba(15,23,42,.1),0 2px 4px -2px rgba(15,23,42,.06),0 1px 0 rgba(255,255,255,.9) inset;
  --shadow-md:0 10px 15px -3px rgba(15,23,42,.1),0 4px 6px -4px rgba(15,23,42,.05),0 1px 0 rgba(255,255,255,.9) inset;
  --shadow-lg:0 20px 25px -5px rgba(15,23,42,.12),0 8px 10px -6px rgba(15,23,42,.08),0 1px 0 rgba(255,255,255,.9) inset;
  --shadow-xl:0 25px 50px -12px rgba(15,23,42,.18),0 1px 0 rgba(255,255,255,.9) inset;
  --shadow-glow:0 0 40px var(--primary-glow);
  --shadow-gold:0 0 30px var(--accent-glow);
  --btn-3d-primary:0 4px 0 var(--primary-dark),0 6px 12px var(--primary-glow);
  --btn-3d-success:0 4px 0 var(--success-dark),0 6px 12px rgba(16,185,129,.4);
  --btn-3d-danger:0 4px 0 var(--danger-dark),0 6px 12px rgba(239,68,68,.4);
  --btn-3d-warning:0 4px 0 var(--warning-dark),0 6px 12px rgba(245,158,11,.4);
  --btn-3d-ghost:0 3px 0 var(--gray-300),0 3px 6px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Peyda','Estedad','Vazirmatn',sans-serif;
  font-weight:500;
  letter-spacing:-.01em;
  background:
    radial-gradient(circle at 15% 10%,rgba(124,58,237,.12) 0%,transparent 45%),
    radial-gradient(circle at 85% 20%,rgba(245,158,11,.1) 0%,transparent 45%),
    radial-gradient(circle at 50% 95%,rgba(6,182,212,.08) 0%,transparent 50%),
    linear-gradient(135deg,#f8fafc 0%,#f1f5f9 50%,#e2e8f0 100%);
  background-attachment:fixed;
  color:var(--gray-800);
  font-size:14px;
  line-height:1.7;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh}
.sidebar{
  width:270px;
  background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 40%,#312e81 100%);
  border-left:1px solid rgba(124,58,237,.3);
  padding:24px 0;
  position:fixed;
  top:0;right:0;bottom:0;
  overflow-y:auto;
  z-index:50;
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  box-shadow:-8px 0 30px rgba(15,23,42,.25),-2px 0 0 rgba(124,58,237,.4) inset;
}
.sidebar::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 100% 0%,rgba(245,158,11,.15) 0%,transparent 40%),
    radial-gradient(circle at 0% 100%,rgba(124,58,237,.2) 0%,transparent 50%);
  pointer-events:none;
}
.sidebar .brand{
  display:flex;align-items:center;gap:14px;
  padding:0 22px 22px;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:20px;
  position:relative;z-index:1;
}
.sidebar .brand-icon{
  width:52px;height:52px;
  background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 30%,#d97706 60%,#7c3aed 100%);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:24px;font-weight:900;
  box-shadow:0 6px 0 rgba(120,53,15,.5),0 10px 25px rgba(245,158,11,.5),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.2);
  transform:perspective(400px) rotateX(8deg);
  transition:transform .3s;
}
.sidebar .brand:hover .brand-icon{transform:perspective(400px) rotateX(-4deg) translateY(-2px)}
.sidebar .brand-text{font-weight:800;font-size:15px;color:#fff;letter-spacing:-.3px;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.sidebar .brand-sub{font-size:11px;color:rgba(255,255,255,.55);font-weight:500;letter-spacing:.5px}
.nav-item{
  display:flex;align-items:center;gap:14px;
  padding:12px 22px;margin:4px 12px;
  color:rgba(255,255,255,.65);
  cursor:pointer;font-weight:600;font-size:13.5px;
  border-radius:12px;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  user-select:none;
  position:relative;z-index:1;
  overflow:hidden;
}
.nav-item::before{
  content:'';
  position:absolute;
  right:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--accent),#fbbf24);
  border-radius:0 4px 4px 0;
  transform:scaleY(0);
  transition:transform .3s;
}
.nav-item:hover{background:rgba(124,58,237,.2);color:#fff;transform:translateX(-3px)}
.nav-item.active{
  background:linear-gradient(135deg,rgba(124,58,237,.9) 0%,rgba(139,92,246,.9) 60%,rgba(245,158,11,.7) 100%);
  color:#fff;
  box-shadow:0 4px 0 rgba(91,33,182,.6),0 8px 20px rgba(124,58,237,.5),inset 0 1px 0 rgba(255,255,255,.3);
  transform:translateY(-1px);
}
.nav-item.active::before{transform:scaleY(1)}
.nav-item.active .icon{filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));transform:scale(1.15)}
.nav-item .icon{font-size:20px;width:24px;text-align:center;display:inline-block;transition:transform .2s}
.main{margin-right:270px;flex:1;padding:28px 32px 130px;min-height:100vh;position:relative}
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:28px;flex-wrap:wrap;gap:12px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:16px 24px;
  border-radius:var(--radius-lg);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 8px 32px rgba(15,23,42,.06),0 1px 0 rgba(255,255,255,.9) inset;
  position:relative;
  overflow:hidden;
}
.topbar::before{
  content:'';
  position:absolute;top:0;right:0;left:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,58,237,.4),transparent);
}
.page-title{
  font-size:24px;font-weight:800;letter-spacing:-.7px;
  background:linear-gradient(135deg,#0f172a 0%,#7c3aed 50%,#d97706 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 3px rgba(124,58,237,.15));
}
.menu-toggle{display:none;background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:18px;box-shadow:var(--btn-3d-ghost);transition:all .15s}
.menu-toggle:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gray-300)}
.card{
  background:linear-gradient(145deg,#ffffff 0%,#f8fafc 100%);
  border-radius:var(--radius);
  padding:24px;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 20px 25px -5px rgba(15,23,42,.08),0 8px 10px -6px rgba(15,23,42,.06),0 1px 0 rgba(255,255,255,.9) inset,0 -1px 0 rgba(15,23,42,.03) inset;
  transition:all .4s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  top:-50%;right:-50%;
  width:200%;height:200%;
  background:radial-gradient(circle,rgba(124,58,237,.03) 0%,transparent 60%);
  pointer-events:none;
  opacity:0;
  transition:opacity .4s;
}
.card:hover::before{opacity:1}
.card:hover{
  transform:translateY(-6px) perspective(1000px) rotateX(1deg);
  box-shadow:0 30px 40px -10px rgba(15,23,42,.12),0 15px 20px -10px rgba(124,58,237,.1),0 1px 0 rgba(255,255,255,.9) inset;
}
.card-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;flex-wrap:wrap;gap:8px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(226,232,240,.6);
}
.card-title{font-size:16px;font-weight:800;color:var(--gray-800);letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.card-title::before{
  content:'';
  display:inline-block;
  width:4px;height:16px;
  background:linear-gradient(180deg,var(--primary),var(--accent));
  border-radius:2px;
  margin-left:8px;
  box-shadow:0 0 8px var(--primary-glow);
}
.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.stat{
  padding:22px;
  border-radius:var(--radius);
  background:linear-gradient(145deg,#ffffff 0%,#f8fafc 100%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 10px 25px -5px rgba(15,23,42,.08),0 4px 6px -4px rgba(15,23,42,.05),0 1px 0 rgba(255,255,255,.9) inset;
  position:relative;overflow:hidden;
  transition:all .4s cubic-bezier(.4,0,.2,1);
  transform-style:preserve-3d;
  cursor:pointer;
}
.stat::before{
  content:'';
  position:absolute;
  top:0;right:0;width:6px;height:100%;
  background:linear-gradient(180deg,var(--primary) 0%,#8b5cf6 50%,var(--accent) 100%);
  box-shadow:0 0 20px var(--primary-glow);
}
.stat::after{
  content:'';
  position:absolute;
  top:-30%;left:-30%;
  width:160%;height:160%;
  background:radial-gradient(circle,rgba(124,58,237,.08) 0%,transparent 50%);
  pointer-events:none;
  opacity:0;
  transition:opacity .4s;
}
.stat:hover::after{opacity:1}
.stat:hover{
  transform:translateY(-8px) perspective(1000px) rotateX(3deg);
  box-shadow:0 25px 35px -10px rgba(15,23,42,.15),0 20px 40px rgba(124,58,237,.15),0 1px 0 rgba(255,255,255,.9) inset;
}
.stat.s-success::before{background:linear-gradient(180deg,var(--success) 0%,#34d399 50%,#a7f3d0 100%);box-shadow:0 0 20px rgba(16,185,129,.5)}
.stat.s-success::after{background:radial-gradient(circle,rgba(16,185,129,.1) 0%,transparent 50%)}
.stat.s-danger::before{background:linear-gradient(180deg,var(--danger) 0%,#f87171 50%,#fca5a5 100%);box-shadow:0 0 20px rgba(239,68,68,.5)}
.stat.s-danger::after{background:radial-gradient(circle,rgba(239,68,68,.1) 0%,transparent 50%)}
.stat.s-warning::before{background:linear-gradient(180deg,var(--warning) 0%,#fbbf24 50%,#fde68a 100%);box-shadow:0 0 20px rgba(245,158,11,.5)}
.stat.s-warning::after{background:radial-gradient(circle,rgba(245,158,11,.1) 0%,transparent 50%)}
.stat.s-info::before{background:linear-gradient(180deg,var(--info) 0%,#22d3ee 50%,#a5f3fc 100%);box-shadow:0 0 20px rgba(6,182,212,.5)}
.stat.s-info::after{background:radial-gradient(circle,rgba(6,182,212,.1) 0%,transparent 50%)}
.stat-label{font-size:12.5px;color:var(--gray-500);margin-bottom:8px;font-weight:700;position:relative;z-index:1;letter-spacing:.2px}
.stat-value{font-size:23px;font-weight:800;color:var(--gray-900);letter-spacing:-.8px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.stat-value.positive{color:var(--success-dark)}
.stat-value.negative{color:var(--danger-dark)}
.stat-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:42px;opacity:.15;pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2));transition:all .4s}
.stat:hover .stat-icon{opacity:.25;transform:translateY(-50%) scale(1.15) rotate(-5deg)}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 22px;border-radius:var(--radius-sm);
  border:none;font-family:inherit;
  font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s cubic-bezier(.4,0,.2,1);
  white-space:nowrap;position:relative;
  letter-spacing:.2px;
}
.btn:active{transform:translateY(3px)}
.btn-primary{background:linear-gradient(180deg,#8b5cf6 0%,#7c3aed 50%,#6d28d9 100%);color:#fff;box-shadow:var(--btn-3d-primary)}
.btn-primary:hover{background:linear-gradient(180deg,#7c3aed 0%,#6d28d9 50%,#5b21b6 100%);box-shadow:0 5px 0 var(--primary-dark),0 8px 16px var(--primary-glow);transform:translateY(-2px)}
.btn-primary:active{box-shadow:0 1px 0 var(--primary-dark),0 2px 4px var(--primary-glow)}
.btn-success{background:linear-gradient(180deg,#34d399 0%,#10b981 50%,#059669 100%);color:#fff;box-shadow:var(--btn-3d-success)}
.btn-success:hover{background:linear-gradient(180deg,#10b981 0%,#059669 50%,#047857 100%);box-shadow:0 5px 0 var(--success-dark),0 8px 16px rgba(16,185,129,.45);transform:translateY(-2px)}
.btn-success:active{box-shadow:0 1px 0 var(--success-dark),0 2px 4px rgba(16,185,129,.3)}
.btn-danger{background:linear-gradient(180deg,#f87171 0%,#ef4444 50%,#dc2626 100%);color:#fff;box-shadow:var(--btn-3d-danger)}
.btn-danger:hover{background:linear-gradient(180deg,#ef4444 0%,#dc2626 50%,#b91c1c 100%);box-shadow:0 5px 0 var(--danger-dark),0 8px 16px rgba(239,68,68,.45);transform:translateY(-2px)}
.btn-danger:active{box-shadow:0 1px 0 var(--danger-dark),0 2px 4px rgba(239,68,68,.3)}
.btn-warning{background:linear-gradient(180deg,#fbbf24 0%,#f59e0b 50%,#d97706 100%);color:#fff;box-shadow:var(--btn-3d-warning)}
.btn-warning:hover{background:linear-gradient(180deg,#f59e0b 0%,#d97706 50%,#b45309 100%);box-shadow:0 5px 0 var(--warning-dark),0 8px 16px rgba(245,158,11,.45);transform:translateY(-2px)}
.btn-warning:active{box-shadow:0 1px 0 var(--warning-dark),0 2px 4px rgba(245,158,11,.3)}
.btn-ghost{background:linear-gradient(180deg,#ffffff 0%,#f1f5f9 100%);color:var(--gray-700);border:1px solid var(--gray-200);box-shadow:var(--btn-3d-ghost)}
.btn-ghost:hover{background:linear-gradient(180deg,#f8fafc 0%,#e2e8f0 100%);transform:translateY(-2px);box-shadow:0 4px 0 var(--gray-300),0 6px 12px rgba(15,23,42,.1)}
.btn-ghost:active{box-shadow:0 1px 0 var(--gray-300)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-icon{padding:10px;width:40px;height:40px;justify-content:center}
.quick-tx{width:36px;height:36px;padding:0;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer;font-size:16px;font-weight:800;transition:all .15s cubic-bezier(.4,0,.2,1);position:relative}
.quick-tx:active{transform:translateY(3px)}
.quick-tx-in{background:linear-gradient(180deg,#34d399 0%,#10b981 50%,#059669 100%);color:#fff;box-shadow:0 3px 0 #047857,0 5px 10px rgba(16,185,129,.4)}
.quick-tx-in:hover{background:linear-gradient(180deg,#10b981 0%,#059669 50%,#047857 100%);transform:translateY(-2px);box-shadow:0 5px 0 #047857,0 8px 14px rgba(16,185,129,.5)}
.quick-tx-out{background:linear-gradient(180deg,#f87171 0%,#ef4444 50%,#dc2626 100%);color:#fff;box-shadow:0 3px 0 #b91c1c,0 5px 10px rgba(239,68,68,.4)}
.quick-tx-out:hover{background:linear-gradient(180deg,#ef4444 0%,#dc2626 50%,#b91c1c 100%);transform:translateY(-2px);box-shadow:0 5px 0 #b91c1c,0 8px 14px rgba(239,68,68,.5)}
.quick-tx svg{width:18px;height:18px;stroke-width:3}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12.5px;font-weight:700;color:var(--gray-600);margin-bottom:8px;letter-spacing:.2px}
.form-control{
  width:100%;padding:12px 14px;
  border:2px solid var(--gray-200);
  border-radius:var(--radius-sm);
  font-family:inherit;font-size:13.5px;
  background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
  transition:all .25s cubic-bezier(.4,0,.2,1);
  color:var(--gray-800);
  box-shadow:0 1px 2px rgba(15,23,42,.05) inset;
  font-weight:500;
}
.form-control:hover{border-color:var(--gray-300);background:#fff}
.form-control:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.15),0 1px 2px rgba(15,23,42,.05) inset;transform:translateY(-1px)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
input[type=number]{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid rgba(226,232,240,.8);box-shadow:0 4px 6px -1px rgba(15,23,42,.05),0 1px 0 rgba(255,255,255,.9) inset;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
th{background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);padding:14px 16px;text-align:right;font-weight:800;color:var(--gray-700);font-size:12.5px;border-bottom:2px solid var(--gray-200);white-space:nowrap;letter-spacing:.2px}
td{padding:14px 16px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
tr:last-child td{border-bottom:none}
tbody tr{transition:all .2s;position:relative}
tbody tr:hover{background:linear-gradient(90deg,rgba(124,58,237,.05) 0%,rgba(124,58,237,.02) 50%,transparent 100%);transform:scale(1.002)}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-family:'Estedad','Vazirmatn',monospace}
.badge{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.2px;box-shadow:0 2px 4px rgba(15,23,42,.08),0 1px 0 rgba(255,255,255,.9) inset;border:1px solid transparent}
.badge-success{background:linear-gradient(180deg,#d1fae5 0%,#a7f3d0 100%);color:var(--success-dark);border-color:rgba(16,185,129,.2)}
.badge-danger{background:linear-gradient(180deg,#fee2e2 0%,#fecaca 100%);color:var(--danger-dark);border-color:rgba(239,68,68,.2)}
.badge-warning{background:linear-gradient(180deg,#fef3c7 0%,#fde68a 100%);color:var(--warning-dark);border-color:rgba(245,158,11,.2)}
.badge-info{background:linear-gradient(180deg,#cffafe 0%,#a5f3fc 100%);color:var(--info-dark);border-color:rgba(6,182,212,.2)}
.badge-gray{background:linear-gradient(180deg,#f1f5f9 0%,#e2e8f0 100%);color:var(--gray-600);border-color:var(--gray-200)}

<script>
/* ============ ابزارهای عمومی ============ */
const $ = (s,el)=> (el||document).querySelector(s);
const $$ = (s,el)=> Array.prototype.slice.call((el||document).querySelectorAll(s));

function formatNum(n){
  if(n===null||n===undefined||n==='')return '0';
  const num = Math.round(Number(n)||0);
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function parseNum(s){
  if(typeof s==='number')return s;
  if(!s)return 0;
  const cleaned = String(s).replace(/[,\u066B\u066C\s]/g,'');
  return Number(cleaned)||0;
}
function formatMoney(n){
  const cur = DB.data.settings.currency || 'تومان';
  return formatNum(n)+' '+cur;
}
function attachThousands(input){
  if(input._thousandsAttached)return;
  input._thousandsAttached = true;
  input.addEventListener('input',function(){
    const raw = input.value.replace(/[^\d-]/g,'');
    if(raw==='' || raw==='-'){input.value=raw;return;}
    input.value = formatNum(raw);
  });
}
function todayJalali(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return j.jy+'/'+String(j.jm).padStart(2,'0')+'/'+String(j.jd).padStart(2,'0');
}
function nowJalaliFull(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return j.jy+'/'+String(j.jm).padStart(2,'0')+'/'+String(j.jd).padStart(2,'0')+' - '+String(g.getHours()).padStart(2,'0')+':'+String(g.getMinutes()).padStart(2,'0');
}
function jalaliMonth(jstr){
  if(!jstr)return '';
  return jstr.split('/').slice(0,2).join('/');
}
function validJalali(s){
  if(!s)return false;
  const p = s.split('/').map(Number);
  if(p.length!==3)return false;
  try{return jalaali.isValidJalaaliDate(p[0],p[1],p[2]);}catch(e){return false;}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toast(msg,type){
  type = type || '';
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show '+type;
  clearTimeout(t._t);
  t._t = setTimeout(function(){t.classList.remove('show');},2500);
}
function openModal(title,body,footer,size){
  size = size || '';
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFooter').innerHTML = footer || '';
  $('#modalBox').className = 'modal '+(size==='lg'?'modal-lg':'');
  $('#modalOverlay').classList.add('show');
  attachAllThousandsIn($('#modalBody'));
  attachAllThousandsIn($('#modalFooter'));
}
function closeModal(){
  $('#modalOverlay').classList.remove('show');
  $('#modalBody').innerHTML='';
  $('#modalFooter').innerHTML='';
}
function attachAllThousandsIn(container){
  $$('input[data-thousands]',container).forEach(attachThousands);
}
function confirmAction(msg,onYes){
  openModal('تأیید عملیات',
    '<p style="font-size:14px;line-height:1.9">'+msg+'</p>',
    '<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>'+
    '<button class="btn btn-danger" id="confirmYes">بله، انجام بده</button>'
  );
  $('#confirmYes').onclick = function(){closeModal();onYes();};
}

/* ============ دیتابیس ============ */
const DB_KEY = 'hesabdar_v2';
const DB = {
  data: {
    settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
    warehouses:[],products:[],persons:[],invoices:[],transactions:[],stockMoves:[]
  },
  load:function(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        this.data = Object.assign({}, this.data, parsed);
        this.data.settings = Object.assign({shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0}, this.data.settings);
        this.data.invoices.forEach(function(inv){
          if(inv.shippingCost===undefined)inv.shippingCost=0;
          if(inv.customsCost===undefined)inv.customsCost=0;
          if(inv.paidAmount===undefined)inv.paidAmount = inv.paid? inv.total : 0;
        });
      }
    }catch(e){console.error(e);}
  },
  save:function(){
    try{localStorage.setItem(DB_KEY,JSON.stringify(this.data));}
    catch(e){toast('خطا در ذخیره اطلاعات','error');}
  },
  resetAll:function(){
    this.data = {
      settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
      warehouses:[],products:[],persons:[],invoices:[],transactions:[],stockMoves:[]
    };
    this.save();
  },
  resetAccounting:function(){
    this.data.invoices = [];
    this.data.transactions = [];
    this.data.stockMoves = [];
    this.save();
  }
};
DB.load();

/* ============ محاسبات ============ */
function stockOf(productId,warehouseId,excludeInvoiceId){
  let total = 0;
  for(const m of DB.data.stockMoves){
    if(m.productId!==productId)continue;
    if(warehouseId && m.warehouseId!==warehouseId)continue;
    if(excludeInvoiceId && m.refId===excludeInvoiceId)continue;
    total += (m.type==='in'? m.qty : -m.qty);
  }
  return total;
}
function avgCostOf(productId, excludeInvoiceId){
  const ins = DB.data.stockMoves
    .filter(function(m){return m.productId===productId && m.type==='in' && m.refId!==excludeInvoiceId;})
    .map(function(m){
      const inv = DB.data.invoices.find(function(i){return i.id===m.refId;});
      return {qty:m.qty, inv:inv, date:m.date};
    })
    .sort(function(a,b){return a.date.localeCompare(b.date);});
  const product = DB.data.products.find(function(p){return p.id===productId;});
  let basePrice = product ? (product.purchasePrice || 0) : 0;
  let totalQty = 0;
  let totalValue = 0;
  for(const x of ins){
    if(!x.inv)continue;
    const item = x.inv.items.find(function(it){return it.productId===productId;});
    if(!item)continue;
    const itemSubtotal = item.qty * item.price;
    const invoiceItemsSum = x.inv.items.reduce(function(s,it){return s+it.qty*it.price;},0);
    const ratio = invoiceItemsSum>0 ? itemSubtotal/invoiceItemsSum : 0;
    const shippingShare = (x.inv.shippingCost||0) * ratio;
    const customsShare = (x.inv.customsCost||0) * ratio;
    const itemCost = itemSubtotal + shippingShare + customsShare;
    totalQty += item.qty;
    totalValue += itemCost;
  }
  if(totalQty<=0) return basePrice;
  return totalValue/totalQty;
}
function personBalance(personId){
  let bal = 0;
  for(const inv of DB.data.invoices){
    if(inv.personId!==personId)continue;
    const remaining = inv.total - (inv.paidAmount||0);
    if(remaining<=0)continue;
    if(inv.type==='sale') bal -= remaining;
    if(inv.type==='purchase') bal += remaining;
  }
  for(const t of DB.data.transactions){
    if(t.type==='receive' && t.personId===personId) bal += t.amount;
    if(t.type==='pay' && t.personId===personId) bal -= t.amount;
    if(t.type==='transfer'){
      if(t.personId===personId) bal += t.amount;
      if(t.toPersonId===personId) bal -= t.amount;
    }
  }
  return bal;
}
function personBalanceLabel(bal){
  if(Math.abs(bal)<1) return {text:'تسویه',cls:'badge-gray'};
  if(bal>0) return {text:'بستانکار',cls:'badge-success'};
  return {text:'بدهکار',cls:'badge-danger'};
}
function stockValue(){
  let v=0;
  for(const p of DB.data.products){
    const q = stockOf(p.id);
    if(q>0) v += q * avgCostOf(p.id);
  }
  return v;
}
function totals(){
  let sales=0,purchases=0;
  for(const inv of DB.data.invoices){
    if(inv.type==='sale') sales += inv.total;
    if(inv.type==='purchase') purchases += inv.total;
  }
  let cogs = 0;
  for(const inv of DB.data.invoices){
    if(inv.type!=='sale')continue;
    for(const it of inv.items){
      cogs += avgCostOf(it.productId) * it.qty;
    }
  }
  const profit = sales - cogs;
  let receivable=0,payable=0;
  for(const p of DB.data.persons){
    const b = personBalance(p.id);
    if(b<0) receivable += -b;
    if(b>0) payable += b;
  }
  let cash = DB.data.settings.initialCapital||0;
  for(const inv of DB.data.invoices){
    if(inv.type==='sale') cash += (inv.paidAmount||0);
    if(inv.type==='purchase') cash -= (inv.paidAmount||0);
  }
  for(const t of DB.data.transactions){
    if(t.type==='receive') cash += t.amount;
    if(t.type==='pay') cash -= t.amount;
  }
  return {sales:sales,purchases:purchases,cogs:cogs,profit:profit,receivable:receivable,payable:payable,cash:cash};
}
function currentCapital(){
  const t = totals();
  const stockVal = stockValue();
  return t.cash + stockVal + t.receivable - t.payable;
}

/* ============ ناوبری ============ */
const pages = {
  dashboard: renderDashboard, invoices: renderInvoices, products: renderProducts,
  warehouses: renderWarehouses, persons: renderPersons, transactions: renderTransactions,
  capital: renderCapital, reports: renderReports, settings: renderSettings
};

  dashboard:'داشبورد',invoices:'فاکتورها',products:'کالاها',warehouses:'انبارها',

};
function navigate(page){
  $$('.nav-item').forEach(function(n){n.classList.toggle('active',n.dataset.page===page);});
  $('#pageTitle').textContent = pageTitles[page];
  $('#sidebar').classList.remove('open');

$('#todayDate').textContent = todayJalali();
$('#sidebarShopName').textContent = DB.data.settings.shopName || 'فروشگاه من';

/* ============ داشبورد ============ */
let dashChart=null, dashChart2=null;
function renderDashboard(){
  const t = totals();
  const totalCapital = currentCapital();
  $('#content').innerHTML =
    '<div class="grid grid-4 mb-4">'+
      '<div class="stat"><div class="stat-label">موجودی نقدی</div><div class="stat-value">'+formatMoney(t.cash)+'</div><div class="stat-icon">💵</div></div>'+

      '<div class="stat s-danger"><div class="stat-label">مطالبات (طلب ما)</div><div class="stat-value">'+formatMoney(t.receivable)+'</div><div class="stat-icon">📥</div></div>'+
      '<div class="stat s-warning"><div class="stat-label">بدهی‌ها (بدهی ما)</div><div class="stat-value">'+formatMoney(t.payable)+'</div><div class="stat-icon">📤</div></div>'+
    '</div>'+
    '<div class="grid grid-4 mb-4">'+
      '<div class="stat s-info"><div class="stat-label">سرمایه فعلی (تخمینی)</div><div class="stat-value">'+formatMoney(totalCapital)+'</div><div class="stat-icon">💰</div></div>'+
      '<div class="stat"><div class="stat-label">ارزش انبار</div><div class="stat-value">'+formatMoney(stockValue())+'</div><div class="stat-icon">📦</div></div>'+
      '<div class="stat s-success"><div class="stat-label">تعداد فاکتور</div><div class="stat-value">'+formatNum(DB.data.invoices.length)+'</div><div class="stat-icon">🧾</div></div>'+
      '<div class="stat"><div class="stat-label">اشخاص / کالاها</div><div class="stat-value">'+formatNum(DB.data.persons.length)+' / '+formatNum(DB.data.products.length)+'</div><div class="stat-icon">👥</div></div>'+
    '</div>'+
    '<div class="grid grid-2 mb-4">'+
      '<div class="card"><div class="card-header"><div class="card-title">روند فروش و خرید (۶ ماه اخیر)</div></div><canvas id="chart1" height="200"></canvas></div>'+
      '<div class="card"><div class="card-header"><div class="card-title">ترکیب دارایی‌ها</div></div><canvas id="chart2" height="200"></canvas></div>'+
    '</div>'+
    '<div class="grid grid-2">'+
      '<div class="card"><div class="card-header"><div class="card-title">آخرین فاکتورها</div><button class="btn btn-sm btn-ghost" onclick="navigate(\'invoices\')">همه</button></div>'+renderRecentInvoices()+'</div>'+
      '<div class="card"><div class="card-header"><div class="card-title">اشخاص با بیشترین مانده</div><button class="btn btn-sm btn-ghost" onclick="navigate(\'persons\')">همه</button></div>'+renderTopPersons()+'</div>'+
    '</div>';
  const months = lastSixMonths();
  const salesData = months.map(function(m){let s=0;for(const inv of DB.data.invoices){if(inv.type==='sale'&&jalaliMonth(inv.date)===m)s+=inv.total;}return s;});
  const purchaseData = months.map(function(m){let s=0;for(const inv of DB.data.invoices){if(inv.type==='purchase'&&jalaliMonth(inv.date)===m)s+=inv.total;}return s;});
  if(dashChart)dashChart.destroy();
  dashChart = new Chart($('#chart1'),{
    type:'bar',data:{labels:months.map(monthName),datasets:[
      {label:'فروش',data:salesData,backgroundColor:'#10b981',borderRadius:8,borderSkipped:false},
      {label:'خرید',data:purchaseData,backgroundColor:'#ef4444',borderRadius:8,borderSkipped:false}
    ]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{family:'Estedad',weight:'600'}}}},scales:{y:{ticks:{font:{family:'Estedad'},callback:function(v){return formatNum(v);}}},x:{ticks:{font:{family:'Estedad'}}}}}
  });
  if(dashChart2)dashChart2.destroy();
  dashChart2 = new Chart($('#chart2'),{
    type:'doughnut',data:{labels:['نقد','انبار','مطالبات'],datasets:[{data:[Math.max(t.cash,0),stockValue(),t.receivable],backgroundColor:['#3b82f6','#f59e0b','#10b981'],borderWidth:0}]},
    options:{responsive:true,cutout:'65%',plugins:{legend:{position:'bottom',labels:{font:{family:'Estedad',weight:'600'}}}}}
  });
}
function monthName(m){
  const names=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const p=m.split('/'); if(p.length<2)return m;
  return names[(Number(p[1])-1)]+' '+p[0].slice(2);
}
function lastSixMonths(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  const arr=[];let y=j.jy,m=j.jm;
  for(let i=0;i<6;i++){arr.unshift(y+'/'+String(m).padStart(2,'0'));m--;if(m<1){m=12;y--;}}
  return arr;
}
function renderRecentInvoices(){
  const invs = [].concat(DB.data.invoices).sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,5);
  if(!invs.length)return '<div class="empty"><div class="icon">🧾</div><div class="title">فاکتوری ثبت نشده</div></div>';
  let rows = '';
  for(const i of invs){
    rows += '<tr><td>'+i.number+'</td><td><span class="badge '+(i.type==='sale'?'badge-success':'badge-danger')+'">'+(i.type==='sale'?'فروش':'خرید')+'</span></td><td class="num">'+i.date+'</td><td class="num">'+formatNum(i.total)+'</td></tr>';
  }
  return '<div class="table-wrap"><table><thead><tr><th>شماره</th><th>نوع</th><th>تاریخ</th><th>مبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function renderTopPersons(){
  const list = DB.data.persons.map(function(p){return {p:p,bal:personBalance(p.id)};}).filter(function(x){return Math.abs(x.bal)>=1;}).sort(function(a,b){return Math.abs(b.bal)-Math.abs(a.bal);}).slice(0,5);
  if(!list.length)return '<div class="empty"><div class="icon">👥</div><div class="title">مانده‌ای ثبت نشده</div></div>';
  let rows = '';
  for(const x of list){
    const l = personBalanceLabel(x.bal);
    rows += '<tr><td>'+x.p.name+'</td><td><span class="badge '+l.cls+'">'+l.text+'</span></td><td class="num">'+formatNum(Math.abs(x.bal))+'</td></tr>';
  }
  return '<div class="table-wrap"><table><thead><tr><th>نام</th><th>وضعیت</th><th>مبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ============ کالاها ============ */
function nextProductCode(){
  const nums = DB.data.products.map(function(p){return Number(String(p.code||'').replace(/\D/g,''))||0;});
  return 'K-' + String(Math.max.apply(null,[0].concat(nums))+1).padStart(4,'0');
}
function renderProducts(){
  const list = DB.data.products;
  $('#content').innerHTML =
    '<div class="flex justify-between items-center mb-4 gap-3" style="flex-wrap:wrap">'+
      '<div class="search-box"><input class="form-control" id="prodSearch" placeholder="جستجوی کالا..."></div>'+
      '<button class="btn btn-primary" onclick="productForm()">➕ کالای جدید</button>'+
    '</div>'+
    '<div class="card"><div class="table-wrap"><table><thead><tr>'+
      '<th>کد</th><th>نام</th><th>واحد</th><th>قیمت خرید</th><th>بهای تمام‌شده</th><th>قیمت فروش</th><th>موجودی</th><th>عملیات</th>'+
    '</tr></thead><tbody id="prodBody">'+productsRows(list)+'</tbody></table></div></div>';
  $('#prodSearch').oninput = function(e){ $('#prodBody').innerHTML = productsRows(filterList(list,e.target.value)); };
}
function filterList(list,q){
  if(!q)return list;
  q=q.toLowerCase();
  return list.filter(function(x){return JSON.stringify(x).toLowerCase().includes(q);});
}
function productsRows(list){
  if(!list.length)return '<tr><td colspan="8"><div class="empty"><div class="icon">📦</div><div class="title">کالایی ثبت نشده</div></div></td></tr>';
  let html = '';
  for(const p of list){
    const q = stockOf(p.id);
    const avg = avgCostOf(p.id);
    html += '<tr>'+
      '<td><b>'+(p.code||'-')+'</b></td><td>'+p.name+'</td><td>'+(p.unit||'-')+'</td>'+
      '<td class="num">'+formatNum(p.purchasePrice)+'</td>'+
      '<td class="num" style="color:var(--info);font-weight:700">'+formatNum(avg)+'</td>'+
      '<td class="num">'+formatNum(p.salePrice)+'</td>'+
      '<td class="num '+(q<=0?'text-danger':'')+'">'+formatNum(q)+'</td>'+
      '<td><button class="btn btn-sm btn-ghost" onclick="productForm(\''+p.id+'\')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteProduct(\''+p.id+'\')">🗑</button></td>'+
    '</tr>';
  }
  return html;
}
function productForm(id){
  const isEdit = !!id;
  const p = isEdit? DB.data.products.find(function(x){return x.id===id;}) : {code:nextProductCode(),name:'',unit:'عدد',purchasePrice:0,salePrice:0,minStock:0};
  openModal(isEdit?'ویرایش کالا':'کالای جدید',
    '<div class="form-row">'+
      '<div class="form-group"><label class="form-label">کد کالا (خودکار)</label><input class="form-control" id="pCode" value="'+(p.code||'')+'" '+(isEdit?'readonly':'')+' style="background:'+(isEdit?'#f3f4f6':'#fff')+'"></div>'+
      '<div class="form-group"><label class="form-label">واحد</label><input class="form-control" id="pUnit" value="'+(p.unit||'عدد')+'"></div>'+
    '</div>'+
    '<div class="form-group"><label class="form-label">نام کالا *</label><input class="form-control" id="pName" value="'+p.name+'"></div>'+
    '<div class="form-row">'+
      '<div class="form-group"><label class="form-label">قیمت خرید</label><input class="form-control" data-thousands id="pPurchase" value="'+formatNum(p.purchasePrice)+'"></div>'+
      '<div class="form-group"><label class="form-label">قیمت فروش</label><input class="form-control" data-thousands id="pSale" value="'+formatNum(p.salePrice)+'"></div>'+
    '</div>'+
    '<div class="form-group"><label class="form-label">حداقل موجودی</label><input class="form-control" data-thousands id="pMin" value="'+formatNum(p.minStock)+'"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>'+
    '<button class="btn btn-primary" onclick="saveProduct(\''+(id||'')+'\')">ذخیره</button>'
  );
}
function saveProduct(id){
  const name = $('#pName').value.trim();
  if(!name){toast('نام کالا را وارد کنید','error');return;}
  const obj = {
    code:$('#pCode').value.trim(),name:name,
    unit:$('#pUnit').value.trim()||'عدد',
    purchasePrice:parseNum($('#pPurchase').value),
    salePrice:parseNum($('#pSale').value),
    minStock:parseNum($('#pMin').value)
  };
  if(id){Object.assign(DB.data.products.find(function(x){return x.id===id;}),obj);}
  else{DB.data.products.push(Object.assign({id:uid()},obj));}
  DB.save(); closeModal(); renderProducts(); toast('کالا ذخیره شد','success');
}
function deleteProduct(id){
  if(DB.data.stockMoves.some(function(m){return m.productId===id;})){toast('این کالا در گردش انبار استفاده شده','error');return;}
  if(DB.data.invoices.some(function(i){return i.items.some(function(it){return it.productId===id;});})){toast('این کالا در فاکتورها استفاده شده','error');return;}
  confirmAction('آیا از حذف این کالا مطمئن هستید؟',function(){
    DB.data.products = DB.data.products.filter(function(p){return p.id!==id;});
    DB.save(); renderProducts(); toast('کالا حذف شد','success');
  });
}

/* ============ انبارها ============ */
function renderWarehouses(){
  const list = DB.data.warehouses;
  let cardsHtml = '';
  if(!list.length){
    cardsHtml = '<div class="card" style="grid-column:1/-1"><div class="empty"><div class="icon">🏭</div><div class="title">انباری ثبت نشده</div><div class="sub">ابتدا یک انبار اضافه کنید</div></div></div>';
  } else {
    for(const w of list){
      const items = DB.data.products.map(function(p){return {p:p,q:stockOf(p.id,w.id)};}).filter(function(x){return x.q!==0;});
      const totalValue = items.reduce(function(s,x){return s+x.q*avgCostOf(x.p.id);},0);
      let itemsTable = '';
      if(items.length){
        let rows = '';
        for(const x of items){
          rows += '<tr><td>'+x.p.name+'</td><td class="num">'+formatNum(x.q)+'</td><td class="num">'+formatNum(avgCostOf(x.p.id))+'</td></tr>';
        }
        itemsTable = '<table style="font-size:12px"><thead><tr><th>کالا</th><th>موجودی</th><th>بهای واحد</th></tr></thead><tbody>'+rows+'</tbody></table>';
      } else {
        itemsTable = '<div class="text-muted text-center">خالی</div>';
      }
      cardsHtml += '<div class="card">'+
        '<div class="card-header"><div class="card-title">🏭 '+w.name+'</div>'+
          '<div class="flex gap-2">'+
            '<button class="btn btn-sm btn-ghost" onclick="warehouseForm(\''+w.id+'\')">✏️</button>'+
            '<button class="btn btn-sm btn-danger" onclick="deleteWarehouse(\''+w.id+'\')">🗑</button>'+
          '</div>'+
        '</div>'+
        '<div class="text-muted mb-3">'+(w.desc||'بدون توضیح')+'</div>'+
        '<div class="flex justify-between mb-3" style="font-size:13px">'+
          '<span>تعداد اقلام: <b>'+formatNum(items.length)+'</b></span>'+
          '<span>ارزش: <b>'+formatMoney(totalValue)+'</b></span>'+
        '</div>'+
        '<div style="max-height:200px;overflow:auto">'+itemsTable+'</div>'+
      '</div>';
    }
  }
  $('#content').innerHTML =
    '<div class="flex justify-between items-center mb-4">'+
      '<div class="text-muted">مدیریت انبارها و موجودی هر کالا</div>'+
      '<button class="btn btn-primary" onclick="warehouseForm()">➕ انبار جدید</button>'+
    '</div>'+
    '<div class="grid grid-3">'+cardsHtml+'</div>';
}
function warehouseForm(id){
  const w = id? DB.data.warehouses.find(function(x){return x.id===id;}) : {name:'',desc:''};
  openModal(id?'ویرایش انبار':'انبار جدید',
    '<div class="form-group"><label class="form-label">نام انبار *</label><input class="form-control" id="wName" value="'+w.name+'"></div>'+
    '<div class="form-group"><label class="form-label">توضیحات</label><input class="form-control" id="wDesc" value="'+(w.desc||'')+'"></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>'+
    '<button class="btn btn-primary" onclick="saveWarehouse(\''+(id||'')+'\')">ذخیره</button>'
  );
}
function saveWarehouse(id){
  const name = $('#wName').value.trim();
  if(!name){toast('نام انبار را وارد کنید','error');return;}
  const obj = {name:name,desc:$('#wDesc').value.trim()};
  if(id){Object.assign(DB.data.warehouses.find(function(x){return x.id===id;}),obj);}
  else{DB.data.warehouses.push(Object.assign({id:uid()},obj));}
  DB.save(); closeModal(); renderWarehouses(); toast('انبار ذخیره شد','success');
}
function deleteWarehouse(id){
  if(DB.data.stockMoves.some(function(m){return m.warehouseId===id;})){toast('این انبار گردش کالا دارد','error');return;}
  if(DB.data.invoices.some(function(i){return i.warehouseId===id;})){toast('این انبار در فاکتورها استفاده شده','error');return;}
  confirmAction('حذف این انبار؟',function(){
    DB.data.warehouses = DB.data.warehouses.filter(function(w){return w.id!==id;});
    DB.save(); renderWarehouses(); toast('انبار حذف شد','success');
  });
}

/* ============ اشخاص ============ */
let personFilter = 'all';
function renderPersons(){
  const list = DB.data.persons.map(function(p){return Object.assign({},p,{bal:personBalance(p.id)});});
  let filtered = list;
  if(personFilter==='debtor') filtered = list.filter(function(p){return p.bal<-0.5;});
  if(personFilter==='creditor') filtered = list.filter(function(p){return p.bal>0.5;});
  if(personFilter==='settled') filtered = list.filter(function(p){return Math.abs(p.bal)<=0.5;});
  let rowsHtml = '';
  if(!filtered.length){
    rowsHtml = '<tr><td colspan="6"><div class="empty"><div class="icon">👥</div><div class="title">شخصی ثبت نشده</div></div></td></tr>';
  } else {
    for(const p of filtered){
      const l = personBalanceLabel(p.bal);
      const typeLabel = p.type==='customer'?'مشتری':p.type==='supplier'?'تأمین‌کننده':'هردو';
      rowsHtml += '<tr>'+
        '<td>'+p.name+'</td>'+
        '<td>'+(p.phone||'-')+'</td>'+
        '<td><span class="badge badge-info">'+typeLabel+'</span></td>'+
        '<td class="num">'+formatNum(Math.abs(p.bal))+'</td>'+
        '<td><span class="badge '+l.cls+'">'+l.text+'</span></td>'+
        '<td style="white-space:nowrap">'+
          '<button class="quick-tx quick-tx-in" onclick="quickTx(\''+p.id+'\',\'receive\')" title="دریافت از '+p.name+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button> '+
          '<button class="quick-tx quick-tx-out" onclick="quickTx(\''+p.id+'\',\'pay\')" title="پرداخت به '+p.name+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button> '+
          '<button class="btn btn-sm btn-ghost" onclick="personLedger(\''+p.id+'\')" title="گردش حساب">📋</button> '+
          '<button class="btn btn-sm btn-ghost" onclick="personForm(\''+p.id+'\')" title="ویرایش">✏️</button> '+
          '<button class="btn btn-sm btn-danger" onclick="deletePerson(\''+p.id+'\')" title="حذف">🗑</button>'+
        '</td></tr>';
    }
  }
  $('#content').innerHTML =
    '<div class="flex justify-between items-center mb-4 gap-3" style="flex-wrap:wrap">'+
      '<div class="filter-tabs">'+
        '<button class="filter-tab '+(personFilter==='all'?'active':'')+'" onclick="setPersonFilter(\'all\')">همه</button>'+
        '<button class="filter-tab '+(personFilter==='debtor'?'active':'')+'" onclick="setPersonFilter(\'debtor\')">بدهکار</button>'+
        '<button class="filter-tab '+(personFilter==='creditor'?'active':'')+'" onclick="setPersonFilter(\'creditor\')">بستانکار</button>'+
        '<button class="filter-tab '+(personFilter==='settled'?'active':'')+'" onclick="setPersonFilter(\'settled\')">تسویه</button>'+
      '</div>'+
      '<button class="btn btn-primary" onclick="personForm()">➕ شخص جدید</button>'+
    '</div>'+
    '<div class="card"><div class="table-wrap"><table><thead><tr>'+
      '<th>نام</th><th>تلفن</th><th>نوع</th><th>مانده</th><th>وضعیت</th><th>عملیات</th>'+
    '</tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>';
}
function setPersonFilter(f){personFilter=f;renderPersons();}
function quickTx(personId, type){
  const p = DB.data.persons.find(function(x){return x.id===personId;});
  if(!p){toast('شخص یافت نشد','error');return;}
  const isReceive = type==='receive';
  const title = isReceive? '📥 دریافت وجه از '+p.name : '📤 پرداخت وجه به '+p.name;
  openModal(title,
    '<div class="form-group"><label class="form-label">تاریخ</label><input class="form-control" id="qtxDate" value="'+todayJalali()+'" dir="ltr"></div>'+
    '<div class="form-group"><label class="form-label">مبلغ *</label><input class="form-control" data-thousands id="qtxAmount" value="0" placeholder="0"></div>'+
    '<div class="form-group"><label class="form-label">توضیحات (اختیاری)</label><input class="form-control" id="qtxNote" value="'+(isReceive?'دریافت وجه':'پرداخت وجه')+'"></div>'+
    '<div class="text-muted" style="font-size:11px;margin-top:8px">'+
      (isReceive ? '💡 مبلغی که از این شخص دریافت می‌کنید به صندوق اضافه شده و از بدهی او کم می‌شود.' : '💡 مبلغی که به این شخص پرداخت می‌کنید از صندوق کم شده و از بدهی شما به او کم می‌شود.')+
    '</div>',
    '<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>'+
    '<button class="btn '+(isReceive?'btn-success':'btn-danger')+'" onclick="saveQuickTx(\''+personId+'\',\''+type+'\')">'+(isReceive?'📥 ثبت دریافت':'📤 ثبت پرداخت')+'</button>'
  );
  setTimeout(function(){const inp = $('#qtxAmount'); if(inp){inp.focus(); inp.select();}},50);
}
function saveQuickTx(personId, type){
  const date = $('#qtxDate').value.trim();
  if(!validJalali(date)){toast('تاریخ معتبر نیست','error');return;}
  const amount = parseNum($('#qtxAmount').value);

function personLedger(id){
  const p = DB.data.persons.find(function(x){return x.id===id;});
  if(!p){toast('شخص یافت نشد','error');return;}
  const rows = [];
  for(const inv of DB.data.invoices){
    if(inv.personId===id){
      const rem = inv.total - (inv.paidAmount||0);
      rows.push({
        date: inv.date,
        desc: 'فاکتور ' + (inv.type==='sale'?'فروش':'خرید') + ' #' + inv.number + (rem>0?' (نسیه)':''),
        amount: inv.total,
        type: inv.type,
        refType: 'invoice',
        refId: inv.id
      });
    }
  }
  for(const t of DB.data.transactions){
    if(t.personId===id || t.toPersonId===id){
      let desc = t.type==='receive'?'دریافت وجه':t.type==='pay'?'پرداخت وجه':'انتقال';
      if(t.type==='transfer'){
        const otherId = t.personId===id? t.toPersonId : t.personId;
        const op = DB.data.persons.find(function(x){return x.id===otherId;});
        desc = 'انتقال ' + (t.personId===id?'به':'از') + ' ' + (op?op.name:'?');
      }
      rows.push({
        date: t.date,
        desc: desc,
        amount: t.amount,
        type: t.type,
        refType: 'transaction',
        refId: t.id
      });
    }
  }
  rows.sort(function(a,b){return b.date.localeCompare(a.date);});
  const bal = personBalance(id);
  const label = personBalanceLabel(bal);
  let rowsHtml = '';
  if(!rows.length){
    rowsHtml = '<tr><td colspan="5" class="text-center text-muted">موردی ثبت نشده</td></tr>';
  } else {
    for(const r of rows){
      let typeBadge = '';
      if(r.type==='sale') typeBadge = '<span class="badge badge-success">فروش</span>';
      else if(r.type==='purchase') typeBadge = '<span class="badge badge-danger">خرید</span>';
      else if(r.type==='receive') typeBadge = '<span class="badge badge-info">دریافت</span>';
      else if(r.type==='pay') typeBadge = '<span class="badge badge-warning">پرداخت</span>';
      else typeBadge = '<span class="badge badge-warning">انتقال</span>';
      let actionBtns = '';
      if(r.refType==='invoice'){
        actionBtns =
          '<button class="btn btn-sm btn-ghost" onclick="editFromLedger(\'invoice\',\''+r.refId+'\',\''+r.type+'\',true)">👁</button> '+
          '<button class="btn btn-sm btn-warning" onclick="editFromLedger(\'invoice\',\''+r.refId+'\',\''+r.type+'\',false)">✏️</button>';
      } else {
        actionBtns =
          '<button class="btn btn-sm btn-warning" onclick="editFromLedger(\'transaction\',\''+r.refId+'\',\''+r.type+'\',false)">✏️</button>';
      }
      rowsHtml += '<tr>'+
        '<td class="num">'+r.date+'</td>'+
        '<td>'+r.desc+'</td>'+
        '<td class="num">'+formatNum(r.amount)+'</td>'+
        '<td>'+typeBadge+'</td>'+
        '<td style="white-space:nowrap">'+actionBtns+'</td>'+
      '</tr>';
    }
  }
  openModal('گردش حساب: '+p.name,
    '<div class="flex justify-between mb-3 flex-wrap gap-2">'+
      '<div class="text-muted">تعداد تراکنش: '+rows.length+'</div>'+
      '<div>وضعیت: <span class="badge '+label.cls+'">'+label.text+' '+formatMoney(Math.abs(bal))+'</span></div>'+
    '</div>'+
    '<div class="table-wrap"><table><thead><tr>'+
      '<th>تاریخ</th><th>شرح</th><th>مبلغ</th><th>نوع</th><th>عملیات</th>'+
    '</tr></thead><tbody>'+rowsHtml+'</tbody></table></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">بستن</button>',
    'lg'
  );

function nextInvoiceNumber(type){
  const prefix = type==='sale'?'F':'P';
  const nums = DB.data.invoices.filter(function(i){return i.type===type;}).map(function(i){return Number(i.number.replace(/\D/g,''))||0;});
  return prefix + '-' + String(Math.max.apply(null,[0].concat(nums))+1).padStart(4,'0');
}

function renderInvoiceItems(){
  const body = $('#invItemsBody');
  if(!body)return;
  if(!invoiceItems.length){

    return;
  }
  let html = '';
  for(let idx=0; idx<invoiceItems.length; idx++){
    html += invoiceItemsRowHTML(invoiceItems[idx], idx);
  }
  body.innerHTML = html;
  attachAllThousandsIn(body);
  recalcInvoice();
}
function invoiceItemsRowHTML(it,idx){
  let productOptions = '<option value="">— انتخاب کالا —</option>';
  for(const x of DB.data.products){
    productOptions += '<option value="'+x.id+'" '+(x.id===it.productId?'selected':'')+'>'+(x.code?'['+x.code+'] ':'')+x.name+'</option>';
  }
  return '<tr data-row="'+idx+'">'+
    '<td class="col-product"><select class="form-control product-select" onchange="updateItemProduct('+idx+',this.value)">'+productOptions+'</select></td>'+
    '<td class="col-qty"><input class="form-control num" type="number" min="1" value="'+it.qty+'" oninput="updateItemQty('+idx+',this.value)" style="width:100%"></td>'+
    '<td class="col-price"><input class="form-control num" data-thousands value="'+formatNum(it.price)+'" oninput="updateItemPrice('+idx+',this.value)" style="width:100%"></td>'+
    '<td class="col-total"><span class="num" style="font-weight:700">'+formatNum(it.qty*it.price)+'</span></td>'+
    '<td class="col-act"><button class="btn btn-sm btn-danger" onclick="removeInvoiceItem('+idx+')" title="حذف">✕</button></td>'+
  '</tr>';
}
function updateItemProduct(idx,val){
  invoiceItems[idx].productId = val;
  if(val){
    const p = DB.data.products.find(function(x){return x.id===val;});
    if(p && !invoiceItems[idx].price){
      const type = $('#invNumber').value.startsWith('F')?'sale':'purchase';
      invoiceItems[idx].price = type==='purchase'? (p.purchasePrice||0) : (p.salePrice||0);
      const row = $('#invItemsBody tr[data-row="'+idx+'"]');
      if(row){ const pi = row.querySelector('.col-price input'); if(pi) pi.value = formatNum(invoiceItems[idx].price); }
    }
  }
  updateRowTotal(idx);
  recalcInvoice();
}
function updateItemQty(idx,val){
  invoiceItems[idx].qty = Math.max(1,Number(val)||1);
  updateRowTotal(idx);
  recalcInvoice();
}
function updateItemPrice(idx,val){
  invoiceItems[idx].price = parseNum(val);
  updateRowTotal(idx);
  recalcInvoice();
}
function updateRowTotal(idx){
  const row = $('#invItemsBody tr[data-row="'+idx+'"]');
  if(!row)return;
  const cell = row.querySelector('.col-total .num');
  if(cell) cell.textContent = formatNum(invoiceItems[idx].qty*invoiceItems[idx].price);
}
function addInvoiceItem(){ invoiceItems.push({productId:'',qty:1,price:0}); renderInvoiceItems(); }
function removeInvoiceItem(idx){ invoiceItems.splice(idx,1); renderInvoiceItems(); }
function recalcInvoice(){
  const subtotal = invoiceItems.reduce(function(s,i){return s+(i.qty*i.price);},0);
  const shipping = parseNum(($('#invShipping')||{}).value||0);
  const customs = parseNum(($('#invCustoms')||{}).value||0);
  const paid = parseNum(($('#invPaidAmount')||{}).value||0);
  const total = subtotal + shipping + customs;
  const remaining = total - paid;
  if($('#invSubtotal'))$('#invSubtotal').textContent = formatNum(subtotal);
  if($('#invShipShow'))$('#invShipShow').textContent = formatNum(shipping);
  if($('#invCustShow'))$('#invCustShow').textContent = formatNum(customs);
  if($('#invTotal'))$('#invTotal').textContent = formatNum(total);
  if($('#invPaidShow'))$('#invPaidShow').textContent = formatNum(paid);
  if($('#invRemShow'))$('#invRemShow').textContent = formatNum(remaining);
}
function saveInvoice(type,editId){
  editId = editId || '';
  if(editId){
    const inv = DB.data.invoices.find(function(x){return x.id===editId;});
    if(inv) type = inv.type;
  }
  const personId = $('#invPerson').value;
  const whId = $('#invWh').value;
  const date = $('#invDate').value.trim();
  if(!personId){toast('شخص را انتخاب کنید','error');return;}
  if(!whId){toast('انبار را انتخاب کنید','error');return;}
  if(!validJalali(date)){toast('تاریخ معتبر نیست (مثال: 1403/01/01)','error');return;}
  if(!invoiceItems.length){toast('حداقل یک ردیف اضافه کنید','error');return;}
  if(invoiceItems.some(function(i){return !i.productId;})){toast('کالای هر ردیف را انتخاب کنید','error');return;}
  if(type==='sale'){
    for(const it of invoiceItems){
      const avail = stockOf(it.productId,whId,editId||null);
      if(avail < it.qty){
        const p = DB.data.products.find(function(x){return x.id===it.productId;});
        toast('موجودی کالای "'+p.name+'" کافی نیست (موجودی: '+avail+')','error');
        return;
      }
    }
  }
  const subtotal = invoiceItems.reduce(function(s,i){return s+(i.qty*i.price);},0);
  const shippingCost = parseNum($('#invShipping').value);
  const customsCost = parseNum($('#invCustoms').value);
  const paidAmount = parseNum($('#invPaidAmount').value);
  const total = subtotal + shippingCost + customsCost;
  const number = $('#invNumber').value.trim();
  const note = $('#invNote').value.trim();
  if(editId){
    DB.data.stockMoves = DB.data.stockMoves.filter(function(m){return m.refId!==editId;});

  } else {
    for(const t of list){
      let who = '-';
      if(t.type==='receive'||t.type==='pay'){
        const p = DB.data.persons.find(function(x){return x.id===t.personId;});
        who = p?p.name:'?';
      } else if(t.type==='transfer'){
        const from = DB.data.persons.find(function(x){return x.id===t.personId;});
        const to = DB.data.persons.find(function(x){return x.id===t.toPersonId;});

      }
      const badge = t.type==='receive'?'badge-success':t.type==='pay'?'badge-danger':'badge-warning';

        '<td class="num">'+formatNum(t.amount)+'</td>'+
        '<td>'+(t.note||'-')+'</td>'+
        '<td>'+
          '<button class="btn btn-sm btn-warning" onclick="txForm(\''+t.type+'\',\''+t.id+'\')" title="ویرایش">✏️</button> '+
          '<button class="btn btn-sm btn-danger" onclick="deleteTx(\''+t.id+'\')" title="حذف">🗑</button>'+

  }
  $('#content').innerHTML =
    '<div class="flex justify-between items-center mb-4">'+

        '<button class="btn btn-success" onclick="txForm(\'receive\')">📥 دریافت</button>'+
        '<button class="btn btn-danger" onclick="txForm(\'pay\')">📤 پرداخت</button>'+
        '<button class="btn btn-warning" onclick="txForm(\'transfer\')">🔁 انتقال</button>'+
      '</div>'+
    '</div>'+

      '<th>تاریخ</th><th>نوع</th><th>از / به</th><th>مبلغ</th><th>توضیح</th><th>عملیات</th>'+
    '</tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>';
}
function txForm(type, editId){
  editId = editId || null;
  if(!DB.data.persons.length){toast('ابتدا شخص اضافه کنید','warning');return;}
  const existing = editId? DB.data.transactions.find(function(t){return t.id===editId;}) : null;
  if(existing) type = existing.type;
  const isTransfer = type==='transfer';
  let fromOptions = '<option value="">انتخاب</option>';
  let toOptions = '<option value="">انتخاب</option>';
  let personOptions2 = '<option value="">انتخاب</option>';
  for(const p of DB.data.persons){
    fromOptions += '<option value="'+p.id+'" '+(existing&&existing.personId===p.id?'selected':'')+'>'+p.name+'</option>';
    toOptions += '<option value="'+p.id+'" '+(existing&&existing.toPersonId===p.id?'selected':'')+'>'+p.name+'</option>';
    personOptions2 += '<option value="'+p.id+'" '+(existing&&existing.personId===p.id?'selected':'')+'>'+p.name+'</option>';
  }
  let body = '<div class="form-group"><label class="form-label">تاریخ</label><input class="form-control" id="txDate" value="'+(existing?existing.date:todayJalali())+'" dir="ltr"></div>';
  if(isTransfer){
    body += '<div class="form-group"><label class="form-label">از شخص (پرداخت‌کننده) *</label><select class="form-control" id="txFrom">'+fromOptions+'</select></div>';
    body += '<div class="form-group"><label class="form-label">به شخص (دریافت‌کننده) *</label><select class="form-control" id="txTo">'+toOptions+'</select></div>';
    body += '<p class="text-muted" style="font-size:11px;margin-bottom:8px">💡 انتقال یعنی شخص «از» پول را مستقیم به شخص «به» می‌دهد (بدون دخالت صندوق شما). بدهی/طلب هر دو نفر به‌روز می‌شود.</p>';
  } else {
    body += '<div class="form-group"><label class="form-label">شخص *</label><select class="form-control" id="txPerson">'+personOptions2+'</select></div>';
  }
  body += '<div class="form-group"><label class="form-label">مبلغ *</label><input class="form-control" data-thousands id="txAmount" value="'+(existing?formatNum(existing.amount):'0')+'"></div>';
  body += '<div class="form-group"><label class="form-label">توضیحات</label><input class="form-control" id="txNote" value="'+(existing?(existing.note||''):'')+'"></div>';
  openModal(
    (type==='receive'?'ثبت دریافت وجه':type==='pay'?'ثبت پرداخت وجه':'انتقال بین اشخاص')+(editId?' (ویرایش)':''),
    body,
    '<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>'+
    '<button class="btn btn-primary" onclick="saveTx(\''+type+'\',\''+(editId||'')+'\')">ذخیره</button>'
  );
}
function saveTx(type, editId){
  editId = editId || '';
  if(editId){
    const ex = DB.data.transactions.find(function(t){return t.id===editId;});
    if(ex) type = ex.type;
  }
  const date = $('#txDate').value.trim();
  if(!validJalali(date)){toast('تاریخ معتبر نیست','error');return;}
  const amount = parseNum($('#txAmount').value);
  if(amount<=0){toast('مبلغ را وارد کنید','error');return;}
  const note = $('#txNote').value.trim();
  const obj = {date:date,type:type,amount:amount,note:note};
  if(type==='transfer'){
    const from = $('#txFrom').value;
    const to = $('#txTo').value;
    if(!from||!to){toast('هر دو شخص را انتخاب کنید','error');return;}
    if(from===to){toast('اشخاص باید متفاوت باشند','error');return;}
    obj.personId = from; obj.toPersonId = to;
  } else {
    const person = $('#txPerson').value;
    if(!person){toast('شخص را انتخاب کنید','error');return;}
    obj.personId = person;
  }
  if(editId){
    const ex = DB.data.transactions.find(function(t){return t.id===editId;});
    Object.assign(ex,obj);
  } else {
    DB.data.transactions.push(Object.assign({id:uid()},obj));
  }
  DB.save(); closeModal(); renderTransactions(); toast('تراکنش ذخیره شد','success');
}
function deleteTx(id){
  confirmAction('حذف این تراکنش؟',function(){
    DB.data.transactions = DB.data.transactions.filter(function(t){return t.id!==id;});
    DB.save(); renderTransactions(); toast('حذف شد','success');
  });
}

          '<button class="btn btn-danger" onclick="resetAllData()">🗑 حذف کل اطلاعات</button>'+
        '</div>'+
        '<p class="text-muted mt-3" style="font-size:11px">- «حذف اطلاعات حسابداری» فقط فاکتورها، تراکنش‌ها و گردش انبار را پاک می‌کند.<br>- «حذف کل اطلاعات» همه چیز را پاک می‌کند.</p>'+
      '</div>'+
    '</div>'+
    '<div class="card mt-4">'+
      '<div class="card-header"><div class="card-title">اطلاعات سیستم</div></div>'+
      '<div class="grid grid-4">'+
        '<div class="stat"><div class="stat-label">اشخاص</div><div class="stat-value">'+formatNum(DB.data.persons.length)+'</div></div>'+
        '<div class="stat"><div class="stat-label">کالاها</div><div class="stat-value">'+formatNum(DB.data.products.length)+'</div></div>'+
        '<div class="stat"><div class="stat-label">انبارها</div><div class="stat-value">'+formatNum(DB.data.warehouses.length)+'</div></div>'+
        '<div class="stat"><div class="stat-label">فاکتورها</div><div class="stat-value">'+formatNum(DB.data.invoices.length)+'</div></div>'+
      '</div>'+
    '</div>';
}
function saveSettings(){
  DB.data.settings.shopName = $('#setShop').value.trim()||'فروشگاه من';
  DB.data.settings.currency = $('#setCurrency').value;
  DB.save();
  $('#sidebarShopName').textContent = DB.data.settings.shopName;
  toast('تنظیمات ذخیره شد','success');
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB.data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('فایل پشتیبان دانلود شد','success');
}
function importData(e){
  const file = e.target.files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const parsed = JSON.parse(ev.target.result);
      confirmAction('اطلاعات فعلی جایگزین شود؟',function(){
        DB.data = Object.assign({},DB.data,parsed);
        DB.save();
        $('#sidebarShopName').textContent = DB.data.settings.shopName;
        toast('بازیابی انجام شد','success');
        navigate('dashboard');
      });
    }catch(err){toast('فایل معتبر نیست','error');}
  };
  reader.readAsText(file);
  e.target.value='';
}
function resetAccountingData(){
  confirmAction('همه فاکتورها، تراکنش‌ها و گردش انبار پاک شوند؟ (اشخاص، کالاها و انبارها حفظ می‌شوند)',function(){
    DB.resetAccounting();
    toast('اطلاعات حسابداری پاک شد','success');
    navigate('dashboard');
  });
}
function resetAllData(){
  confirmAction('⚠️ کل اطلاعات (فاکتورها، اشخاص، کالاها، انبارها) حذف شود؟ این عملیات برگشت‌پذیر نیست.',function(){
    DB.resetAll();
    toast('همه اطلاعات پاک شد','success');
    navigate('dashboard');
  });
}

/* ============ شروع ============ */
navigate('dashboard');
</script>
</body>
</html>
