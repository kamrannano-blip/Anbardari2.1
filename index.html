<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حسابداری">
<meta name="mobile-web-app-capable" content="yes">
<title>سیستم حسابداری DAVIN NOVA</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="DAVIN.PNG">
<link rel="apple-touch-icon" sizes="180x180" href="DAVIN.PNG">
<link rel="apple-touch-icon" sizes="152x152" href="DAVIN.PNG">
<link rel="apple-touch-icon" sizes="167x167" href="DAVIN.PNG">
<link rel="apple-touch-icon" sizes="120x120" href="DAVIN.PNG">
<link rel="icon" type="image/png" href="DAVIN.PNG">
<link href="https://cdn.jsdelivr.net/gh/font-store/font-IRANSharp/IRANSharp.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.6/dist/jalaali.min.js"></script>
<style>
:root{
  --bg-main:#0f1419; --bg-card:#1a2332; --bg-card-2:#1e2a3a; --bg-input:#0a0e14; --bg-hover:#243043;
  --border-soft:rgba(255,255,255,.06); --border-medium:rgba(255,255,255,.1); --border-strong:rgba(255,255,255,.15);
  --text-main:#ffffff; --text-sub:#8b95a5; --text-muted:#5a6474;
  --accent:#e63946; --accent-hover:#dc2f3c; --accent-glow:rgba(230,57,70,.35);
  --success:#10b981; --success-hover:#059669; --success-glow:rgba(16,185,129,.3);
  --danger:#ef4444; --danger-hover:#dc2626; --warning:#f59e0b; --warning-hover:#d97706;
  --info:#3b82f6; --gold:#d4af37; --gold-light:#f4e5a1;
  --radius:14px; --radius-sm:10px; --radius-lg:18px;
  --shadow-card:0 4px 20px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-card-hover:0 8px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.05) inset;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg-main);-webkit-text-size-adjust:100%}
body{font-family:'IRANSharp', 'IRANSans', Tahoma, sans-serif;font-weight:500;background:var(--bg-main);color:var(--text-main);font-size:14px;line-height:1.7;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-top: var(--safe-top);padding-bottom: var(--safe-bottom)}
.app{display:flex;min-height:100vh;min-height:100dvh;width:100%}
.sidebar{width:260px;background:#0f1419;border-left:1px solid var(--border-soft);padding:0 0 20px;position:fixed;top:0;right:0;bottom:0;overflow-y:auto;z-index:60;transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-4px 0 20px rgba(0,0,0,.4);padding-top: calc(var(--safe-top) + 12px);padding-bottom: calc(var(--safe-bottom) + 20px)}
.sidebar .brand{display:flex;align-items:center;gap:12px;padding:0 18px 18px;border-bottom:1px solid var(--border-soft);margin-bottom:14px}
.sidebar .brand-icon{width:48px;height:48px;background:linear-gradient(135deg,#f4e5a1 0%,#d4af37 50%,#b8860b 100%);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border-medium);flex-shrink:0;position:relative;box-shadow:0 2px 8px rgba(212,175,55,.3);}
.sidebar .brand-icon .brand-fallback{color:#0f1419;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative;z-index:1}
.sidebar .brand-icon img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;top:0;left:0;z-index:2}
.sidebar .brand-text{font-weight:800;font-size:15px;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.sidebar .brand-sub{font-size:11px;color:var(--text-sub);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 18px;margin:2px 10px;color:var(--text-sub);cursor:pointer;font-weight:600;font-size:13.5px;border-radius:10px;transition:all .2s;user-select:none}
.nav-item:hover{background:var(--bg-hover);color:var(--text-main)}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 4px 15px var(--accent-glow)}
.nav-item .icon{font-size:18px;width:22px;text-align:center;display:inline-block}
.main{margin-right:260px;flex:1;padding:14px 20px 130px;min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;width:calc(100% - 260px)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;background:var(--bg-card);padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border-soft);box-shadow:var(--shadow-card);width:100%;position:relative;z-index:1}
.page-title{font-size:18px;font-weight:800;color:#ffffff}
#todayDate{font-size:12px;color:var(--text-sub);font-weight:600}
.menu-toggle{display:none;background:var(--bg-card-2);border:1px solid var(--border-medium);border-radius:10px;padding:8px 12px;cursor:pointer;color:#ffffff;font-size:18px;line-height:1;min-width:42px;min-height:42px;align-items:center;justify-content:center}
.card{background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-soft);box-shadow:var(--shadow-card);transition:all .3s;width:100%;max-width:100%;overflow:hidden}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border-soft)}
.card-title{font-size:13.5px;font-weight:800;color:#ffffff}
.grid{display:grid;gap:12px;width:100%}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.stat{padding:14px;border-radius:var(--radius);background:linear-gradient(145deg,var(--bg-card-2) 0%,var(--bg-card) 100%);border:1px solid var(--border-soft);box-shadow:var(--shadow-card);position:relative;overflow:hidden;width:100%}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.stat.s-success::before{background:var(--success)}
.stat.s-danger::before{background:var(--danger)}
.stat.s-warning::before{background:var(--warning)}
.stat.s-info::before{background:var(--info)}
.stat.s-gold::before{background:var(--gold)}
.stat-label{font-size:11.5px;color:var(--text-sub);margin-bottom:6px;font-weight:600;position:relative;z-index:1}
.stat-value{font-size:17px;font-weight:800;color:#ffffff;letter-spacing:-.5px;position:relative;z-index:1;font-variant-numeric:tabular-nums;word-break:break-word}
.stat-value.positive{color:var(--success)}
.stat-value.negative{color:var(--danger)}
.stat-value.gold{color:var(--gold-light)}
.stat-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.08;pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);border:none;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;position:relative}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-glow)}
.btn-success{background:var(--success);color:#fff;box-shadow:0 2px 8px var(--success-glow)}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-ghost{background:var(--bg-card-2);color:var(--text-main);border:1px solid var(--border-medium)}
.btn-sm{padding:6px 10px;font-size:11.5px}
.quick-tx{width:32px;height:32px;padding:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer}
.quick-tx-in{background:var(--success);color:#fff}
.quick-tx-out{background:var(--danger);color:#fff}
.quick-tx svg{width:16px;height:16px;stroke-width:3}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:6px}
.form-control{width:100%;padding:11px 12px;border:1px solid var(--border-medium);border-radius:var(--radius-sm);font-family:inherit;font-size:16px;background:var(--bg-input);color:#ffffff;transition:all .2s}
.form-control:focus{outline:none;border-color:var(--accent);background:#0c1118}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
input[type=number]{direction:ltr;text-align:right}
select.form-control{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b95a5' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:left 12px center;background-size:16px;padding-left:36px;appearance:none;}

/* ============ 🆕 کادر تاریخ ۳ Select در یک خط ============ */
.date3-wrap{display:flex;flex-direction:column;gap:6px;margin-top:2px;}
.date3-row{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px;direction:rtl;}
.date3-select{
  width:100%;
  padding:8px 6px;
  border:1px solid var(--border-medium);
  border-radius:8px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  background:var(--bg-input);
  color:#ffffff;
  cursor:pointer;
  transition:all .2s;
  text-align:center;
  height:36px;
  appearance:none;
  -webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b95a5' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat:no-repeat;
  background-position:left 6px center;
  background-size:10px;
  padding-left:20px;
}
.date3-select:hover{border-color:var(--border-strong);}
.date3-select:focus{outline:none;border-color:var(--accent);background-color:#0c1118;}
.date3-select option{background:var(--bg-card);color:#fff;padding:8px;}
.date3-display{
  padding:4px 10px;
  background:linear-gradient(135deg,rgba(212,175,55,.12) 0%,rgba(212,175,55,.2) 100%);
  border:1px solid rgba(212,175,55,.3);
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  color:var(--gold-light);
  text-align:center;
  font-variant-numeric:tabular-nums;
  letter-spacing:.5px;
}
.hidden-date-input{display:none!important;}

/* ============ 🆕 جدول اقلام فاکتور — عرض درصدی ============ */
.items-table{min-width:0!important;width:100%;table-layout:fixed;}
.items-table th,.items-table td{padding:6px 4px!important;}
.items-table .col-product{width:50%;}
.items-table .col-qty{width:15%;}
.items-table .col-price{width:20%;}
.items-table .col-total{width:15%;}
.items-table .col-act{width:5%;}
.items-table input,.items-table select{
  font-size:12px!important;
  padding:6px 4px!important;
  height:34px!important;
  min-height:34px!important;
  border-radius:6px!important;
}
.items-table .col-qty input{font-size:13px!important;font-weight:700!important;}
.items-table .col-price input{font-size:12px!important;font-weight:700!important;}
.items-table .col-total .num{font-size:12px!important;}

/* ============ 🆕 لیست کالا — مرتب و ثابت ============ */
.smart-select-list{max-height:260px;overflow-y:auto;background:var(--bg-input);border:1px solid var(--border-medium);border-radius:8px;margin-top:4px;}
.smart-select-list.hidden{display:none;}
.ss-product-item{
  padding:10px 12px;
  cursor:pointer;
  border-bottom:1px solid var(--border-soft);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  height:44px;
  box-sizing:border-box;
  transition:all .15s;
}
.ss-product-item:hover{background:var(--bg-hover);transform:translateX(-2px);}
.ss-product-item.selected{background:rgba(230,57,70,.12);border-right:3px solid var(--accent);}
.ss-product-item.selected .ss-product-name::before{content:'✓ ';color:var(--accent);font-weight:900;}
.ss-product-item.stock-good{background:rgba(16,185,129,.04);}
.ss-product-item.stock-low{background:rgba(245,158,11,.04);}
.ss-product-item.stock-out{background:rgba(239,68,68,.04);}
.ss-product-name{flex:1;font-size:13px;color:var(--text-main);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ss-product-code{font-size:10px;color:var(--text-sub);font-weight:700;background:var(--bg-card-2);padding:1px 5px;border-radius:4px;margin-left:6px;}
.ss-product-stock{font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.ss-stock-good{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.3);}
.ss-stock-low{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3);}
.ss-stock-out{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);}

/* 🆕 انیمیشن Dropdown */
.smart-select-list:not(.hidden){animation:slideDown .2s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

/* ============ Smart Select (مشتری) ============ */
.smart-select-wrap{position:relative;width:100%}
.smart-select-display{width:100%;padding:11px 36px 11px 12px;border:1px solid var(--border-medium);border-radius:var(--radius-sm);font-family:inherit;font-size:15px;background:var(--bg-input);color:#ffffff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:44px;transition:all .2s;}
.smart-select-display:hover{border-color:var(--border-strong);}
.smart-select-display.active{border-color:var(--accent);}
.smart-select-display .ph{color:var(--text-muted);}
.smart-select-display::after{content:'▼';font-size:10px;color:var(--text-sub);margin-right:8px;}
.smart-select-panel{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--bg-card-2);border:1px solid var(--border-strong);border-radius:var(--radius-sm);box-shadow:0 15px 40px rgba(0,0,0,.6);z-index:10000;display:none;overflow:hidden;}
.smart-select-panel.open{display:block;}
.smart-select-panel .ss-search{padding:8px;border-bottom:1px solid var(--border-soft);}
.smart-select-panel .ss-search input{width:100%;padding:8px 10px;border:1px solid var(--border-medium);border-radius:6px;background:var(--bg-input);color:#fff;font-family:inherit;font-size:14px;}
.smart-select-panel .ss-list{max-height:250px;overflow-y:auto;}
.smart-select-panel .ss-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border-soft);font-size:14px;color:var(--text-main);transition:background .15s;}
.smart-select-panel .ss-item:hover{background:var(--bg-hover);color:var(--accent);}
.smart-select-panel .ss-item.selected{background:rgba(230,57,70,.15);color:var(--accent);font-weight:700;}
.smart-select-panel .ss-empty{padding:14px;text-align:center;color:var(--text-muted);font-size:13px;}

.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border-soft);background:var(--bg-input);width:100%;max-width:100%;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:100%}
th{background:var(--bg-card-2);padding:11px 12px;text-align:right;font-weight:700;color:var(--text-sub);font-size:11.5px;border-bottom:1px solid var(--border-medium);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border-soft);color:#ffffff}
tbody tr:hover{background:var(--bg-hover)}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;border:1px solid transparent}
.badge-success{background:rgba(16,185,129,.15);color:#34d399;border-color:rgba(16,185,129,.3)}
.badge-danger{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.3)}
.badge-warning{background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.3)}
.badge-info{background:rgba(59,130,246,.15);color:#60a5fa;border-color:rgba(59,130,246,.3)}
.badge-gray{background:rgba(139,149,165,.15);color:var(--text-sub);border-color:rgba(139,149,165,.25)}
.badge-gold{background:rgba(212,175,55,.15);color:var(--gold-light);border-color:rgba(212,175,55,.35)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;padding-top: calc(var(--safe-top) + 16px);padding-bottom: calc(var(--safe-bottom) + 16px);}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-card);border-radius:var(--radius-lg);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border:1px solid var(--border-medium);box-shadow:0 25px 60px rgba(0,0,0,.6);animation:slideUp .3s;}
.modal.modal-lg{max-width:900px}
@keyframes slideUp{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{padding:16px 18px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg-card);z-index:1}
.modal-title{font-size:15px;font-weight:800;color:#ffffff}
.modal-close{background:var(--bg-card-2);border:1px solid var(--border-medium);font-size:18px;cursor:pointer;color:var(--text-sub);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:18px}
.modal-footer{padding:14px 18px;border-top:1px solid var(--border-soft);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg-card);flex-wrap:wrap}

.empty{text-align:center;padding:36px 16px;color:var(--text-muted)}
.empty .icon{font-size:36px;margin-bottom:10px;opacity:.4}
.empty .title{font-weight:700;color:var(--text-sub);margin-bottom:4px;font-size:13.5px}
.toast{position:fixed;bottom: calc(80px + var(--safe-bottom));left:16px;right:16px;max-width:400px;margin:0 auto;background:var(--bg-card-2);color:#ffffff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:200;font-size:13px;font-weight:700;opacity:0;transform:translateY(20px);transition:.3s;pointer-events:none;border:1px solid var(--border-medium);text-align:center;}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:rgba(16,185,129,.2);color:#34d399;border-color:rgba(16,185,129,.5)}
.toast.error{background:rgba(239,68,68,.2);color:#f87171;border-color:rgba(239,68,68,.5)}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:6px}.gap-3{gap:10px}.gap-4{gap:14px}
.mb-3{margin-bottom:10px}.mb-4{margin-bottom:14px}.mt-3{margin-top:10px}.mt-4{margin-top:14px}
.text-center{text-align:center}
.text-muted{color:var(--text-sub);font-size:12px}
.text-success{color:#34d399}.text-danger{color:#f87171}.text-warning{color:#fbbf24}.text-gold{color:var(--gold-light)}
.font-bold{font-weight:800}
.divider{height:1px;background:var(--border-soft);margin:14px 0}
.hidden{display:none!important}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-tab{padding:6px 12px;border-radius:8px;background:var(--bg-card-2);color:var(--text-sub);font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid var(--border-medium);font-family:inherit;transition:all .2s}
.filter-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-box{position:relative;flex:1;max-width:280px;width:100%}
.search-box input{padding-right:36px}
.search-box::before{content:'🔍';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none}
.chart-container{position:relative;width:100%;height:220px;max-height:220px;overflow:hidden}

<script>
  /* ============ ابزارهای عمومی ============ */
const $ = (s,el)=> (el||document).querySelector(s);
const $$ = (s,el)=> Array.prototype.slice.call((el||document).querySelectorAll(s));

function formatNum(n){
  if(n===null||n===undefined||n==='')return '0';
  const num = Math.round(Number(n)||0);
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function parseNum(s){
  if(typeof s==='number')return s;
  if(!s)return 0;
  const cleaned = String(s).replace(/[,\u066B\u066C\s]/g,'');
  return Number(cleaned)||0;
}
function formatMoney(n){
  const cur = DB.data.settings.currency || 'تومان';
  return formatNum(n)+' '+cur;
}
function attachThousands(input){
  if(input._thousandsAttached)return;
  input._thousandsAttached = true;
  input.addEventListener('input',function(){
    const raw = input.value.replace(/[^\d-]/g,'');
    if(raw==='' || raw==='-'){input.value=raw;return;}
    input.value = formatNum(raw);
  });
}
function todayJalali(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return j.jy+'/'+String(j.jm).padStart(2,'0')+'/'+String(j.jd).padStart(2,'0');
}
function nowJalaliFull(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return j.jy+'/'+String(j.jm).padStart(2,'0')+'/'+String(j.jd).padStart(2,'0')+' - '+String(g.getHours()).padStart(2,'0')+':'+String(g.getMinutes()).padStart(2,'0');
}
function jalaliMonth(jstr){
  if(!jstr)return '';
  return jstr.split('/').slice(0,2).join('/');
}
function validJalali(s){
  if(!s)return false;
  const p = s.split('/').map(Number);
  if(p.length!==3)return false;
  try{return jalaali.isValidJalaaliDate(p[0],p[1],p[2]);}catch(e){return false;}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

function toast(msg,type){
  type = type || '';
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show '+type;
  clearTimeout(t._t);
  t._t = setTimeout(function(){t.classList.remove('show');},2500);
}
function openModal(title,body,footer,size){
  size = size || '';
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFooter').innerHTML = footer || '';
  $('#modalBox').className = 'modal '+(size==='lg'?'modal-lg':'');
  $('#modalOverlay').classList.add('show');
  attachAllThousandsIn($('#modalBody'));
  attachAllThousandsIn($('#modalFooter'));
  setTimeout(function(){ initDatepickers(); }, 100);
}
function closeModal(){
  $('#modalOverlay').classList.remove('show');
  $('#modalBody').innerHTML='';
  $('#modalFooter').innerHTML='';
}
function attachAllThousandsIn(container){
  $$('input[data-thousands]',container).forEach(attachThousands);
}

/* =====================================================
   🆕 انتخاب تاریخ — ۳ Select در یک خط
   ترتیب در HTML: روز، ماه، سال
   با dir=rtl: روز (راست) ← ماه (وسط) ← سال (چپ)
   ===================================================== */
var JALALI_MONTH_NAMES = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function initDatepickers(){
  document.querySelectorAll('input[data-datepicker]').forEach(function(inp){
    if(inp._d3Attached) return;
    inp._d3Attached = true;
    
    if(!inp.id) inp.id = 'dateInput_' + Math.random().toString(36).slice(2,8);
    
    inp.style.display = 'none';
    inp.classList.add('hidden-date-input');
    
    var val = (inp.value||'').trim();
    var jy, jm, jd;
    if(validJalali(val)){
      var parts = val.split('/').map(Number);
      jy = parts[0]; jm = parts[1]; jd = parts[2];
    } else {
      var g = new Date();
      var j = jalaali.toJalaali(g.getFullYear(), g.getMonth()+1, g.getDate());
      jy = j.jy; jm = j.jm; jd = j.jd;
    }
    
    var wrap = document.createElement('div');
    wrap.className = 'date3-wrap';
    wrap.id = 'dateWrap_' + inp.id;
    
    var dayOpts = '';
    for(var d=1; d<=31; d++){
      dayOpts += '<option value="'+d+'" '+(d===jd?'selected':'')+'>'+String(d).padStart(2,'0')+'</option>';
    }
    var monthOpts = '';
    for(var m=1; m<=12; m++){
      monthOpts += '<option value="'+m+'" '+(m===jm?'selected':'')+'>'+String(m).padStart(2,'0')+' — '+JALALI_MONTH_NAMES[m-1]+'</option>';
    }
    var yearOpts = '';
    for(var y=1400; y<=1500; y++){
      yearOpts += '<option value="'+y+'" '+(y===jy?'selected':'')+'>'+y+'</option>';
    }
    
    var initialStr = jy+'/'+String(jm).padStart(2,'0')+'/'+String(jd).padStart(2,'0');
    inp.value = initialStr;
    
    // 🆕 ترتیب در HTML: روز، ماه، سال
    // در RTL: روز سمت راست ← ماه وسط ← سال سمت چپ
    wrap.innerHTML = 
      '<div class="date3-row">' +
        '<select class="date3-select" data-day="'+inp.id+'" title="روز">'+dayOpts+'</select>' +
        '<select class="date3-select" data-month="'+inp.id+'" title="ماه">'+monthOpts+'</select>' +
        '<select class="date3-select" data-year="'+inp.id+'" title="سال">'+yearOpts+'</select>' +
      '</div>' +
      '<div class="date3-display" id="dateDisplay_'+inp.id+'">📅 '+initialStr+'</div>';
    
    inp.parentNode.insertBefore(wrap, inp.nextSibling);
    
    wrap.querySelector('[data-day]').addEventListener('change', function(){ updateDate3(inp.id); });
    wrap.querySelector('[data-month]').addEventListener('change', function(){ updateDate3(inp.id); });
    wrap.querySelector('[data-year]').addEventListener('change', function(){ updateDate3(inp.id); });
  });
}

function updateDate3(inputId){
  var wrap = document.getElementById('dateWrap_' + inputId);
  var inp = document.getElementById(inputId);
  if(!wrap || !inp) return;
  var d = parseInt(wrap.querySelector('[data-day]').value) || 1;
  var m = parseInt(wrap.querySelector('[data-month]').value) || 1;
  var y = parseInt(wrap.querySelector('[data-year]').value) || 1404;
  
  var maxDay = (m<=6) ? 31 : (m<=11 ? 30 : (jalaali.isLeapJalaaliYear(y) ? 30 : 29));
  if(d > maxDay) d = maxDay;
  
  var daySel = wrap.querySelector('[data-day]');
  if(daySel.options.length !== maxDay){
    daySel.innerHTML = '';
    for(var i=1; i<=maxDay; i++){
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = String(i).padStart(2,'0');
      if(i === d) opt.selected = true;
      daySel.appendChild(opt);
    }
  } else {
    daySel.value = d;
  }
  
  var dateStr = y+'/'+String(m).padStart(2,'0')+'/'+String(d).padStart(2,'0');
  inp.value = dateStr;
  var disp = document.getElementById('dateDisplay_' + inputId);
  if(disp) disp.textContent = '📅 '+dateStr;
}

/* ============ Smart Select (انتخاب شخص) ============ */
function buildSmartSelect(options){
  var selItem = null;
  for(var i=0; i<options.items.length; i++){
    if(options.items[i].value === options.selected){ selItem = options.items[i]; break; }
  }
  var displayText = selItem ? selItem.label : (options.placeholder || 'انتخاب کنید');
  var isPlaceholder = !selItem;

  var html = '<div class="smart-select-wrap" id="ssWrap_' + options.id + '">' +
    '<div class="smart-select-display ' + (isPlaceholder?'':'has-value') + '" id="ssDisplay_' + options.id + '" onclick="toggleSmartSelect(&quot;' + options.id + '&quot;)">' +
      '<span class="' + (isPlaceholder?'ph':'') + '">' + displayText + '</span>' +
    '</div>' +
    '<div class="smart-select-panel" id="ssPanel_' + options.id + '">' +
      '<div class="ss-search"><input type="text" placeholder="جستجو..." oninput="filterSmartSelect(&quot;' + options.id + '&quot;, this.value)"></div>' +
      '<div class="ss-list" id="ssList_' + options.id + '">';

  for(var j=0; j<options.items.length; j++){
    var it = options.items[j];
    var isSel = (it.value === options.selected) ? ' selected' : '';
    html += '<div class="ss-item' + isSel + '" data-value="' + it.value + '" data-label="' + it.label + '" onclick="selectSmartItem(&quot;' + options.id + '&quot;, &quot;' + it.value + '&quot;, &quot;' + options.onSelect + '&quot;)">' + it.label + '</div>';
  }
  html += '</div>' +
    '<div class="ss-empty hidden" id="ssEmpty_' + options.id + '">نتیجه‌ای یافت نشد</div>' +
  '</div></div>';

  return html;
}

function toggleSmartSelect(id){
  var panel = document.getElementById('ssPanel_' + id);
  var display = document.getElementById('ssDisplay_' + id);
  if(!panel) return;
  var isOpen = panel.classList.contains('open');
  document.querySelectorAll('.smart-select-panel.open').forEach(function(p){ p.classList.remove('open'); });
  document.querySelectorAll('.smart-select-display.active').forEach(function(d){ d.classList.remove('active'); });
  if(!isOpen){
    panel.classList.add('open');
    if(display) display.classList.add('active');
    var inp = panel.querySelector('.ss-search input');
    if(inp){ setTimeout(function(){ inp.focus(); }, 50); }
  }
}

function filterSmartSelect(id, q){
  var list = document.getElementById('ssList_' + id);
  var empty = document.getElementById('ssEmpty_' + id);
  if(!list) return;
  q = (q||'').toLowerCase().trim();
  var items = list.querySelectorAll('.ss-item');
  var visibleCount = 0;
  items.forEach(function(it){
    var label = (it.getAttribute('data-label')||'').toLowerCase();
    if(!q || label.indexOf(q) !== -1){
      it.style.display = 'block';
      visibleCount++;
    } else {
      it.style.display = 'none';
    }
  });
  if(empty) empty.classList.toggle('hidden', visibleCount > 0);
}

function selectSmartItem(id, value, callbackName){
  var list = document.getElementById('ssList_' + id);
  if(!list) return;
  var items = list.querySelectorAll('.ss-item');
  var selectedLabel = '';
  items.forEach(function(it){
    if(it.getAttribute('data-value') === value){
      it.classList.add('selected');
      selectedLabel = it.getAttribute('data-label');
    } else {
      it.classList.remove('selected');
    }
  });
  var display = document.getElementById('ssDisplay_' + id);
  if(display){
    display.innerHTML = '<span>' + selectedLabel + '</span>';
    display.classList.add('has-value');
  }
  var panel = document.getElementById('ssPanel_' + id);
  if(panel) panel.classList.remove('open');
  if(display) display.classList.remove('active');

  if(callbackName && typeof window[callbackName] === 'function'){
    window[callbackName](value);
  }
}

document.addEventListener('click', function(e){
  if(!e.target.closest('.smart-select-wrap')){
    document.querySelectorAll('.smart-select-panel.open').forEach(function(p){ p.classList.remove('open'); });
    document.querySelectorAll('.smart-select-display.active').forEach(function(d){ d.classList.remove('active'); });
  }
});

/* ============ دیتابیس ============ */
const DB_KEY = 'hesabdar_v5';
const DB = {
  data: {
    settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
    warehouses:[],products:[],persons:[],invoices:[],transactions:[],stockMoves:[],expenses:[]
  },
  load:function(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        this.data = Object.assign({}, this.data, parsed);
        this.data.settings = Object.assign({shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0}, this.data.settings);
        if(!this.data.expenses) this.data.expenses = [];
        this.data.invoices.forEach(function(inv){
          if(inv.airShippingCost===undefined) inv.airShippingCost = 0;
          if(inv.groundShippingCost===undefined) inv.groundShippingCost = 0;
          if(inv.shippingCost===undefined)inv.shippingCost=0;
          if(inv.customsCost===undefined)inv.customsCost=0;
          if(inv.paidAmount===undefined)inv.paidAmount = inv.paid? inv.total : 0;
        });
      }
    }catch(e){console.error(e);}
  },
  save:function(){
    try{localStorage.setItem(DB_KEY,JSON.stringify(this.data));}
    catch(e){toast('خطا در ذخیره اطلاعات','error');}
  },
  resetAll:function(){
    this.data = {
      settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
      warehouses:[],products:[],persons:[],invoices:[],transactions:[],stockMoves:[],expenses:[]
    };
    this.save();
  },
  resetAccounting:function(){
    this.data.settings.initialCapital = 0;
    this.data.settings.initialCapitalDate = '';
    this.data.invoices = [];
    this.data.transactions = [];
    this.data.stockMoves = [];
    this.data.expenses = [];
    this.save();
  }
};
DB.load();

/* ============ محاسبات ============ */
function stockOf(productId,warehouseId,excludeInvoiceId){
  let total = 0;
  for(const m of DB.data.stockMoves){
    if(m.productId!==productId)continue;
    if(warehouseId && m.warehouseId!==warehouseId)continue;
    if(excludeInvoiceId && m.refId===excludeInvoiceId)continue;
    total += (m.type==='in'? m.qty : -m.qty);
  }
  return total;
}
function avgCostOf(productId, excludeInvoiceId){
  const ins = DB.data.stockMoves
    .filter(function(m){return m.productId===productId && m.type==='in' && m.refId!==excludeInvoiceId;})
    .map(function(m){
      const inv = DB.data.invoices.find(function(i){return i.id===m.refId;});
      return {qty:m.qty, inv:inv, date:m.date};
    })
    .sort(function(a,b){return a.date.localeCompare(b.date);});
  const product = DB.data.products.find(function(p){return p.id===productId;});
  let basePrice = product ? (product.purchasePrice || 0) : 0;
  let totalQty = 0;
  let totalValue = 0;
  for(const x of ins){
    if(!x.inv)continue;
    const item = x.inv.items.find(function(it){return it.productId===productId;});
    if(!item)continue;
    const itemSubtotal = item.qty * item.price;
    const invoiceItemsSum = x.inv.items.reduce(function(s,it){return s+it.qty*it.price;},0);
    const ratio = invoiceItemsSum>0 ? itemSubtotal/invoiceItemsSum : 0;
    const airShare = (x.inv.airShippingCost||0) * ratio;
    const groundShare = (x.inv.groundShippingCost||0) * ratio;
    const shippingShare = (x.inv.shippingCost||0) * ratio;
    const customsShare = (x.inv.customsCost||0) * ratio;
    const itemCost = itemSubtotal + airShare + groundShare + shippingShare + customsShare;
    totalQty += item.qty;
    totalValue += itemCost;
  }
  if(totalQty<=0) return basePrice;
  return totalValue/totalQty;
}
function personBalance(personId){
  let bal = 0;
  for(const inv of DB.data.invoices){
    if(inv.personId!==personId)continue;
    const remaining = inv.total - (inv.paidAmount||0);
    if(remaining<=0)continue;
    if(inv.type==='sale') bal -= remaining;
    if(inv.type==='purchase') bal += remaining;
  }
  for(const t of DB.data.transactions){
    if(t.type==='receive' && t.personId===personId) bal += t.amount;
    if(t.type==='pay' && t.personId===personId) bal -= t.amount;
    if(t.type==='transfer'){
      if(t.personId===personId) bal += t.amount;
      if(t.toPersonId===personId) bal -= t.amount;
    }
  }
  return bal;
}
function personBalanceLabel(bal){
  if(Math.abs(bal)<1) return {text:'تسویه',cls:'badge-gray'};
  if(bal>0) return {text:'بستانکار',cls:'badge-success'};
  return {text:'بدهکار',cls:'badge-danger'};
}
function stockValue(){
  let v=0;
  for(const p of DB.data.products){
    const q = stockOf(p.id);
    if(q>0) v += q * avgCostOf(p.id);
  }
  return v;
}
function totals(){
  let sales=0,purchases=0;
  for(const inv of DB.data.invoices){
    if(inv.type==='sale') sales += inv.total;
    if(inv.type==='purchase') purchases += inv.total;
  }
  let cogs = 0;
  for(const inv of DB.data.invoices){
    if(inv.type!=='sale')continue;
    for(const it of inv.items){ cogs += avgCostOf(it.productId) * it.qty; }
  }
  let totalExpenses = 0;
  if(DB.data.expenses){
    for(const e of DB.data.expenses){ totalExpenses += e.amount; }
  }
  const profit = sales - cogs - totalExpenses;
  let receivable=0,payable=0;
  for(const p of DB.data.persons){
    const b = personBalance(p.id);
    if(b<0) receivable += -b;
    if(b>0) payable += b;
  }
  let cash = DB.data.settings.initialCapital||0;
  for(const inv of DB.data.invoices){
    if(inv.type==='sale') cash += (inv.paidAmount||0);
    if(inv.type==='purchase') cash -= (inv.paidAmount||0);
  }
  for(const t of DB.data.transactions){
    if(t.type==='receive') cash += t.amount;
    if(t.type==='pay') cash -= t.amount;
  }
  cash -= totalExpenses;
  return {sales, purchases, cogs, profit, receivable, payable, cash, totalExpenses};
}
function currentCapital(){
  const t = totals();
  const stockVal = stockValue();
  return t.cash + stockVal + t.receivable - t.payable;
}

function getDateRange(period){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  const today = {y:j.jy, m:j.jm, d:j.jd};
  if(period==='today') return {from:today.y+'/'+String(today.m).padStart(2,'0')+'/'+String(today.d).padStart(2,'0'), to:today.y+'/'+String(today.m).padStart(2,'0')+'/'+String(today.d).padStart(2,'0')};
  if(period==='week'){
    const g2 = new Date(g.getTime() - 6*24*60*60*1000);
    const j2 = jalaali.toJalaali(g2.getFullYear(),g2.getMonth()+1,g2.getDate());
    return {from:j2.jy+'/'+String(j2.jm).padStart(2,'0')+'/'+String(j2.jd).padStart(2,'0'), to:today.y+'/'+String(today.m).padStart(2,'0')+'/'+String(today.d).padStart(2,'0')};
  }
  if(period==='month') return {from:today.y+'/'+String(today.m).padStart(2,'0')+'/01', to:today.y+'/'+String(today.m).padStart(2,'0')+'/31'};
  if(period==='year') return {from:today.y+'/01/01', to:today.y+'/12/31'};
  return {from:'', to:''};
}
function inRange(dateStr, from, to){
  if(!from || !to) return true;
  return dateStr >= from && dateStr <= to;
}

function saveQuickTx(personId, type){

function savePerson(id){
  const name = $('#perName').value.trim();
  if(!name){toast('نام شخص را وارد کنید','error');return;}
  const obj = {name:name,phone:$('#perPhone').value.trim(),address:$('#perAddr').value.trim(),type:$('#perType').value,note:$('#perNote').value.trim()};
  if(id){Object.assign(DB.data.persons.find(function(x){return x.id===id;}),obj);}
  else{DB.data.persons.push(Object.assign({id:uid()},obj));}
  DB.save(); closeModal(); renderPersons(); toast('شخص ذخیره شد','success');
}
function deletePerson(id){
  if(DB.data.invoices.some(function(i){return i.personId===id;})){toast('این شخص فاکتور دارد','error');return;}
  if(DB.data.transactions.some(function(t){return t.personId===id||t.toPersonId===id;})){toast('این شخص تراکنش دارد','error');return;}
  confirmAction('حذف این شخص؟',function(){
    DB.data.persons = DB.data.persons.filter(function(p){return p.id!==id;});
    DB.save(); renderPersons(); toast('شخص حذف شد','success');
  });
}

/* ============ گردش حساب ============ */
function personLedger(id){
  const p = DB.data.persons.find(function(x){return x.id===id;});
  if(!p){toast('شخص یافت نشد','error');return;}
  const rows = [];
  for(const inv of DB.data.invoices){
    if(inv.personId===id){
      const rem = inv.total - (inv.paidAmount||0);
      rows.push({date:inv.date,desc:'فاکتور '+(inv.type==='sale'?'فروش':'خرید')+' #'+inv.number+(rem>0?' (نسیه)':''),amount:inv.total,type:inv.type,refType:'invoice',refId:inv.id});
    }
  }
  for(const t of DB.data.transactions){
    if(t.personId===id || t.toPersonId===id){
      let desc = t.type==='receive'?'دریافت وجه':t.type==='pay'?'پرداخت وجه':'انتقال';
      if(t.type==='transfer'){
        const otherId = t.personId===id? t.toPersonId : t.personId;
        const op = DB.data.persons.find(function(x){return x.id===otherId;});
        desc = 'انتقال ' + (t.personId===id?'به':'از') + ' ' + (op?op.name:'?');
      }
      rows.push({date:t.date,desc:desc,amount:t.amount,type:t.type,refType:'transaction',refId:t.id});
    }
  }
  rows.sort(function(a,b){return b.date.localeCompare(a.date);});
  const bal = personBalance(id);
  const label = personBalanceLabel(bal);
  let rowsHtml = '';
  if(!rows.length){
    rowsHtml = '<tr><td colspan="5" class="text-center text-muted">موردی ثبت نشده</td></tr>';
  } else {
    for(const r of rows){
      let typeBadge = '';
      if(r.type==='sale') typeBadge = '<span class="badge badge-success">فروش</span>';
      else if(r.type==='purchase') typeBadge = '<span class="badge badge-danger">خرید</span>';
      else if(r.type==='receive') typeBadge = '<span class="badge badge-info">دریافت</span>';
      else if(r.type==='pay') typeBadge = '<span class="badge badge-warning">پرداخت</span>';
      else typeBadge = '<span class="badge badge-warning">انتقال</span>';
      let actionBtns = '';
      if(r.refType==='invoice'){
        actionBtns = '<button class="btn btn-sm btn-ghost" onclick="editFromLedger(\'invoice\',\''+r.refId+'\',\''+r.type+'\',true)">👁</button> <button class="btn btn-sm btn-warning" onclick="editFromLedger(\'invoice\',\''+r.refId+'\',\''+r.type+'\',false)">✏️</button>';
      } else {
        actionBtns = '<button class="btn btn-sm btn-warning" onclick="editFromLedger(\'transaction\',\''+r.refId+'\',\''+r.type+'\',false)">✏️</button>';
      }
      rowsHtml += '<tr><td class="num">'+r.date+'</td><td>'+r.desc+'</td><td class="num">'+formatNum(r.amount)+'</td><td>'+typeBadge+'</td><td style="white-space:nowrap">'+actionBtns+'</td></tr>';
    }
  }
  openModal('گردش حساب: '+p.name,
    '<div class="flex justify-between mb-3 flex-wrap gap-2"><div class="text-muted">تعداد: '+rows.length+'</div><div>وضعیت: <span class="badge '+label.cls+'">'+label.text+' '+formatMoney(Math.abs(bal))+'</span></div></div>'+
    '<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>شرح</th><th>مبلغ</th><th>نوع</th><th>عملیات</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">بستن</button>', 'lg'
  );
}

function nextInvoiceNumber(type){
  const prefix = type==='sale'?'F':'P';
  const nums = DB.data.invoices.filter(function(i){return i.type===type;}).map(function(i){return Number(i.number.replace(/\D/g,''))||0;});
  return prefix + '-' + String(Math.max.apply(null,[0].concat(nums))+1).padStart(4,'0');
}

function buildProductSearch(idx, currentProductId){
  var p = currentProductId ? DB.data.products.find(function(x){return x.id===currentProductId;}) : null;
  var html = '<div style="position:relative">' +
    '<input class="form-control" id="invProdSearch_' + idx + '" placeholder="جستجوی کالا..." value="' + (p ? p.name : '') + '" onclick="showProductList(' + idx + ')">' +
    '<div class="smart-select-list hidden" id="invProdList_' + idx + '">';
  
  for(var i=0; i<DB.data.products.length; i++){
    var x = DB.data.products[i];
    var qty = stockOf(x.id);
    var stockCls = qty > 10 ? 'ss-stock-good' : (qty > 0 ? 'ss-stock-low' : 'ss-stock-out');
    var stockLabel = qty > 0 ? formatNum(qty) : 'ناموجود';
    var isSel = (x.id === currentProductId) ? ' selected' : '';
    var rowCls = qty > 10 ? 'stock-good' : (qty > 0 ? 'stock-low' : 'stock-out');
    html += '<div class="ss-product-item ' + rowCls + isSel + '" data-id="' + x.id + '" data-name="' + x.name + '" onclick="selectProductForInvoice(' + idx + ', \'' + x.id + '\')">' +
      '<div class="ss-product-name">' + (x.code ? '<span class="ss-product-code">' + x.code + '</span> ' : '') + x.name + '</div>' +
      '<div class="ss-product-stock ' + stockCls + '">📦 ' + stockLabel + '</div>' +
    '</div>';
  }
  html += '</div></div>';
  return html;
}

function showProductList(idx){
  var list = document.getElementById('invProdList_' + idx);
  if(list) list.classList.remove('hidden');
}

function selectProductForInvoice(idx, id){
  var p = DB.data.products.find(function(x){return x.id===id;});
  if(!p) return;
  invoiceItems[idx].productId = id;
  document.getElementById('invProdSearch_' + idx).value = p.name;
  document.getElementById('invProdList_' + idx).classList.add('hidden');
  
  if(!invoiceItems[idx].price){
    var type = document.getElementById('invNumber').value.startsWith('F') ? 'sale' : 'purchase';
    invoiceItems[idx].price = type==='purchase' ? (p.purchasePrice||0) : (p.salePrice||0);
    var row = document.querySelector('#invItemsBody tr[data-row="' + idx + '"]');
    if(row){ var pi = row.querySelectorAll('input')[1]; if(pi) pi.value = formatNum(invoiceItems[idx].price); }
  }
  updateRowTotal(idx);
  recalcInvoice();
}

function renderInvoiceItems(){
  const body = $('#invItemsBody');
  if(!body)return;
  if(!invoiceItems.length){
    body.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:16px">ردیفی اضافه نشده</td></tr>';
    recalcInvoice(); return;
  }
  let html = '';
  for(let idx=0; idx<invoiceItems.length; idx++){ html += invoiceItemsRowHTML(invoiceItems[idx], idx); }
  body.innerHTML = html;
  attachAllThousandsIn(body);
  
  for(let idx=0; idx<invoiceItems.length; idx++){
    const inp = $('#invProdSearch_'+idx);
    if(inp){
      inp.addEventListener('focus', function(){
        const list = $('#invProdList_'+idx);
        if(list) list.classList.remove('hidden');
      });
      inp.addEventListener('input', function(e){
        const q = e.target.value.toLowerCase();
        const list = $('#invProdList_'+idx);
        if(!list) return;
        list.classList.remove('hidden');
        const items = list.querySelectorAll('.ss-product-item');
        items.forEach(function(it){
          const name = (it.getAttribute('data-name')||'').toLowerCase();
          it.style.display = name.includes(q) ? 'flex' : 'none';

      });
    }
  }
  recalcInvoice();

function invoiceItemsRowHTML(it,idx){
  return '<tr data-row="'+idx+'">'+
    '<td class="col-product">'+buildProductSearch(idx, it.productId)+'</td>'+
    '<td class="col-qty"><input class="form-control num" type="number" min="1" value="'+it.qty+'" oninput="updateItemQty('+idx+',this.value)"></td>'+
    '<td class="col-price"><input class="form-control num" data-thousands value="'+formatNum(it.price)+'" oninput="updateItemPrice('+idx+',this.value)"></td>'+
    '<td class="col-total"><span class="num" style="font-weight:700">'+formatNum(it.qty*it.price)+'</span></td>'+
    '<td class="col-act"><button class="btn btn-sm btn-danger" onclick="removeInvoiceItem('+idx+')">✕</button></td>'+
  '</tr>';

function updateItemQty(idx,val){ invoiceItems[idx].qty = Math.max(1,Number(val)||1); updateRowTotal(idx); recalcInvoice(); }
function updateItemPrice(idx,val){ invoiceItems[idx].price = parseNum(val); updateRowTotal(idx); recalcInvoice(); }
function updateRowTotal(idx){
  const row = $('#invItemsBody tr[data-row="'+idx+'"]');
  if(!row)return;
  const cell = row.querySelector('.col-total .num');
  if(cell) cell.textContent = formatNum(invoiceItems[idx].qty*invoiceItems[idx].price);
}
function addInvoiceItem(){ invoiceItems.push({productId:'',qty:1,price:0}); renderInvoiceItems(); }
function removeInvoiceItem(idx){ invoiceItems.splice(idx,1); renderInvoiceItems(); }
function recalcInvoice(){
  const subtotal = invoiceItems.reduce(function(s,i){return s+(i.qty*i.price);},0);
  const airShipping = parseNum(($('#invAirShipping')||{}).value||0);
  const groundShipping = parseNum(($('#invGroundShipping')||{}).value||0);
  const customs = parseNum(($('#invCustoms')||{}).value||0);
  const paid = parseNum(($('#invPaidAmount')||{}).value||0);
  const total = subtotal + airShipping + groundShipping + customs;
  const remaining = total - paid;
  if($('#invSubtotal'))$('#invSubtotal').textContent = formatNum(subtotal);
  if($('#invAirShipShow'))$('#invAirShipShow').textContent = formatNum(airShipping);
  if($('#invGroundShipShow'))$('#invGroundShipShow').textContent = formatNum(groundShipping);
  if($('#invCustShow'))$('#invCustShow').textContent = formatNum(customs);
  if($('#invTotal'))$('#invTotal').textContent = formatNum(total);
  if($('#invPaidShow'))$('#invPaidShow').textContent = formatNum(paid);
  if($('#invRemShow'))$('#invRemShow').textContent = formatNum(remaining);
}
function saveInvoice(type,editId){
  editId = editId || '';
  if(editId){ const inv = DB.data.invoices.find(function(x){return x.id===editId;}); if(inv) type = inv.type; }
  var personId = document.getElementById('invPersonValue') ? document.getElementById('invPersonValue').value : '';
  const whId = $('#invWh').value;
  const date = $('#invDate').value.trim();
  if(!personId){toast('شخص را انتخاب کنید','error');return;}
  if(!whId){toast('انبار را انتخاب کنید','error');return;}
  if(!validJalali(date)){toast('تاریخ معتبر نیست','error');return;}
  if(!invoiceItems.length){toast('حداقل یک ردیف اضافه کنید','error');return;}
  if(invoiceItems.some(function(i){return !i.productId;})){toast('کالا را انتخاب کنید','error');return;}
  if(type==='sale'){
    for(const it of invoiceItems){
      const avail = stockOf(it.productId,whId,editId||null);
      if(avail < it.qty){
        const p = DB.data.products.find(function(x){return x.id===it.productId;});
        toast('موجودی "'+p.name+'" کافی نیست','error'); return;
      }
    }
  }
  const subtotal = invoiceItems.reduce(function(s,i){return s+(i.qty*i.price);},0);
  const airShippingCost = parseNum($('#invAirShipping').value);
  const groundShippingCost = parseNum($('#invGroundShipping').value);
  const customsCost = parseNum($('#invCustoms').value);
  const paidAmount = parseNum($('#invPaidAmount').value);
  const total = subtotal + airShippingCost + groundShippingCost + customsCost;
  const number = $('#invNumber').value.trim();
  const note = $('#invNote').value.trim();
  
  if(editId){
    DB.data.stockMoves = DB.data.stockMoves.filter(function(m){return m.refId!==editId;});
    const inv = DB.data.invoices.find(function(x){return x.id===editId;});
    Object.assign(inv,{personId:personId,warehouseId:whId,date:date,items:invoiceItems.map(function(i){return Object.assign({},i);}),airShippingCost:airShippingCost,groundShippingCost:groundShippingCost,customsCost:customsCost,total:total,paidAmount:paidAmount,number:number,note:note});
    for(const it of invoiceItems){ DB.data.stockMoves.push({id:uid(),date:date,type:type==='purchase'?'in':'out',productId:it.productId,warehouseId:whId,qty:it.qty,refType:'invoice',refId:editId}); }
  } else {
    const id = uid();
    DB.data.invoices.push({id:id,type:type,number:number,date:date,personId:personId,warehouseId:whId,items:invoiceItems.map(function(i){return Object.assign({},i);}),airShippingCost:airShippingCost,groundShippingCost:groundShippingCost,customsCost:customsCost,total:total,paidAmount:paidAmount,note:note,createdAt:nowJalaliFull()});
    for(const it of invoiceItems){ DB.data.stockMoves.push({id:uid(),date:date,type:type==='purchase'?'in':'out',productId:it.productId,warehouseId:whId,qty:it.qty,refType:'invoice',refId:id}); }
  }
  DB.save(); closeModal(); renderInvoices(); toast('فاکتور ذخیره شد','success');
}

let txSearch = '';
function renderTransactions(){
  const list = [].concat(DB.data.transactions).sort(function(a,b){return b.date.localeCompare(a.date);});
  function getTxPersonNames(t){
    if(t.type==='receive'||t.type==='pay'){ const p = DB.data.persons.find(function(x){return x.id===t.personId;}); return p ? p.name : '?'; }
    else if(t.type==='transfer'){ const from = DB.data.persons.find(function(x){return x.id===t.personId;}); const to = DB.data.persons.find(function(x){return x.id===t.toPersonId;}); return (from?from.name:'?')+' '+(to?to.name:'?'); }
    return '?';
  }
  function filterTx(arr, q){ if(!q) return arr; q = q.toLowerCase(); return arr.filter(function(t){ return getTxPersonNames(t).toLowerCase().includes(q); }); }
  function buildRows(arr){
    if(!arr.length){ return '<tr><td colspan="6"><div class="empty"><div class="icon">💸</div><div class="title">'+(txSearch?'نتیجه‌ای یافت نشد':'تراکنشی ثبت نشده')+'</div></div></td></tr>'; }
    let html = '';
    for(const t of arr){
      let who = '-';
      if(t.type==='receive'||t.type==='pay'){ const p = DB.data.persons.find(function(x){return x.id===t.personId;}); who = p?p.name:'?'; }
      else if(t.type==='transfer'){ const from = DB.data.persons.find(function(x){return x.id===t.personId;}); const to = DB.data.persons.find(function(x){return x.id===t.toPersonId;}); who = (from?from.name:'?')+' → '+(to?to.name:'?'); }
      const badge = t.type==='receive'?'badge-success':t.type==='pay'?'badge-danger':'badge-warning';
      const label = t.type==='receive'?'دریافت':t.type==='pay'?'پرداخت':'انتقال';
      html += '<tr><td class="num">'+t.date+'</td><td><span class="badge '+badge+'">'+label+'</span></td><td>'+who+'</td><td class="num">'+formatNum(t.amount)+'</td><td>'+(t.note||'-')+'</td><td><button class="btn btn-sm btn-warning" onclick="txForm(\''+t.type+'\',\''+t.id+'\')">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteTx(\''+t.id+'\')">🗑</button></td></tr>';
    }
    return html;
  }
  const filtered = filterTx(list, txSearch);
  $('#content').innerHTML =
    '<div class="card mb-3" style="padding:10px 12px">'+
      '<div class="search-box" style="max-width:none"><input class="form-control" id="txSearchInput" placeholder="جستجوی نام شخص..." value="'+txSearch.replace(/"/g,'&quot;')+'"></div>'+
    '</div>'+
    '<div class="flex justify-between items-center mb-4" style="flex-wrap:wrap;gap:8px">'+
      '<div class="text-muted">دریافت، پرداخت و انتقال</div>'+
      '<div class="flex gap-2">'+
        '<button class="btn btn-success" onclick="txForm(\'receive\')">📥 دریافت</button>'+
        '<button class="btn btn-danger" onclick="txForm(\'pay\')">📤 پرداخت</button>'+
        '<button class="btn btn-warning" onclick="txForm(\'transfer\')">🔁 انتقال</button>'+
      '</div>'+
    '</div>'+
    '<div class="card"><div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>نوع</th><th>از / به</th><th>مبلغ</th><th>توضیح</th><th>عملیات</th></tr></thead><tbody id="txBody">'+buildRows(filtered)+'</tbody></table></div></div>';
  const searchInput = $('#txSearchInput');
  if(searchInput){
    searchInput.addEventListener('input', function(e){
      txSearch = e.target.value;
      const tbody = $('#txBody');
      if(tbody) tbody.innerHTML = buildRows(filterTx(list, txSearch));
    });
  }
}

function onTxFromSelected(personId){ var h = document.getElementById('txFromValue'); if(h) h.value = personId; }
function onTxToSelected(personId){ var h = document.getElementById('txToValue'); if(h) h.value = personId; }
function onTxPersonSelected(personId){ var h = document.getElementById('txPersonValue'); if(h) h.value = personId; }

function txForm(type, editId){
  editId = editId || null;
  if(!DB.data.persons.length){toast('ابتدا شخص اضافه کنید','warning');return;}
  const existing = editId? DB.data.transactions.find(function(t){return t.id===editId;}) : null;
  if(existing) type = existing.type;
  const isTransfer = type==='transfer';
  
  var personItems = [];
  for(var pi=0; pi<DB.data.persons.length; pi++){
    personItems.push({value: DB.data.persons[pi].id, label: DB.data.persons[pi].name});
  }
  
  var fromSelectHTML = buildSmartSelect({
    id: 'txFrom',
    placeholder: 'انتخاب شخص...',
    items: personItems,
    selected: existing ? existing.personId : '',
    onSelect: 'onTxFromSelected'
  });
  var toSelectHTML = buildSmartSelect({
    id: 'txTo',
    placeholder: 'انتخاب شخص...',
    items: personItems,
    selected: existing ? existing.toPersonId : '',
    onSelect: 'onTxToSelected'
  });
  var personSelectHTML = buildSmartSelect({
    id: 'txPerson',
    placeholder: 'انتخاب شخص...',
    items: personItems,
    selected: existing ? existing.personId : '',
    onSelect: 'onTxPersonSelected'
  });

  let body = '<div class="form-group"><label class="form-label">تاریخ</label><input class="form-control" id="txDate" value="'+(existing?existing.date:todayJalali())+'" data-datepicker></div>';
  if(isTransfer){
    body += '<div class="form-group"><label class="form-label">از شخص *</label>'+fromSelectHTML+'<input type="hidden" id="txFromValue" value="'+(existing?existing.personId:'')+'"></div>';
    body += '<div class="form-group"><label class="form-label">به شخص *</label>'+toSelectHTML+'<input type="hidden" id="txToValue" value="'+(existing?existing.toPersonId:'')+'"></div>';
  } else {
    body += '<div class="form-group"><label class="form-label">شخص *</label>'+personSelectHTML+'<input type="hidden" id="txPersonValue" value="'+(existing?existing.personId:'')+'"></div>';
  }
  body += '<div class="form-group"><label class="form-label">مبلغ *</label><input class="form-control" data-thousands id="txAmount" value="'+(existing?formatNum(existing.amount):'0')+'"></div>';
  body += '<div class="form-group"><label class="form-label">توضیحات</label><input class="form-control" id="txNote" value="'+(existing?(existing.note||''):'')+'"></div>';
  openModal((type==='receive'?'ثبت دریافت':type==='pay'?'ثبت پرداخت':'انتقال')+(editId?' (ویرایش)':''), body,
    '<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>'+
    '<button class="btn btn-primary" onclick="saveTx(\''+type+'\',\''+(editId||'')+'\')">ذخیره</button>'
  );
}
function saveTx(type, editId){
  editId = editId || '';
  if(editId){ const ex = DB.data.transactions.find(function(t){return t.id===editId;}); if(ex) type = ex.type; }
  const date = $('#txDate').value.trim();
  if(!validJalali(date)){toast('تاریخ معتبر نیست','error');return;}
  const amount = parseNum($('#txAmount').value);
  if(amount<=0){toast('مبلغ را وارد کنید','error');return;}
  const note = $('#txNote').value.trim();
  const obj = {date:date,type:type,amount:amount,note:note};
  if(type==='transfer'){
    var from = document.getElementById('txFromValue') ? document.getElementById('txFromValue').value : '';
    var to = document.getElementById('txToValue') ? document.getElementById('txToValue').value : '';
    if(!from||!to){toast('هر دو شخص را انتخاب کنید','error');return;}
    if(from===to){toast('اشخاص باید متفاوت باشند','error');return;}
    obj.personId = from; obj.toPersonId = to;
  } else {
    var person = document.getElementById('txPersonValue') ? document.getElementById('txPersonValue').value : '';
    if(!person){toast('شخص را انتخاب کنید','error');return;}
    obj.personId = person;
  }
  if(editId){ const ex = DB.data.transactions.find(function(t){return t.id===editId;}); Object.assign(ex,obj); }
  else { DB.data.transactions.push(Object.assign({id:uid()},obj)); }
  DB.save(); closeModal(); renderTransactions(); toast('ذخیره شد','success');
}
function deleteTx(id){
  confirmAction('حذف این تراکنش؟',function(){
    DB.data.transactions = DB.data.transactions.filter(function(t){return t.id!==id;});
    DB.save(); renderTransactions(); toast('حذف شد','success');
  });
}

function getCategoryInfo(key){

function renderExpenses(){

  const total = list.reduce(function(s,e){return s+e.amount;},0);

  for(const e of list){ if(!byCategory[e.category]) byCategory[e.category] = 0; byCategory[e.category] += e.amount; }
  let rowsHtml = '';
  if(!list.length){
    rowsHtml = '<tr><td colspan="6"><div class="empty"><div class="icon">🧮</div><div class="title">هزینه‌ای ثبت نشده</div></div></td></tr>';

    for(const e of list){
      const cat = getCategoryInfo(e.category);

    }
  }
  let catCardsHtml = '';

function saveExpense(id){
  const date = $('#expDate').value.trim();
  if(!validJalali(date)){toast('تاریخ معتبر نیست','error');return;}
  const title = $('#expTitle').value.trim();
  if(!title){toast('عنوان را وارد کنید','error');return;}
  const amount = parseNum($('#expAmount').value);
  if(amount<=0){toast('مبلغ را وارد کنید','error');return;}
  const category = $('#expCategory').value;
  const note = $('#expNote').value.trim();
  if(!DB.data.expenses) DB.data.expenses = [];
  if(id){
    const ex = DB.data.expenses.find(function(x){return x.id===id;});
    Object.assign(ex, {date:date, title:title, amount:amount, category:category, note:note});
  } else {
    DB.data.expenses.push({id: uid(), date: date, title: title, amount: amount, category: category, note: note, createdAt: nowJalaliFull()});
  }
  DB.save(); closeModal(); renderExpenses(); toast('ذخیره شد','success');
}

  confirmAction('حذف این هزینه؟ (اثر آن برگشت داده می‌شود)', function(){
    DB.data.expenses = DB.data.expenses.filter(function(e){return e.id!==id;});
    DB.save(); renderExpenses(); toast('حذف شد','success');
  });
}

let reportPeriod = 'all';
let reportCustomFrom = '';
let reportCustomTo = '';
let reportChart = null;

function renderReports(){
  let range;
  if(reportPeriod === 'custom'){ range = {from: reportCustomFrom, to: reportCustomTo}; }
  else { range = getDateRange(reportPeriod); }
  
  const filteredInvoices = DB.data.invoices.filter(function(i){return inRange(i.date, range.from, range.to);});
  const filteredExpenses = (DB.data.expenses||[]).filter(function(e){return inRange(e.date, range.from, range.to);});
  
  let fSales = 0, fPurchases = 0;
  for(const inv of filteredInvoices){
    if(inv.type==='sale') fSales += inv.total;
    if(inv.type==='purchase') fPurchases += inv.total;
  }
  let fCogs = 0;
  for(const inv of filteredInvoices){
    if(inv.type!=='sale')continue;
    for(const it of inv.items){ fCogs += avgCostOf(it.productId) * it.qty; }
  }
  let fExpenses = 0;
  for(const e of filteredExpenses) fExpenses += e.amount;
  const fProfit = fSales - fCogs - fExpenses;
  
  const expByCat = {};
  for(const e of filteredExpenses){
    if(!expByCat[e.category]) expByCat[e.category] = 0;
    expByCat[e.category] += e.amount;
  }
  
  const monthsForChart = lastSixMonths();
  const chartLabels = []; const chartSales = []; const chartPurchases = []; const chartExpenses = [];
  for(const m of monthsForChart){
    let mSales=0, mPurchases=0, mExpenses=0;
    for(const inv of filteredInvoices){
      if(jalaliMonth(inv.date)===m){
        if(inv.type==='sale') mSales+=inv.total;
        if(inv.type==='purchase') mPurchases+=inv.total;
      }
    }
    for(const e of filteredExpenses){
      if(jalaliMonth(e.date)===m){ mExpenses+=e.amount; }
    }
    chartLabels.push(monthName(m)); chartSales.push(mSales); chartPurchases.push(mPurchases); chartExpenses.push(mExpenses);
  }
  
  let rangeLabel = 'کل اطلاعات';
  if(reportPeriod === 'today') rangeLabel = 'امروز';
  else if(reportPeriod === 'week') rangeLabel = 'این هفته';
  else if(reportPeriod === 'month') rangeLabel = 'این ماه';
  else if(reportPeriod === 'year') rangeLabel = 'امسال';
  else if(reportPeriod === 'custom') rangeLabel = (range.from||'...')+' تا '+(range.to||'...');
  
  let catRows = '';
  const catKeys = Object.keys(expByCat);
  if(catKeys.length){
    for(const k of catKeys){
      const c = getCategoryInfo(k);
      catRows += '<tr><td>'+c.icon+' '+c.label+'</td><td class="num text-danger">'+formatMoney(expByCat[k])+'</td></tr>';

    catRows = '<tr><td colspan="2" class="text-center text-muted">هزینه‌ای در این بازه نیست</td></tr>';
  }
  
  const lowStock = DB.data.products.filter(function(p){return stockOf(p.id)<=p.minStock;});
  let lowStockHtml = '';
  if(lowStock.length){
    let rows = '';
    for(const p of lowStock){
      rows += '<tr><td>'+p.name+'</td><td class="num text-danger">'+formatNum(stockOf(p.id))+'</td><td class="num">'+formatNum(p.minStock)+'</td></tr>';
    }
    lowStockHtml = '<div class="table-wrap"><table style="min-width:100%"><thead><tr><th>کالا</th><th>موجودی</th><th>حداقل</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  } else {
    lowStockHtml = '<div class="empty"><div class="icon">✓</div><div class="title">موجودی کافی</div></div>';
  }
  
  let stockRows = '';
  if(DB.data.products.length){
    for(const p of DB.data.products){
      const q = stockOf(p.id); const avg = avgCostOf(p.id);
      stockRows += '<tr><td>'+(p.code||'-')+'</td><td>'+p.name+'</td><td class="num '+(q<=p.minStock?'text-danger':'')+'">'+formatNum(q)+'</td><td class="num" style="color:#60a5fa;font-weight:700">'+formatNum(avg)+'</td><td class="num">'+formatNum(q*avg)+'</td></tr>';
    }
  } else {
    stockRows = '<tr><td colspan="5" class="text-center text-muted">کالایی نیست</td></tr>';
  }

    '<div class="card mb-3" style="padding:12px 14px">'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
        '<span style="font-size:11.5px;font-weight:700;color:var(--text-sub)">📅 بازه:</span>'+
        '<button class="filter-tab '+(reportPeriod==='today'?'active':'')+'" onclick="setReportPeriod(\'today\')">امروز</button>'+
        '<button class="filter-tab '+(reportPeriod==='week'?'active':'')+'" onclick="setReportPeriod(\'week\')">هفته</button>'+
        '<button class="filter-tab '+(reportPeriod==='month'?'active':'')+'" onclick="setReportPeriod(\'month\')">ماه</button>'+
        '<button class="filter-tab '+(reportPeriod==='year'?'active':'')+'" onclick="setReportPeriod(\'year\')">سال</button>'+
        '<button class="filter-tab '+(reportPeriod==='all'?'active':'')+'" onclick="setReportPeriod(\'all\')">کل</button>'+
        '<button class="filter-tab '+(reportPeriod==='custom'?'active':'')+'" onclick="setReportPeriod(\'custom\')">سفارشی</button>'+
      '</div>'+
      '<div class="form-row '+(reportPeriod==='custom'?'':'hidden')+'" id="customRange" style="margin-top:10px">'+
        '<div class="form-group" style="margin-bottom:0"><input type="text" class="form-control" id="rangeFrom" value="'+(reportCustomFrom||'')+'" placeholder="از تاریخ" data-datepicker></div>'+
        '<div class="form-group" style="margin-bottom:0"><input type="text" class="form-control" id="rangeTo" value="'+(reportCustomTo||'')+'" placeholder="تا تاریخ" data-datepicker></div>'+
      '</div>'+
      (reportPeriod==='custom'?'<button class="btn btn-sm btn-primary mt-3" onclick="applyCustomRange()">اعمال</button>':'')+
    '</div>'+
    '<div style="text-align:center;margin-bottom:14px;padding:6px 12px;background:rgba(212,175,55,.08);border-radius:8px;border:1px solid rgba(212,175,55,.2)">'+
      '<b style="color:var(--gold-light);font-size:12px">📊 '+rangeLabel+'</b>'+
    '</div>'+
    '<div class="grid grid-2 mb-4">'+
      '<div class="stat s-success"><div class="stat-label">کل فروش</div><div class="stat-value">'+formatMoney(fSales)+'</div></div>'+
      '<div class="stat s-danger"><div class="stat-label">کل خرید</div><div class="stat-value">'+formatMoney(fPurchases)+'</div></div>'+
      '<div class="stat s-gold"><div class="stat-label">سود ناخالص</div><div class="stat-value gold">'+formatMoney(fSales-fCogs)+'</div></div>'+
      '<div class="stat s-warning"><div class="stat-label">سود خالص</div><div class="stat-value" style="color:'+(fProfit>=0?'var(--success)':'var(--danger)')+'">'+formatMoney(fProfit)+'</div></div>'+
    '</div>'+
    '<div class="grid grid-2 mb-4">'+
      '<div class="card"><div class="card-header"><div class="card-title">نمودار (۶ ماه)</div></div><div class="chart-container"><canvas id="rChart1"></canvas></div></div>'+
      '<div class="card"><div class="card-header"><div class="card-title">هزینه بر اساس دسته</div></div>'+
        '<div class="table-wrap"><table style="min-width:100%"><thead><tr><th>دسته</th><th>مبلغ</th></tr></thead><tbody>'+catRows+'</tbody></table></div>'+
        '<div class="divider"></div>'+
        '<div class="flex justify-between" style="font-weight:800;font-size:13px"><span>جمع هزینه:</span><span style="color:var(--danger)">'+formatMoney(fExpenses)+'</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="grid grid-2 mb-4">'+
      '<div class="card"><div class="card-header"><div class="card-title">کالاهای کم‌موجود</div></div>'+lowStockHtml+'</div>'+

          '<tr><td>بهای تمام‌شده</td><td class="num" style="color:var(--danger)">−'+formatMoney(fCogs)+'</td></tr>'+
          '<tr style="border-top:1px solid var(--border-soft)"><td><b>سود ناخالص</b></td><td class="num"><b>'+formatMoney(fSales-fCogs)+'</b></td></tr>'+
          '<tr><td>هزینه‌ها</td><td class="num" style="color:var(--warning)">−'+formatMoney(fExpenses)+'</td></tr>'+
          '<tr style="border-top:2px solid var(--gold);font-weight:800;font-size:14px"><td><b style="color:var(--gold-light)">سود خالص</b></td><td class="num" style="color:'+(fProfit>=0?'var(--success)':'var(--danger)')+'"><b>'+formatMoney(fProfit)+'</b></td></tr>'+
        '</table>'+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="card-header"><div class="card-title">موجودی و بهای تمام‌شده (لحظه‌ای)</div></div>'+
      '<div class="table-wrap"><table><thead><tr><th>کد</th><th>کالا</th><th>موجودی</th><th>بهای واحد</th><th>ارزش</th></tr></thead><tbody>'+stockRows+'</tbody></table></div>'+
    '</div>';
  
  setTimeout(function(){
    initDatepickers();
    if(reportChart) reportChart.destroy();
    reportChart = new Chart($('#rChart1'),{
      type:'line',
      data:{
        labels:chartLabels,
        datasets:[
          {label:'فروش',data:chartSales,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.1)',tension:.35,fill:true,borderWidth:2},
          {label:'خرید',data:chartPurchases,borderColor:'#e63946',backgroundColor:'rgba(230,57,70,.1)',tension:.35,fill:true,borderWidth:2},

function applyCustomRange(){
  const from = $('#rangeFrom').value.trim();
  const to = $('#rangeTo').value.trim();
  if(!validJalali(from) || !validJalali(to)){
    toast('تاریخ‌ها معتبر نیستند', 'error');
    return;
  }
  if(from > to){
    toast('تاریخ شروع باید قبل از پایان باشد', 'error');
    return;
  }
  reportCustomFrom = from;
  reportCustomTo = to;
  reportPeriod = 'custom';
  renderReports();
}

        '<div class="stat"><div class="stat-label">انبارها</div><div class="stat-value">'+formatNum(DB.data.warehouses.length)+'</div></div>'+
        '<div class="stat s-gold"><div class="stat-label">هزینه‌ها</div><div class="stat-value gold">'+formatNum((DB.data.expenses||[]).length)+'</div></div>'+
      '</div>'+
    '</div>';
}
function saveSettings(){
  DB.data.settings.shopName = $('#setShop').value.trim()||'فروشگاه من';
  DB.data.settings.currency = $('#setCurrency').value;
  DB.save();
  $('#sidebarShopName').textContent = DB.data.settings.shopName;
  toast('ذخیره شد','success');
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB.data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('دانلود شد','success');
}
function importData(e){
  const file = e.target.files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const parsed = JSON.parse(ev.target.result);
      confirmAction('اطلاعات فعلی جایگزین شود؟',function(){
        DB.data = Object.assign({},DB.data,parsed);
        DB.save();
        $('#sidebarShopName').textContent = DB.data.settings.shopName;
        toast('بازیابی شد','success');
        navigate('dashboard');
      });
    }catch(err){toast('فایل معتبر نیست','error');}
  };
  reader.readAsText(file);
  e.target.value='';
}
function resetAccountingData(){
  confirmAction('همه فاکتورها، تراکنش‌ها، هزینه‌ها و سرمایه اولیه پاک شوند؟ (اشخاص، کالاها و انبارها حفظ می‌شوند)',function(){
    DB.resetAccounting();
    toast('اطلاعات حسابداری و سرمایه اولیه پاک شد','success');
    navigate('dashboard');
  });
}
function resetAllData(){
  confirmAction('⚠️ کل اطلاعات حذف شود؟ این عملیات برگشت‌پذیر نیست.',function(){
    DB.resetAll();
    toast('پاک شد','success');
    navigate('dashboard');
  });
}

/* ============ Service Worker & Install ============ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js')
      .then(function(reg) { console.log('Service Worker ثبت شد'); })
      .catch(function(err) { console.log('خطا در ثبت SW:', err); });
  });
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(choiceResult) { deferredPrompt = null; });
}

/* ============ شروع ============ */
setTimeout(function(){ initDatepickers(); }, 100);
navigate('dashboard');
</script>
