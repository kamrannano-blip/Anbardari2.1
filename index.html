<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سیستم حسابداری و انبارداری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.6/dist/jalaali.min.js"></script>
<style>
:root{
  --primary:#4f46e5; --primary-dark:#4338ca; --primary-light:#eef2ff;
  --success:#10b981; --success-light:#ecfdf5;
  --danger:#ef4444; --danger-light:#fef2f2;
  --warning:#f59e0b; --warning-light:#fffbeb;
  --info:#3b82f6; --info-light:#eff6ff;
  --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
  --gray-300:#d1d5db; --gray-400:#9ca3af; --gray-500:#6b7280;
  --gray-600:#4b5563; --gray-700:#374151; --gray-800:#1f2937; --gray-900:#111827;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;background:var(--gray-50);color:var(--gray-800);font-size:14px;line-height:1.6}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:#fff;border-left:1px solid var(--gray-200);padding:20px 0;position:fixed;top:0;right:0;bottom:0;overflow-y:auto;z-index:50;transition:transform .3s}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px;border-bottom:1px solid var(--gray-100);margin-bottom:16px}
.sidebar .brand-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700}
.sidebar .brand-text{font-weight:700;font-size:15px;color:var(--gray-800)}
.sidebar .brand-sub{font-size:11px;color:var(--gray-500)}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--gray-600);cursor:pointer;font-weight:500;border-right:3px solid transparent;transition:.15s;user-select:none}
.nav-item:hover{background:var(--gray-50);color:var(--primary)}
.nav-item.active{background:var(--primary-light);color:var(--primary);border-right-color:var(--primary)}
.nav-item .icon{font-size:18px;width:22px;text-align:center}
.main{margin-right:260px;flex:1;padding:24px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:700;color:var(--gray-900)}
.page-sub{font-size:13px;color:var(--gray-500)}
.menu-toggle{display:none;background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:18px}

/* ---------- Cards ---------- */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid var(--gray-100)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.card-title{font-size:15px;font-weight:700;color:var(--gray-800)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ---------- Stat cards ---------- */
.stat{padding:18px;border-radius:var(--radius);background:#fff;border:1px solid var(--gray-100);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--primary)}
.stat.s-success::before{background:var(--success)}
.stat.s-danger::before{background:var(--danger)}
.stat.s-warning::before{background:var(--warning)}
.stat.s-info::before{background:var(--info)}
.stat-label{font-size:12px;color:var(--gray-500);margin-bottom:6px;font-weight:500}
.stat-value{font-size:20px;font-weight:700;color:var(--gray-900);letter-spacing:-.5px}
.stat-value.positive{color:var(--success)}
.stat-value.negative{color:var(--danger)}
.stat-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.15}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-warning{background:var(--warning);color:#fff}
.btn-warning:hover{background:#d97706}
.btn-ghost{background:var(--gray-100);color:var(--gray-700)}
.btn-ghost:hover{background:var(--gray-200)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-icon{padding:8px;width:34px;height:34px;justify-content:center}

/* ---------- Forms ---------- */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:6px}
.form-control{width:100%;padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;background:#fff;transition:.15s;color:var(--gray-800)}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
input[type=number]{direction:ltr;text-align:right}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--gray-100)}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{background:var(--gray-50);padding:11px 12px;text-align:right;font-weight:600;color:var(--gray-600);font-size:12px;border-bottom:1px solid var(--gray-200);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--gray-50)}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Badges ---------- */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-info{background:var(--info-light);color:var(--info)}
.badge-gray{background:var(--gray-100);color:var(--gray-600)}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .2s}
.modal.modal-lg{max-width:900px}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-400);width:30px;height:30px;border-radius:6px}
.modal-close:hover{background:var(--gray-100);color:var(--gray-700)}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--gray-100);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:40px 20px;color:var(--gray-400)}
.empty .icon{font-size:40px;margin-bottom:10px;opacity:.4}
.empty .title{font-weight:600;color:var(--gray-500);margin-bottom:4px}
.empty .sub{font-size:12px}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:20px;left:20px;background:var(--gray-900);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:200;font-size:13px;font-weight:500;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}

/* ---------- Misc ---------- */
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.text-center{text-align:center}
.text-muted{color:var(--gray-500);font-size:12px}
.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:var(--warning)}
.font-bold{font-weight:700}
.divider{height:1px;background:var(--gray-100);margin:16px 0}
.hidden{display:none!important}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-tab{padding:7px 14px;border-radius:20px;background:var(--gray-100);color:var(--gray-600);font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:.15s}
.filter-tab:hover{background:var(--gray-200)}
.filter-tab.active{background:var(--primary);color:#fff}
.search-box{position:relative;flex:1;max-width:280px}
.search-box input{padding-right:34px}
.search-box::before{content:'🔍';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}

/* ---------- Invoice Print ---------- */
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;top:0;right:0;width:100%;padding:20px;background:#fff}
  .no-print{display:none!important}
}

/* ---------- Responsive sidebar ---------- */
@media(max-width:900px){
  .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0}
  .menu-toggle{display:inline-flex}
}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--gray-100)}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}

/* ---------- Items table in invoice ---------- */
.items-table input,.items-table select{padding:6px 8px;font-size:12px}
.invoice-total{background:var(--gray-50);padding:14px 18px;border-radius:var(--radius-sm);display:flex;flex-direction:column;gap:6px}
.invoice-total .row{display:flex;justify-content:space-between;font-size:13px}
.invoice-total .row.total{font-size:15px;font-weight:700;color:var(--primary);padding-top:8px;border-top:1px solid var(--gray-200);margin-top:4px}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">ح</div>
      <div>
        <div class="brand-text" id="sidebarShopName">فروشگاه من</div>
        <div class="brand-sub">سیستم حسابداری</div>
      </div>
    </div>
    <nav>
      <div class="nav-item active" data-page="dashboard"><span class="icon">📊</span>داشبورد</div>
      <div class="nav-item" data-page="invoices"><span class="icon">🧾</span>فاکتورها</div>
      <div class="nav-item" data-page="products"><span class="icon">📦</span>کالاها</div>
      <div class="nav-item" data-page="warehouses"><span class="icon">🏭</span>انبارها</div>
      <div class="nav-item" data-page="persons"><span class="icon">👥</span>اشخاص</div>
      <div class="nav-item" data-page="transactions"><span class="icon">💸</span>تراکنش‌ها</div>
      <div class="nav-item" data-page="capital"><span class="icon">💰</span>سرمایه و سود</div>
      <div class="nav-item" data-page="reports"><span class="icon">📈</span>گزارش‌ها</div>
      <div class="nav-item" data-page="settings"><span class="icon">⚙️</span>تنظیمات</div>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div>
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <span class="page-title" id="pageTitle">داشبورد</span>
      </div>
      <div class="text-muted" id="todayDate"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">عنوان</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   بخش ۱: ابزارهای عمومی
   ========================================================= */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];

// ---------- اعداد ----------
function formatNum(n){
  if(n===null||n===undefined||n==='')return '0';
  const num = Math.round(Number(n)||0);
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function parseNum(s){
  if(typeof s==='number')return s;
  if(!s)return 0;
  return Number(String(s).replace(/[,\s]/g,''))||0;
}
function formatMoney(n){
  const cur = DB.data.settings.currency || 'تومان';
  return formatNum(n)+' '+cur;
}
// برای input ها: نمایش با کاما
function attachThousands(input){
  input.addEventListener('input',()=>{
    const raw = input.value.replace(/[^\d-]/g,'');
    if(raw==='' || raw==='-'){input.value=raw;return;}
    input.value = formatNum(raw);
  });
}

// ---------- تاریخ شمسی ----------
function todayJalali(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return `${j.jy}/${String(j.jm).padStart(2,'0')}/${String(j.jd).padStart(2,'0')}`;
}
function nowJalaliFull(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return `${j.jy}/${String(j.jm).padStart(2,'0')}/${String(j.jd).padStart(2,'0')} - ${String(g.getHours()).padStart(2,'0')}:${String(g.getMinutes()).padStart(2,'0')}`;
}
function jalaliMonth(jstr){
  if(!jstr)return '';
  const parts = jstr.split('/');
  return parts[0]+'/'+parts[1];
}
function jalaliYear(jstr){
  if(!jstr)return '';
  return jstr.split('/')[0];
}
function validJalali(s){
  if(!s)return false;
  const p = s.split('/').map(Number);
  if(p.length!==3)return false;
  return jalaali.isValidJalaaliDate(p[0],p[1],p[2]);
}

// ---------- شناسه ----------
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

// ---------- Toast ----------
function toast(msg,type=''){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show '+type;
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'),2500);
}

// ---------- Modal ----------
function openModal(title,body,footer,size=''){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFooter').innerHTML = footer || '';
  $('#modalBox').className = 'modal '+(size==='lg'?'modal-lg':'');
  $('#modalOverlay').classList.add('show');
  attachAllThousandsIn($('#modalBody'));
  attachAllThousandsIn($('#modalFooter'));
}
function closeModal(){
  $('#modalOverlay').classList.remove('show');
  $('#modalBody').innerHTML='';
  $('#modalFooter').innerHTML='';
}
function attachAllThousandsIn(container){
  $$('input[data-thousands]',container).forEach(attachThousands);
}

// ---------- Confirm ----------
function confirmAction(msg,onYes){
  openModal('تأیید عملیات',
    `<p style="font-size:14px;line-height:1.8">${msg}</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
     <button class="btn btn-danger" id="confirmYes">بله، انجام بده</button>`
  );
  $('#confirmYes').onclick = ()=>{closeModal();onYes();};
}

/* =========================================================
   بخش ۲: دیتابیس (localStorage)
   ========================================================= */
const DB_KEY = 'hesabdar_v1';
const DB = {
  data: {
    settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
    warehouses:[],   // {id,name,desc}
    products:[],     // {id,code,name,unit,purchasePrice,salePrice,minStock}
    persons:[],      // {id,name,phone,address,type:'customer'|'supplier'|'both',note}
    invoices:[],     // {id,type:'purchase'|'sale',number,date,personId,warehouseId,items:[{productId,qty,price,discount}],discount,tax,note,total,paid}
    transactions:[], // {id,date,type:'receive'|'pay'|'transfer',personId,toPersonId,amount,note}
    stockMoves:[]    // برای رهگیری: {id,date,type:'in'|'out',productId,warehouseId,qty,refType,refId}
  },
  load(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        this.data = {...this.data,...parsed};
        this.data.settings = {...{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},...this.data.settings};
      }
    }catch(e){console.error(e);}
  },
  save(){
    try{localStorage.setItem(DB_KEY,JSON.stringify(this.data));}
    catch(e){toast('خطا در ذخیره اطلاعات','error');}
  },
  resetAll(){
    this.data = {
      settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
      warehouses:[],products:[],persons:[],invoices:[],transactions:[],stockMoves:[]
    };
    this.save();
  },
  resetAccounting(){
    this.data.invoices = [];
    this.data.transactions = [];
    this.data.stockMoves = [];
    this.save();
  }
};
DB.load();

/* =========================================================
   بخش ۳: محاسبات (موجودی، مانده اشخاص، سرمایه)
   ========================================================= */

// موجودی یک کالا در یک انبار
function stockOf(productId,warehouseId=null){
  let total = 0;
  for(const m of DB.data.stockMoves){
    if(m.productId!==productId)continue;
    if(warehouseId && m.warehouseId!==warehouseId)continue;
    total += (m.type==='in'? m.qty : -m.qty);
  }
  return total;
}

// مانده شخص: مثبت = بستانکار (طلبکار از ما / ما به او بدهکاریم)
// قرارداد: از دید فروشگاه
//  - فاکتور فروش => شخص به ما بدهکار می‌شود (مانده حساب شخص کاهش می‌یابد؟ نه، بدهکاری او نسبت به ما افزایش => در محاسبه "طلب ما از شخص" بالا می‌رود)
//  ساده‌سازی: balance = (جمع پرداختی‌های ما به شخص) - (جمع دریافتی‌های ما از شخص) + (فروش نسیه) - (خرید نسیه)؟
// بهتر است اینطور تعریف کنیم:
//  balance > 0  => شخص بستانکار است (ما به او بدهکاریم) - باید پرداخت کنیم
//  balance < 0  => شخص بدهکار است (او به ما بدهکار است) - باید دریافت کنیم
// محاسبه:
//  - فاکتور فروش (نسیه): شخص به ما بدهکار می‌شود => balance -= total
//  - فاکتور خرید (نسیه): ما به شخص بدهکار می‌شویم => balance += total
//  - تراکنش دریافت (receive): ما از شخص پول گرفتیم => balance += amount (بدهی او کم می‌شود)
//  - تراکنش پرداخت (pay): ما به شخص پول دادیم => balance -= amount
//  - انتقال بین اشخاص: از A به B (پرداخت بدهی A و دریافت از B)؟ در UI مشخص می‌کنیم.
function personBalance(personId){
  let bal = 0;
  // فاکتورها
  for(const inv of DB.data.invoices){
    if(inv.personId!==personId)continue;
    if(inv.paid)continue; // اگر نقدی پرداخت شد، روی مانده اثر ندارد
    if(inv.type==='sale') bal -= inv.total; // شخص بدهکار می‌شود
    if(inv.type==='purchase') bal += inv.total; // ما بدهکار می‌شویم
  }
  // تراکنش‌ها
  for(const t of DB.data.transactions){
    if(t.type==='receive' && t.personId===personId) bal += t.amount;
    if(t.type==='pay' && t.personId===personId) bal -= t.amount;
    if(t.type==='transfer'){
      // از شخص A (پرداخت) به شخص B (دریافت)
      if(t.personId===personId) bal -= t.amount;      // ما به A پرداخت کردیم => بدهی ما به A کم می‌شود => balance -=
      if(t.toPersonId===personId) bal += t.amount;    // ما از B دریافت کردیم => بدهی B به ما کم می‌شود => balance +=
    }
  }
  return bal;
}
// تفسیر: bal>0 => ما بدهکاریم (بستانکار شخص)
//         bal<0 => شخص بدهکار است
function personBalanceLabel(bal){
  if(Math.abs(bal)<1) return {text:'تسویه',cls:'badge-gray'};
  if(bal>0) return {text:'بستانکار',cls:'badge-success'};
  return {text:'بدهکار',cls:'badge-danger'};
}

// ارزش انبار (به قیمت خرید)
function stockValue(){
  let v=0;
  for(const p of DB.data.products){
    const q = stockOf(p.id);
    v += q * (p.purchasePrice||0);
  }
  return v;
}

// جمع فروش، خرید، سود
function totals(){
  let sales=0,purchases=0;
  for(const inv of DB.data.invoices){
    if(inv.type==='sale') sales += inv.total;
    if(inv.type==='purchase') purchases += inv.total;
  }
  // سود ناخالص = فروش - بهای تمام شده فروش رفته
  // برای سادگی: از stockMoves نوع out که refType=sale محاسبه کنیم
  let cogs = 0;
  for(const inv of DB.data.invoices){
    if(inv.type!=='sale')continue;
    for(const it of inv.items){
      const prod = DB.data.products.find(p=>p.id===it.productId);
      if(prod) cogs += (prod.purchasePrice||0) * it.qty;
    }
  }
  const profit = sales - cogs;
  // طلب و بدهی
  let receivable=0,payable=0;
  for(const p of DB.data.persons){
    const b = personBalance(p.id);
    if(b<0) receivable += -b;
    if(b>0) payable += b;
  }
  // نقد: سرمایه اولیه + دریافت‌ها - پرداخت‌ها - خریدهای نقدی + فروش‌های نقدی
  let cash = DB.data.settings.initialCapital||0;
  for(const inv of DB.data.invoices){
    if(inv.paid){
      if(inv.type==='sale') cash += inv.total;
      if(inv.type==='purchase') cash -= inv.total;
    }
  }
  for(const t of DB.data.transactions){
    if(t.type==='receive') cash += t.amount;
    if(t.type==='pay') cash -= t.amount;
  }
  return {sales,purchases,cogs,profit,receivable,payable,cash};
}

function monthName(m){
  const names=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const p=m.split('/'); if(p.length<2)return m;
  return names[(Number(p[1])-1)]+' '+p[0].slice(2);
}
function lastSixMonths(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  const arr=[];
  let y=j.jy,m=j.jm;
  for(let i=0;i<6;i++){
    arr.unshift(`${y}/${String(m).padStart(2,'0')}`);
    m--; if(m<1){m=12;y--;}
  }
  return arr;
}

  if(!name){toast('نام کالا را وارد کنید','error');return;}
  const obj = {
    code:$('#pCode').value.trim(),
    name,
    unit:$('#pUnit').value.trim()||'عدد',
    purchasePrice:parseNum($('#pPurchase').value),
    salePrice:parseNum($('#pSale').value),
    minStock:parseNum($('#pMin').value)
  };
  if(id){
    const p = DB.data.products.find(x=>x.id===id);
    Object.assign(p,obj);
  } else {

  }
  DB.save(); closeModal(); renderProducts(); toast('کالا ذخیره شد','success');

function deleteProduct(id){
  if(DB.data.stockMoves.some(m=>m.productId===id)){toast('این کالا در گردش انبار استفاده شده','error');return;}
  if(DB.data.invoices.some(i=>i.items.some(it=>it.productId===id))){toast('این کالا در فاکتورها استفاده شده','error');return;}
  confirmAction('آیا از حذف این کالا مطمئن هستید؟',()=>{
    DB.data.products = DB.data.products.filter(p=>p.id!==id);
    DB.save(); renderProducts(); toast('کالا حذف شد','success');

function savePerson(id){
  const name = $('#perName').value.trim();

  const obj = {name,phone:$('#perPhone').value.trim(),address:$('#perAddr').value.trim(),type:$('#perType').value,note:$('#perNote').value.trim()};
  if(id){Object.assign(DB.data.persons.find(x=>x.id===id),obj);}
  else{DB.data.persons.push({id:uid(),...obj});}
  DB.save(); closeModal(); renderPersons(); toast('شخص ذخیره شد','success');
}
function deletePerson(id){
  if(DB.data.invoices.some(i=>i.personId===id)){toast('این شخص فاکتور دارد','error');return;}
  if(DB.data.transactions.some(t=>t.personId===id||t.toPersonId===id)){toast('این شخص تراکنش دارد','error');return;}
  confirmAction('حذف این شخص؟',()=>{
    DB.data.persons = DB.data.persons.filter(p=>p.id!==id);
    DB.save(); renderPersons(); toast('شخص حذف شد','success');
  });
}
function personLedger(id){
  const p = DB.data.persons.find(x=>x.id===id);
  const rows = [];
  for(const inv of DB.data.invoices){
    if(inv.personId===id){
      rows.push({date:inv.date,desc:`فاکتور ${inv.type==='sale'?'فروش':'خرید'} #${inv.number}`,amount:inv.total,type:inv.type,paid:inv.paid});
    }
  }
  for(const t of DB.data.transactions){
    if(t.personId===id || t.toPersonId===id){
      let desc = t.type==='receive'?'دریافت وجه':t.type==='pay'?'پرداخت وجه':'انتقال';
      if(t.type==='transfer'){
        const other = t.personId===id? t.toPersonId : t.personId;
        const op = DB.data.persons.find(x=>x.id===other);
        desc = `انتقال ${t.personId===id?'به':'از'} ${op?.name||'?'}`;
      }
      rows.push({date:t.date,desc,amount:t.amount,type:t.type,paid:true,note:t.note});
    }

  rows.sort((a,b)=>b.date.localeCompare(a.date));

    </div>
    <div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>شرح</th><th>مبلغ</th><th>نوع</th></tr></thead><tbody>
      ${rows.length? rows.map(r=>`<tr>
        <td class="num">${r.date}</td>
        <td>${r.desc}</td>
        <td class="num">${formatNum(r.amount)}</td>
        <td><span class="badge ${r.type==='sale'?'badge-success':r.type==='purchase'?'badge-danger':r.type==='receive'?'badge-info':'badge-warning'}">${

function nextInvoiceNumber(type){
  const prefix = type==='sale'?'F':'P';
  const nums = DB.data.invoices.filter(i=>i.type===type).map(i=>Number(i.number.replace(/\D/g,''))||0);
  return prefix + '-' + String((Math.max(0,...nums)+1)).padStart(4,'0');
}

  const whId = inv? inv.warehouseId : (DB.data.warehouses[0]?.id||'');

        <select class="form-control" id="invPerson">

        </select>
      </div>
      <div class="form-group"><label class="form-label">انبار *</label>
        <select class="form-control" id="invWh">
          ${DB.data.warehouses.map(w=>`<option value="${w.id}" ${w.id===whId?'selected':''}>${w.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="divider"></div>

      <div class="font-bold">اقلام فاکتور</div>
      <button class="btn btn-sm btn-primary" onclick="addInvoiceItem()">➕ افزودن ردیف</button>
    </div>
    <div class="table-wrap">
      <table class="items-table"><thead><tr>
        <th>کالا</th><th>تعداد</th><th>قیمت واحد</th><th>جمع</th><th></th>
      </tr></thead><tbody id="invItemsBody"></tbody></table>
    </div>
    <div class="form-row mt-4">
      <div class="form-group"><label class="form-label">تخفیف کل</label><input class="form-control" data-thousands id="invDiscount" value="${inv?formatNum(inv.discount||0):'0'}"></div>
      <div class="form-group"><label class="form-label">مالیات (٪)</label><input class="form-control" id="invTax" value="${inv?inv.tax||0:DB.data.settings.taxPercent||0}" type="number"></div>
    </div>
    <div class="form-group"><label class="form-label">توضیحات</label><input class="form-control" id="invNote" value="${inv?inv.note||'':''}"></div>
    <div class="form-group">
      <label class="form-label">نوع پرداخت</label>
      <select class="form-control" id="invPaid">
        <option value="0" ${inv&&!inv.paid?'selected':''}>نسیه</option>
        <option value="1" ${inv&&inv.paid?'selected':''}>نقدی</option>
      </select>
    </div>
    <div class="invoice-total mt-4">
      <div class="row"><span>جمع اقلام:</span><span class="num" id="invSubtotal">0</span></div>
      <div class="row"><span>تخفیف:</span><span class="num" id="invDiscShow">0</span></div>
      <div class="row"><span>مالیات:</span><span class="num" id="invTaxShow">0</span></div>
      <div class="row total"><span>مبلغ نهایی:</span><span class="num" id="invTotal">0</span></div>
    </div>
    `,
    `<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
     <button class="btn btn-primary" onclick="saveInvoice('${type}','${editId||''}')">💾 ذخیره فاکتور</button>`,
    'lg'
  );

  renderInvoiceItems();
  setTimeout(()=>{
    $('#invDiscount').addEventListener('input',recalcInvoice);
    $('#invTax').addEventListener('input',recalcInvoice);

  },10);
}
function renderInvoiceItems(){
  const body = $('#invItemsBody');
  if(!body)return;
  if(!invoiceItems.length){
    body.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:16px">ردیفی اضافه نشده</td></tr>';
    return;
  }
  body.innerHTML = invoiceItems.map((it,idx)=>{
    const p = DB.data.products.find(x=>x.id===it.productId);
    return `<tr>
      <td>
        <select class="form-control" onchange="updateItem(${idx},'productId',this.value)">
          <option value="">انتخاب کالا</option>
          ${DB.data.products.map(x=>`<option value="${x.id}" ${x.id===it.productId?'selected':''}>${x.name}</option>`).join('')}
        </select>
      </td>
      <td><input class="form-control num" type="number" min="1" value="${it.qty}" onchange="updateItem(${idx},'qty',this.value)" style="width:80px"></td>
      <td><input class="form-control num" value="${formatNum(it.price)}" data-thousands onchange="updateItem(${idx},'price',this.value)" style="width:120px"></td>
      <td class="num">${formatNum(it.qty*it.price)}</td>
      <td><button class="btn btn-sm btn-danger" onclick="removeInvoiceItem(${idx})">✕</button></td>
    </tr>`;
  }).join('');
  attachAllThousandsIn(body);
  recalcInvoice();
}
function addInvoiceItem(){
  invoiceItems.push({productId:'',qty:1,price:0});
  renderInvoiceItems();
}
function removeInvoiceItem(idx){
  invoiceItems.splice(idx,1);
  renderInvoiceItems();
}
function updateItem(idx,key,val){
  if(key==='qty') invoiceItems[idx].qty = Math.max(1,Number(val)||1);
  else if(key==='price') invoiceItems[idx].price = parseNum(val);
  else invoiceItems[idx][key] = val;
  if(key==='productId' && val){
    const p = DB.data.products.find(x=>x.id===val);
    if(p && invoiceItems[idx].price===0) invoiceItems[idx].price = p.purchasePrice;
  }
  renderInvoiceItems();
}
function recalcInvoice(){
  const subtotal = invoiceItems.reduce((s,i)=>s+(i.qty*i.price),0);
  const discount = parseNum($('#invDiscount')?.value||0);
  const taxP = Number($('#invTax')?.value||0);
  const tax = Math.round((subtotal-discount)*taxP/100);
  const total = subtotal-discount+tax;
  if($('#invSubtotal'))$('#invSubtotal').textContent = formatNum(subtotal);
  if($('#invDiscShow'))$('#invDiscShow').textContent = formatNum(discount);
  if($('#invTaxShow'))$('#invTaxShow').textContent = formatNum(tax);
  if($('#invTotal'))$('#invTotal').textContent = formatNum(total);
}
function saveInvoice(type,editId){
  const personId = $('#invPerson').value;
  const whId = $('#invWh').value;
  const date = $('#invDate').value.trim();
  if(!personId){toast('شخص را انتخاب کنید','error');return;}
  if(!whId){toast('انبار را انتخاب کنید','error');return;}
  if(!validJalali(date)){toast('تاریخ معتبر نیست (مثال: 1403/01/01)','error');return;}
  if(!invoiceItems.length){toast('حداقل یک ردیف اضافه کنید','error');return;}
  if(invoiceItems.some(i=>!i.productId)){toast('کالای هر ردیف را انتخاب کنید','error');return;}
  if(type==='sale'){
    // بررسی موجودی
    for(const it of invoiceItems){
      if(stockOf(it.productId,whId) < it.qty){
        const p = DB.data.products.find(x=>x.id===it.productId);
        toast(`موجودی کالای "${p.name}" در این انبار کافی نیست`,'error');
        return;
      }
    }
  }
  const subtotal = invoiceItems.reduce((s,i)=>s+(i.qty*i.price),0);
  const discount = parseNum($('#invDiscount').value);
  const taxP = Number($('#invTax').value||0);
  const tax = Math.round((subtotal-discount)*taxP/100);
  const total = subtotal-discount+tax;
  const paid = $('#invPaid').value==='1';
  const number = $('#invNumber').value.trim();
  const note = $('#invNote').value.trim();

  if(editId){
    // حذف stockMoves قبلی
    DB.data.stockMoves = DB.data.stockMoves.filter(m=>m.refId!==editId);
    const inv = DB.data.invoices.find(x=>x.id===editId);
    Object.assign(inv,{personId,warehouseId:whId,date,items:invoiceItems.map(i=>({...i})),discount,tax,total,paid,number,note});
  } else {
    const id = uid();
    DB.data.invoices.push({id,type,number,date,personId,warehouseId:whId,items:invoiceItems.map(i=>({...i})),discount,tax,total,paid,note,createdAt:nowJalaliFull()});
    // ثبت گردش انبار
    for(const it of invoiceItems){
      DB.data.stockMoves.push({
        id:uid(),date,type:type==='purchase'?'in':'out',
        productId:it.productId,warehouseId:whId,qty:it.qty,
        refType:'invoice',refId:id
      });
    }
  }
  DB.save(); closeModal(); renderInvoices(); toast('فاکتور ذخیره شد','success');
}

        ${items.map((i,idx)=>`<tr><td>${idx+1}</td><td>${i.name}</td><td class="num">${formatNum(i.qty)} ${i.unit}</td><td class="num">${formatNum(i.price)}</td><td class="num">${formatNum(i.qty*i.price)}</td></tr>`).join('')}

      ${inv.note?`<div class="mt-3"><b>توضیحات:</b> ${inv.note}</div>`:''}

  `,`<button class="btn btn-ghost no-print" onclick="closeModal()">بستن</button>
     <button class="btn btn-primary no-print" onclick="window.print()">🖨 چاپ</button>`,'lg');

  openModal(
    type==='receive'?'ثبت دریافت وجه':type==='pay'?'ثبت پرداخت وجه':'انتقال بین اشخاص',
    `
    <div class="form-group"><label class="form-label">تاریخ</label><input class="form-control" id="txDate" value="${todayJalali()}" dir="ltr"></div>
    ${isTransfer? `
      <div class="form-group"><label class="form-label">از شخص (پرداخت‌کننده) *</label>
        <select class="form-control" id="txFrom">
          <option value="">انتخاب</option>
          ${DB.data.persons.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">به شخص (دریافت‌کننده) *</label>
        <select class="form-control" id="txTo">
          <option value="">انتخاب</option>
          ${DB.data.persons.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
        </select></div>
    `:`
      <div class="form-group"><label class="form-label">شخص *</label>
        <select class="form-control" id="txPerson">
          <option value="">انتخاب</option>
          ${DB.data.persons.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
        </select></div>
    `}
    <div class="form-group"><label class="form-label">مبلغ *</label><input class="form-control" data-thousands id="txAmount" value="0"></div>
    <div class="form-group"><label class="form-label">توضیحات</label><input class="form-control" id="txNote"></div>
    `,
    `<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
     <button class="btn btn-primary" onclick="saveTx('${type}')">ذخیره</button>`
  );
}
function saveTx(type){
  const date = $('#txDate').value.trim();
  if(!validJalali(date)){toast('تاریخ معتبر نیست','error');return;}
  const amount = parseNum($('#txAmount').value);
  if(amount<=0){toast('مبلغ را وارد کنید','error');return;}
  const note = $('#txNote').value.trim();
  const obj = {id:uid(),date,type,amount,note};
  if(type==='transfer'){
    const from = $('#txFrom').value;
    const to = $('#txTo').value;
    if(!from||!to){toast('هر دو شخص را انتخاب کنید','error');return;}
    if(from===to){toast('اشخاص باید متفاوت باشند','error');return;}
    obj.personId = from; obj.toPersonId = to;
  } else {
    const person = $('#txPerson').value;
    if(!person){toast('شخص را انتخاب کنید','error');return;}
    obj.personId = person;
  }
  DB.data.transactions.push(obj);
  DB.save(); closeModal(); renderTransactions(); toast('تراکنش ذخیره شد','success');
}
function deleteTx(id){
  confirmAction('حذف این تراکنش؟',()=>{
    DB.data.transactions = DB.data.transactions.filter(t=>t.id!==id);
    DB.save(); renderTransactions(); toast('حذف شد','success');
  });
}

/* =========================================================
   بخش ۱۱: سرمایه و سود
   ========================================================= */
function renderCapital(){
  const t = totals();
  const initial = DB.data.settings.initialCapital||0;
  const stockVal = stockValue();
  const finalCapital = initial + t.profit + t.receivable - t.payable;
  const totalAssets = t.cash + stockVal + t.receivable;

  $('#content').innerHTML = `
    <div class="grid grid-3 mb-4">
      <div class="stat"><div class="stat-label">سرمایه اولیه</div><div class="stat-value">${formatMoney(initial)}</div><div class="stat-icon">🏁</div></div>
      <div class="stat s-success"><div class="stat-label">سود حاصل‌شده</div><div class="stat-value positive">${formatMoney(t.profit)}</div><div class="stat-icon">📈</div></div>
      <div class="stat s-info"><div class="stat-label">سرمایه فعلی (تخمینی)</div><div class="stat-value">${formatMoney(finalCapital)}</div><div class="stat-icon">💰</div></div>
    </div>

    <div class="card mb-4">
      <div class="card-header"><div class="card-title">ترازنامه ساده</div></div>
      <div class="grid grid-2">
        <div>
          <div class="font-bold mb-3 text-success">دارایی‌ها</div>
          <table style="font-size:13px">
            <tr><td>موجودی نقدی</td><td class="num">${formatMoney(t.cash)}</td></tr>
            <tr><td>ارزش انبار (به بهای خرید)</td><td class="num">${formatMoney(stockVal)}</td></tr>
            <tr><td>مطالبات از اشخاص</td><td class="num">${formatMoney(t.receivable)}</td></tr>
            <tr style="border-top:2px solid var(--gray-200);font-weight:700"><td>جمع دارایی</td><td class="num">${formatMoney(totalAssets)}</td></tr>
          </table>
        </div>
        <div>
          <div class="font-bold mb-3 text-danger">بدهی‌ها و سرمایه</div>
          <table style="font-size:13px">
            <tr><td>بدهی به اشخاص</td><td class="num">${formatMoney(t.payable)}</td></tr>
            <tr><td>سرمایه اولیه</td><td class="num">${formatMoney(initial)}</td></tr>
            <tr><td>سود انباشته</td><td class="num">${formatMoney(t.profit)}</td></tr>
            <tr style="border-top:2px solid var(--gray-200);font-weight:700"><td>جمع بدهی و سرمایه</td><td class="num">${formatMoney(t.payable + initial + t.profit)}</td></tr>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">تنظیم سرمایه اولیه</div></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">سرمایه اولیه</label>
          <input class="form-control" data-thousands id="capVal" value="${formatNum(initial)}"></div>
        <div class="form-group"><label class="form-label">تاریخ شروع</label>
          <input class="form-control" id="capDate" value="${DB.data.settings.initialCapitalDate||todayJalali()}" dir="ltr"></div>
      </div>
      <button class="btn btn-primary" onclick="saveCapital()">💾 ذخیره سرمایه اولیه</button>
    </div>
  `;
  setTimeout(()=>attachAllThousandsIn($('#content')),10);
}
function saveCapital(){
  const v = parseNum($('#capVal').value);
  const d = $('#capDate').value.trim();
  DB.data.settings.initialCapital = v;
  DB.data.settings.initialCapitalDate = d;
  DB.save(); toast('سرمایه اولیه ذخیره شد','success'); renderCapital();
}

/* =========================================================
   بخش ۱۲: گزارش‌ها
   ========================================================= */
function renderReports(){
  const t = totals();
  const months = lastSixMonths();
  const monthSales = months.map(m=>{let s=0;for(const i of DB.data.invoices){if(i.type==='sale'&&jalaliMonth(i.date)===m)s+=i.total;}return s;});
  const monthPurchases = months.map(m=>{let s=0;for(const i of DB.data.invoices){if(i.type==='purchase'&&jalaliMonth(i.date)===m)s+=i.total;}return s;});

  const lowStock = DB.data.products.filter(p=>stockOf(p.id)<=p.minStock);

  $('#content').innerHTML = `
    <div class="grid grid-4 mb-4">
      <div class="stat s-success"><div class="stat-label">کل فروش</div><div class="stat-value">${formatMoney(t.sales)}</div></div>
      <div class="stat s-danger"><div class="stat-label">کل خرید</div><div class="stat-value">${formatMoney(t.purchases)}</div></div>
      <div class="stat s-info"><div class="stat-label">سود ناخالص</div><div class="stat-value">${formatMoney(t.profit)}</div></div>
      <div class="stat"><div class="stat-label">ارزش انبار</div><div class="stat-value">${formatMoney(stockValue())}</div></div>
    </div>

    <div class="grid grid-2 mb-4">
      <div class="card">
        <div class="card-header"><div class="card-title">فروش و خرید ماهانه</div></div>
        <canvas id="rChart1" height="220"></canvas>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">کالاهای کم‌موجود</div></div>
        ${lowStock.length? `<div class="table-wrap"><table><thead><tr><th>کالا</th><th>موجودی</th><th>حداقل</th></tr></thead><tbody>
          ${lowStock.map(p=>`<tr><td>${p.name}</td><td class="num text-danger">${formatNum(stockOf(p.id))}</td><td class="num">${formatNum(p.minStock)}</td></tr>`).join('')}
        </tbody></table></div>`:'<div class="empty"><div class="icon">✓</div><div class="title">همه کالاها موجودی کافی دارند</div></div>'}
      </div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">گزارش موجودی کالاها</div></div>
      <div class="table-wrap"><table><thead><tr>
        <th>کالا</th><th>قیمت خرید</th><th>موجودی کل</th><th>ارزش موجودی</th>
      </tr></thead><tbody>
        ${DB.data.products.length? DB.data.products.map(p=>{
          const q = stockOf(p.id);
          return `<tr><td>${p.name}</td>
            <td class="num">${formatNum(p.purchasePrice)}</td>
            <td class="num ${q<=p.minStock?'text-danger':''}">${formatNum(q)}</td>
            <td class="num">${formatNum(q*(p.purchasePrice||0))}</td></tr>`;
        }).join('') : '<tr><td colspan="4" class="text-center text-muted">کالایی نیست</td></tr>'}
      </tbody></table></div>
    </div>
  `;
  setTimeout(()=>{
    new Chart($('#rChart1'),{
      type:'line',
      data:{
        labels:months.map(m=>monthName(m)),
        datasets:[
          {label:'فروش',data:monthSales,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.1)',tension:.3,fill:true},
          {label:'خرید',data:monthPurchases,borderColor:'#ef4444',backgroundColor:'rgba(239,68,68,.1)',tension:.3,fill:true}
        ]
      },
      options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{family:'Vazirmatn'}}}},
        scales:{y:{ticks:{font:{family:'Vazirmatn'},callback:v=>formatNum(v)}},x:{ticks:{font:{family:'Vazirmatn'}}}}}
    });
  },10);
}

/* =========================================================
   بخش ۱۳: تنظیمات
   ========================================================= */
function renderSettings(){
  const s = DB.data.settings;
  $('#content').innerHTML = `
    <div class="grid grid-2">
      <div class="card">
        <div class="card-header"><div class="card-title">تنظیمات عمومی</div></div>
        <div class="form-group"><label class="form-label">نام فروشگاه</label>
          <input class="form-control" id="setShop" value="${s.shopName}"></div>
        <div class="form-group"><label class="form-label">واحد پول</label>
          <select class="form-control" id="setCurrency">
            <option value="تومان" ${s.currency==='تومان'?'selected':''}>تومان</option>
            <option value="ریال" ${s.currency==='ریال'?'selected':''}>ریال</option>
          </select></div>
        <div class="form-group"><label class="form-label">درصد مالیات پیش‌فرض</label>
          <input class="form-control" id="setTax" type="number" value="${s.taxPercent||0}"></div>
        <button class="btn btn-primary" onclick="saveSettings()">💾 ذخیره تنظیمات</button>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">پشتیبان‌گیری</div></div>
        <p class="text-muted mb-3">اطلاعات را در فایل JSON ذخیره یا بازیابی کنید.</p>
        <div class="flex gap-2" style="flex-wrap:wrap">
          <button class="btn btn-primary" onclick="exportData()">📤 دریافت فایل پشتیبان</button>
          <label class="btn btn-success" style="cursor:pointer">
            📥 بازیابی از فایل
            <input type="file" accept=".json" onchange="importData(event)" style="display:none">
          </label>
        </div>
        <div class="divider"></div>
        <div class="card-header"><div class="card-title text-danger">منطقه خطر</div></div>
        <div class="flex gap-2" style="flex-wrap:wrap">
          <button class="btn btn-warning" onclick="resetAccountingData()">🧹 حذف اطلاعات حسابداری</button>
          <button class="btn btn-danger" onclick="resetAllData()">🗑 حذف کل اطلاعات</button>
        </div>
        <p class="text-muted mt-3" style="font-size:11px">
          - «حذف اطلاعات حسابداری» فقط فاکتورها، تراکنش‌ها و گردش انبار را پاک می‌کند.<br>
          - «حذف کل اطلاعات» همه چیز را پاک می‌کند.
        </p>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header"><div class="card-title">اطلاعات سیستم</div></div>
      <div class="grid grid-4">
        <div class="stat"><div class="stat-label">اشخاص</div><div class="stat-value">${formatNum(DB.data.persons.length)}</div></div>
        <div class="stat"><div class="stat-label">کالاها</div><div class="stat-value">${formatNum(DB.data.products.length)}</div></div>
        <div class="stat"><div class="stat-label">انبارها</div><div class="stat-value">${formatNum(DB.data.warehouses.length)}</div></div>
        <div class="stat"><div class="stat-label">فاکتورها</div><div class="stat-value">${formatNum(DB.data.invoices.length)}</div></div>
      </div>
    </div>
  `;
}
function saveSettings(){
  DB.data.settings.shopName = $('#setShop').value.trim()||'فروشگاه من';
  DB.data.settings.currency = $('#setCurrency').value;
  DB.data.settings.taxPercent = Number($('#setTax').value)||0;
  DB.save();
  $('#sidebarShopName').textContent = DB.data.settings.shopName;
  toast('تنظیمات ذخیره شد','success');
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB.data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('فایل پشتیبان دانلود شد','success');
}
function importData(e){
  const file = e.target.files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      confirmAction('اطلاعات فعلی جایگزین شود؟',()=>{
        DB.data = {...DB.data,...parsed};
        DB.save();
        $('#sidebarShopName').textContent = DB.data.settings.shopName;
        toast('بازیابی انجام شد','success');
        navigate('dashboard');
      });
    }catch(err){toast('فایل معتبر نیست','error');}
  };
  reader.readAsText(file);
  e.target.value='';
}
function resetAccountingData(){
  confirmAction('همه فاکتورها، تراکنش‌ها و گردش انبار پاک شوند؟ (اشخاص، کالاها و انبارها حفظ می‌شوند)',()=>{
    DB.resetAccounting();
    toast('اطلاعات حسابداری پاک شد','success');
    navigate('dashboard');
  });
}
function resetAllData(){
  confirmAction('⚠️ کل اطلاعات (فاکتورها، اشخاص، کالاها، انبارها) حذف شود؟ این عملیات برگشت‌پذیر نیست.',()=>{
    DB.resetAll();
    toast('همه اطلاعات پاک شد','success');
    navigate('dashboard');
  });
}

/* =========================================================
   شروع
   ========================================================= */
navigate('dashboard');
</script>
</body>
</html>
