<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>سیستم حسابداری و انبارداری</title>

<!-- فونت ایران سنس (IRANSans) -->
<link href="https://cdn.jsdelivr.net/gh/font-store/font-IRANSans/IRANSansWeb.css" rel="stylesheet">

<!-- کتابخانه‌ها -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.6/dist/jalaali.min.js"></script>

<style>
/* =====================================================
   🌙 تم دارک لوکس - فونت ایران سنس
   ===================================================== */
:root{
  --bg-main:#0f1419;
  --bg-card:#1a2332;
  --bg-card-2:#1e2a3a;
  --bg-input:#0a0e14;
  --bg-hover:#243043;
  
  --border-soft:rgba(255,255,255,.06);
  --border-medium:rgba(255,255,255,.1);
  --border-strong:rgba(255,255,255,.15);
  
  --text-main:#ffffff;
  --text-sub:#8b95a5;
  --text-muted:#5a6474;
  
  --accent:#e63946;
  --accent-hover:#dc2f3c;
  --accent-glow:rgba(230,57,70,.35);
  
  --success:#10b981;
  --success-hover:#059669;
  --success-glow:rgba(16,185,129,.3);
  
  --danger:#ef4444;
  --danger-hover:#dc2626;
  
  --warning:#f59e0b;
  --warning-hover:#d97706;
  
  --info:#3b82f6;
  --info-hover:#2563eb;
  
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:18px;
  
  --shadow-card:0 4px 20px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-card-hover:0 8px 30px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.05) inset;
  --shadow-btn:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'IRANSans', 'IRANSansWeb', Tahoma, sans-serif;
  font-weight:500;
  letter-spacing:-.01em;
  background:var(--bg-main);
  color:var(--text-main);
  font-size:14px;
  line-height:1.7;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh}

/* ==================== SIDEBAR ==================== */
.sidebar{
  width:270px;
  background:linear-gradient(180deg,#141b26 0%,#0f1419 100%);
  border-left:1px solid var(--border-soft);
  padding:24px 0;
  position:fixed;
  top:0;right:0;bottom:0;
  overflow-y:auto;
  z-index:50;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:-4px 0 20px rgba(0,0,0,.3);
}
.sidebar .brand{
  display:flex;align-items:center;gap:12px;
  padding:0 20px 22px;
  border-bottom:1px solid var(--border-soft);
  margin-bottom:18px;
}
.sidebar .brand-icon{
  width:52px;height:52px;
  background:#fff;
  border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  border:1px solid var(--border-medium);
  box-shadow:0 4px 15px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.05);
  transition:transform .3s;
  flex-shrink:0;
}
.sidebar .brand-icon img{width:100%;height:100%;object-fit:cover}
.sidebar .brand:hover .brand-icon{transform:scale(1.05)}
.sidebar .brand-text{
  font-weight:800;font-size:15px;color:var(--text-main);
  letter-spacing:-.3px;
}
.sidebar .brand-sub{
  font-size:11px;color:var(--text-sub);
  font-weight:500;letter-spacing:.5px;
  margin-top:2px;
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;margin:2px 10px;
  color:var(--text-sub);
  cursor:pointer;font-weight:600;font-size:13.5px;
  border-radius:10px;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  user-select:none;
  position:relative;
}
.nav-item:hover{
  background:var(--bg-hover);
  color:var(--text-main);
}
.nav-item.active{
  background:var(--accent);
  color:#fff;
  box-shadow:0 4px 15px var(--accent-glow);
}
.nav-item.active .icon{transform:scale(1.1)}
.nav-item .icon{
  font-size:18px;width:22px;text-align:center;
  display:inline-block;transition:transform .2s;
  filter:grayscale(.3) brightness(1.2);
}
.nav-item.active .icon{filter:none}

/* ==================== MAIN ==================== */
.main{
  margin-right:270px;
  flex:1;
  padding:24px 28px 120px;
  min-height:100vh;
  position:relative;
}

/* ==================== TOPBAR ==================== */
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:24px;flex-wrap:wrap;gap:12px;
  background:var(--bg-card);
  padding:16px 22px;
  border-radius:var(--radius);
  border:1px solid var(--border-soft);
  box-shadow:var(--shadow-card);
}
.page-title{
  font-size:22px;font-weight:800;
  color:var(--text-main);
  letter-spacing:-.5px;
}
.menu-toggle{
  display:none;
  background:var(--bg-card-2);
  border:1px solid var(--border-medium);
  border-radius:10px;
  padding:10px 14px;cursor:pointer;
  color:var(--text-main);font-size:18px;
  transition:all .15s;
}
.menu-toggle:active{transform:scale(.95)}

/* ==================== CARDS ==================== */
.card{
  background:var(--bg-card);
  border-radius:var(--radius);
  padding:22px;
  border:1px solid var(--border-soft);
  box-shadow:var(--shadow-card);
  transition:all .3s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.card:hover{
  border-color:var(--border-medium);
  box-shadow:var(--shadow-card-hover);
}
.card-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;flex-wrap:wrap;gap:8px;
  padding-bottom:14px;
  border-bottom:1px solid var(--border-soft);
}
.card-title{
  font-size:15px;font-weight:800;
  color:var(--text-main);
  letter-spacing:-.3px;
  display:flex;align-items:center;gap:8px;
}

/* ==================== GRID ==================== */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ==================== STAT CARDS ==================== */
.stat{
  padding:20px;
  border-radius:var(--radius);
  background:linear-gradient(145deg,var(--bg-card-2) 0%,var(--bg-card) 100%);
  border:1px solid var(--border-soft);
  box-shadow:var(--shadow-card);
  position:relative;overflow:hidden;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  cursor:pointer;
}
.stat:hover{
  transform:translateY(-3px);
  border-color:var(--border-medium);
  box-shadow:var(--shadow-card-hover);
}
.stat::before{
  content:'';
  position:absolute;
  top:0;right:0;width:4px;height:100%;
  background:var(--accent);
  border-radius:0 4px 4px 0;
}
.stat.s-success::before{background:var(--success)}
.stat.s-danger::before{background:var(--danger)}
.stat.s-warning::before{background:var(--warning)}
.stat.s-info::before{background:var(--info)}
.stat-label{
  font-size:12.5px;color:var(--text-sub);
  margin-bottom:8px;font-weight:600;
  position:relative;z-index:1;
}
.stat-value{
  font-size:22px;font-weight:800;
  color:var(--text-main);
  letter-spacing:-.5px;
  position:relative;z-index:1;
  font-variant-numeric:tabular-nums;
}
.stat-value.positive{color:var(--success)}
.stat-value.negative{color:var(--danger)}
.stat-icon{
  position:absolute;left:16px;top:50%;
  transform:translateY(-50%);
  font-size:36px;opacity:.08;
  pointer-events:none;
  filter:grayscale(1);
}

/* ==================== BUTTONS ==================== */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;border-radius:var(--radius-sm);
  border:none;font-family:inherit;
  font-size:13px;font-weight:700;
  cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);
  white-space:nowrap;position:relative;
  letter-spacing:.2px;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:var(--accent);
  color:#fff;
  box-shadow:0 2px 8px var(--accent-glow);
}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 14px var(--accent-glow)}
.btn-success{
  background:var(--success);
  color:#fff;
  box-shadow:0 2px 8px var(--success-glow);
}
.btn-success:hover{background:var(--success-hover);box-shadow:0 4px 14px var(--success-glow)}
.btn-danger{
  background:var(--danger);
  color:#fff;
  box-shadow:0 2px 8px rgba(239,68,68,.3);
}
.btn-danger:hover{background:var(--danger-hover);box-shadow:0 4px 14px rgba(239,68,68,.4)}
.btn-warning{
  background:var(--warning);
  color:#fff;
  box-shadow:0 2px 8px rgba(245,158,11,.3);
}
.btn-warning:hover{background:var(--warning-hover);box-shadow:0 4px 14px rgba(245,158,11,.4)}
.btn-ghost{
  background:var(--bg-card-2);
  color:var(--text-main);
  border:1px solid var(--border-medium);
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.btn-ghost:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.btn-sm{padding:7px 13px;font-size:12px}
.btn-icon{padding:10px;width:38px;height:38px;justify-content:center}

/* ==================== QUICK TX ==================== */
.quick-tx{
  width:36px;height:36px;padding:0;
  border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;
  border:none;cursor:pointer;font-size:15px;font-weight:800;
  transition:all .15s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.quick-tx:active{transform:scale(.92)}
.quick-tx-in{
  background:var(--success);
  color:#fff;
  box-shadow:0 2px 8px var(--success-glow);
}
.quick-tx-in:hover{background:var(--success-hover);box-shadow:0 4px 12px var(--success-glow)}
.quick-tx-out{
  background:var(--danger);
  color:#fff;
  box-shadow:0 2px 8px rgba(239,68,68,.3);
}
.quick-tx-out:hover{background:var(--danger-hover);box-shadow:0 4px 12px rgba(239,68,68,.4)}
.quick-tx svg{width:17px;height:17px;stroke-width:3}

/* ==================== FORMS ==================== */
.form-group{margin-bottom:16px}
.form-label{
  display:block;font-size:12.5px;font-weight:700;
  color:var(--text-sub);margin-bottom:8px;
  letter-spacing:.2px;
}
.form-control{
  width:100%;padding:12px 14px;
  border:1px solid var(--border-medium);
  border-radius:var(--radius-sm);
  font-family:inherit;font-size:13.5px;
  background:var(--bg-input);
  transition:all .2s cubic-bezier(.4,0,.2,1);
  color:var(--text-main);
  font-weight:500;
}
.form-control:hover{border-color:var(--border-strong);background:#0c1118}
.form-control:focus{
  outline:none;
  border-color:var(--accent);
  background:#0c1118;
  box-shadow:0 0 0 3px var(--accent-glow);
}
.form-control::placeholder{color:var(--text-muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
input[type=number]{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
select.form-control{
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b95a5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat:no-repeat;
  background-position:left 12px center;
  background-size:16px;
  padding-left:38px;
  appearance:none;
  -webkit-appearance:none;
}
select.form-control option{background:var(--bg-card);color:var(--text-main)}

/* ==================== TABLES ==================== */
.table-wrap{
  overflow-x:auto;
  border-radius:var(--radius);
  border:1px solid var(--border-soft);
  background:var(--bg-input);
}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:transparent}
th{
  background:var(--bg-card-2);
  padding:13px 15px;text-align:right;
  font-weight:700;color:var(--text-sub);
  font-size:12px;
  border-bottom:1px solid var(--border-medium);
  white-space:nowrap;
  letter-spacing:.3px;
}
td{padding:13px 15px;border-bottom:1px solid var(--border-soft);color:var(--text-main)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--bg-hover)}
.num{
  direction:ltr;text-align:right;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  font-family:'IRANSans', sans-serif;
}

/* ==================== BADGES ==================== */
.badge{
  display:inline-flex;align-items:center;
  padding:4px 11px;border-radius:20px;
  font-size:11px;font-weight:700;
  letter-spacing:.2px;
  border:1px solid transparent;
}
.badge-success{
  background:rgba(16,185,129,.15);
  color:#34d399;
  border-color:rgba(16,185,129,.3);
}
.badge-danger{
  background:rgba(239,68,68,.15);
  color:#f87171;
  border-color:rgba(239,68,68,.3);
}
.badge-warning{
  background:rgba(245,158,11,.15);
  color:#fbbf24;
  border-color:rgba(245,158,11,.3);
}
.badge-info{
  background:rgba(59,130,246,.15);
  color:#60a5fa;
  border-color:rgba(59,130,246,.3);
}
.badge-gray{
  background:rgba(139,149,165,.15);
  color:var(--text-sub);
  border-color:rgba(139,149,165,.25);
}

/* ==================== MODAL ==================== */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  display:none;
  align-items:center;justify-content:center;
  padding:20px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--bg-card);
  border-radius:var(--radius-lg);
  width:100%;max-width:620px;
  max-height:90vh;overflow-y:auto;
  box-shadow:0 25px 60px rgba(0,0,0,.6),0 0 0 1px var(--border-medium);
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
  border:1px solid var(--border-medium);
}
.modal.modal-lg{max-width:980px}
@keyframes slideUp{
  from{opacity:0;transform:translateY(30px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.modal-header{
  padding:20px 24px;
  border-bottom:1px solid var(--border-soft);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:1;
  background:var(--bg-card);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
}
.modal-title{
  font-size:17px;font-weight:800;
  color:var(--text-main);
}
.modal-close{
  background:var(--bg-card-2);
  border:1px solid var(--border-medium);
  font-size:20px;cursor:pointer;
  color:var(--text-sub);
  width:36px;height:36px;border-radius:10px;
  transition:all .15s;
  display:flex;align-items:center;justify-content:center;
  font-weight:300;
  line-height:1;
}
.modal-close:hover{
  background:rgba(239,68,68,.15);
  color:var(--danger);
  border-color:rgba(239,68,68,.4);
}
.modal-body{padding:24px}
.modal-footer{
  padding:16px 24px;
  border-top:1px solid var(--border-soft);
  display:flex;gap:10px;justify-content:flex-end;
  position:sticky;bottom:0;
  background:var(--bg-card);
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  flex-wrap:wrap;
}

/* ==================== EMPTY ==================== */
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty .icon{font-size:48px;margin-bottom:14px;opacity:.4}
.empty .title{font-weight:700;color:var(--text-sub);margin-bottom:6px;font-size:15px}
.empty .sub{font-size:12px;color:var(--text-muted)}

/* ==================== TOAST ==================== */
.toast{
  position:fixed;bottom:28px;left:28px;
  background:var(--bg-card-2);
  color:var(--text-main);
  padding:14px 22px;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.5),0 0 0 1px var(--border-medium);
  z-index:200;font-size:13.5px;font-weight:700;
  opacity:0;
  transform:translateY(20px) scale(.92);
  transition:.3s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  border:1px solid var(--border-medium);
}
.toast.show{opacity:1;transform:translateY(0) scale(1)}
.toast.success{
  background:rgba(16,185,129,.15);
  color:#34d399;
  border-color:rgba(16,185,129,.4);
}
.toast.error{
  background:rgba(239,68,68,.15);
  color:#f87171;
  border-color:rgba(239,68,68,.4);
}
.toast.warning{
  background:rgba(245,158,11,.15);
  color:#fbbf24;
  border-color:rgba(245,158,11,.4);
}

/* ==================== MISC ==================== */
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:14px}.gap-4{gap:18px}
.mb-3{margin-bottom:14px}.mb-4{margin-bottom:20px}.mt-3{margin-top:14px}.mt-4{margin-top:20px}
.text-center{text-align:center}
.text-muted{color:var(--text-sub);font-size:12.5px}
.text-success{color:#34d399}
.text-danger{color:#f87171}
.text-warning{color:#fbbf24}
.font-bold{font-weight:800}
.divider{height:1px;background:var(--border-soft);margin:20px 0}
.hidden{display:none!important}

/* ==================== FILTER TABS ==================== */
.filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-tab{
  padding:9px 18px;
  border-radius:10px;
  background:var(--bg-card-2);
  color:var(--text-sub);
  font-size:12.5px;font-weight:700;
  cursor:pointer;
  border:1px solid var(--border-medium);
  font-family:inherit;
  transition:all .2s cubic-bezier(.4,0,.2,1);
}
.filter-tab:hover{
  background:var(--bg-hover);
  color:var(--text-main);
  border-color:var(--border-strong);
}
.filter-tab.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  box-shadow:0 4px 15px var(--accent-glow);
}

/* ==================== SEARCH BOX ==================== */
.search-box{position:relative;flex:1;max-width:340px}
.search-box input{padding-right:42px}
.search-box::before{
  content:'🔍';
  position:absolute;right:15px;top:50%;
  transform:translateY(-50%);
  font-size:14px;opacity:.5;
  pointer-events:none;
}

/* ==================== FOOTER ==================== */
.footer-signature{
  position:fixed;bottom:0;left:0;right:270px;
  background:rgba(26,35,50,.95);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border-soft);
  padding:11px 24px;
  text-align:center;
  font-size:11.5px;
  color:var(--text-sub);
  z-index:40;
  box-shadow:0 -4px 20px rgba(0,0,0,.2);
}
.footer-signature .sig-line{
  display:flex;align-items:center;justify-content:center;
  gap:14px;flex-wrap:wrap;
}
.footer-signature .sig-name{
  font-weight:800;letter-spacing:.6px;
  color:var(--accent);
  font-size:12.5px;
}
.footer-signature .sig-tel{
  direction:ltr;
  font-variant-numeric:tabular-nums;
  color:var(--text-main);font-weight:700;
  padding:2px 10px;border-radius:20px;
  background:rgba(230,57,70,.15);
  font-size:11px;
  border:1px solid rgba(230,57,70,.3);
}
.footer-signature .sig-sep{opacity:.3}
@media(max-width:900px){.footer-signature{right:0}}

/* ==================== PRINT ==================== */
@media print{
  body *{visibility:hidden}

<script>
/* ============ ابزارهای عمومی ============ */
const $ = (s,el)=> (el||document).querySelector(s);
const $$ = (s,el)=> Array.prototype.slice.call((el||document).querySelectorAll(s));

function formatNum(n){
  if(n===null||n===undefined||n==='')return '0';
  const num = Math.round(Number(n)||0);
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function parseNum(s){
  if(typeof s==='number')return s;
  if(!s)return 0;
  const cleaned = String(s).replace(/[,\u066B\u066C\s]/g,'');
  return Number(cleaned)||0;
}
function formatMoney(n){
  const cur = DB.data.settings.currency || 'تومان';
  return formatNum(n)+' '+cur;
}
function attachThousands(input){
  if(input._thousandsAttached)return;
  input._thousandsAttached = true;
  input.addEventListener('input',function(){
    const raw = input.value.replace(/[^\d-]/g,'');
    if(raw==='' || raw==='-'){input.value=raw;return;}
    input.value = formatNum(raw);
  });
}
function todayJalali(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return j.jy+'/'+String(j.jm).padStart(2,'0')+'/'+String(j.jd).padStart(2,'0');
}
function nowJalaliFull(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  return j.jy+'/'+String(j.jm).padStart(2,'0')+'/'+String(j.jd).padStart(2,'0')+' - '+String(g.getHours()).padStart(2,'0')+':'+String(g.getMinutes()).padStart(2,'0');
}
function jalaliMonth(jstr){
  if(!jstr)return '';
  return jstr.split('/').slice(0,2).join('/');
}
function validJalali(s){
  if(!s)return false;
  const p = s.split('/').map(Number);
  if(p.length!==3)return false;
  try{return jalaali.isValidJalaaliDate(p[0],p[1],p[2]);}catch(e){return false;}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function toast(msg,type){
  type = type || '';
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show '+type;
  clearTimeout(t._t);
  t._t = setTimeout(function(){t.classList.remove('show');},2500);
}
function openModal(title,body,footer,size){
  size = size || '';
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalFooter').innerHTML = footer || '';
  $('#modalBox').className = 'modal '+(size==='lg'?'modal-lg':'');
  $('#modalOverlay').classList.add('show');
  attachAllThousandsIn($('#modalBody'));
  attachAllThousandsIn($('#modalFooter'));
}
function closeModal(){
  $('#modalOverlay').classList.remove('show');
  $('#modalBody').innerHTML='';
  $('#modalFooter').innerHTML='';
}
function attachAllThousandsIn(container){
  $$('input[data-thousands]',container).forEach(attachThousands);
}
function confirmAction(msg,onYes){
  openModal('تأیید عملیات',
    '<p style="font-size:14px;line-height:1.9;color:var(--text-main)">'+msg+'</p>',
    '<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>'+
    '<button class="btn btn-danger" id="confirmYes">بله، انجام بده</button>'
  );
  $('#confirmYes').onclick = function(){closeModal();onYes();};
}

/* ============ دیتابیس ============ */
const DB_KEY = 'hesabdar_v2';
const DB = {
  data: {
    settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
    warehouses:[],products:[],persons:[],invoices:[],transactions:[],stockMoves:[]
  },
  load:function(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        this.data = Object.assign({}, this.data, parsed);
        this.data.settings = Object.assign({shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0}, this.data.settings);
        this.data.invoices.forEach(function(inv){
          if(inv.shippingCost===undefined)inv.shippingCost=0;
          if(inv.customsCost===undefined)inv.customsCost=0;
          if(inv.paidAmount===undefined)inv.paidAmount = inv.paid? inv.total : 0;
        });
      }
    }catch(e){console.error(e);}
  },
  save:function(){
    try{localStorage.setItem(DB_KEY,JSON.stringify(this.data));}
    catch(e){toast('خطا در ذخیره اطلاعات','error');}
  },
  resetAll:function(){
    this.data = {
      settings:{shopName:'فروشگاه من',currency:'تومان',initialCapital:0,initialCapitalDate:'',taxPercent:0},
      warehouses:[],products:[],persons:[],invoices:[],transactions:[],stockMoves:[]
    };
    this.save();
  },
  resetAccounting:function(){
    this.data.invoices = [];
    this.data.transactions = [];
    this.data.stockMoves = [];
    this.save();
  }
};
DB.load();

/* ============ محاسبات ============ */
function stockOf(productId,warehouseId,excludeInvoiceId){
  let total = 0;
  for(const m of DB.data.stockMoves){
    if(m.productId!==productId)continue;
    if(warehouseId && m.warehouseId!==warehouseId)continue;
    if(excludeInvoiceId && m.refId===excludeInvoiceId)continue;
    total += (m.type==='in'? m.qty : -m.qty);
  }
  return total;
}
function avgCostOf(productId, excludeInvoiceId){
  const ins = DB.data.stockMoves
    .filter(function(m){return m.productId===productId && m.type==='in' && m.refId!==excludeInvoiceId;})
    .map(function(m){
      const inv = DB.data.invoices.find(function(i){return i.id===m.refId;});
      return {qty:m.qty, inv:inv, date:m.date};
    })
    .sort(function(a,b){return a.date.localeCompare(b.date);});
  const product = DB.data.products.find(function(p){return p.id===productId;});
  let basePrice = product ? (product.purchasePrice || 0) : 0;
  let totalQty = 0;
  let totalValue = 0;
  for(const x of ins){
    if(!x.inv)continue;
    const item = x.inv.items.find(function(it){return it.productId===productId;});
    if(!item)continue;
    const itemSubtotal = item.qty * item.price;
    const invoiceItemsSum = x.inv.items.reduce(function(s,it){return s+it.qty*it.price;},0);
    const ratio = invoiceItemsSum>0 ? itemSubtotal/invoiceItemsSum : 0;
    const shippingShare = (x.inv.shippingCost||0) * ratio;
    const customsShare = (x.inv.customsCost||0) * ratio;
    const itemCost = itemSubtotal + shippingShare + customsShare;
    totalQty += item.qty;
    totalValue += itemCost;
  }
  if(totalQty<=0) return basePrice;
  return totalValue/totalQty;
}
function personBalance(personId){
  let bal = 0;
  for(const inv of DB.data.invoices){
    if(inv.personId!==personId)continue;
    const remaining = inv.total - (inv.paidAmount||0);
    if(remaining<=0)continue;
    if(inv.type==='sale') bal -= remaining;
    if(inv.type==='purchase') bal += remaining;
  }
  for(const t of DB.data.transactions){
    if(t.type==='receive' && t.personId===personId) bal += t.amount;
    if(t.type==='pay' && t.personId===personId) bal -= t.amount;
    if(t.type==='transfer'){
      if(t.personId===personId) bal += t.amount;
      if(t.toPersonId===personId) bal -= t.amount;
    }
  }
  return bal;
}
function personBalanceLabel(bal){
  if(Math.abs(bal)<1) return {text:'تسویه',cls:'badge-gray'};
  if(bal>0) return {text:'بستانکار',cls:'badge-success'};
  return {text:'بدهکار',cls:'badge-danger'};
}
function stockValue(){
  let v=0;
  for(const p of DB.data.products){
    const q = stockOf(p.id);
    if(q>0) v += q * avgCostOf(p.id);
  }
  return v;
}
function totals(){
  let sales=0,purchases=0;
  for(const inv of DB.data.invoices){
    if(inv.type==='sale') sales += inv.total;
    if(inv.type==='purchase') purchases += inv.total;
  }
  let cogs = 0;
  for(const inv of DB.data.invoices){
    if(inv.type!=='sale')continue;
    for(const it of inv.items){
      cogs += avgCostOf(it.productId) * it.qty;
    }
  }
  const profit = sales - cogs;
  let receivable=0,payable=0;
  for(const p of DB.data.persons){
    const b = personBalance(p.id);
    if(b<0) receivable += -b;
    if(b>0) payable += b;
  }
  let cash = DB.data.settings.initialCapital||0;
  for(const inv of DB.data.invoices){
    if(inv.type==='sale') cash += (inv.paidAmount||0);
    if(inv.type==='purchase') cash -= (inv.paidAmount||0);
  }
  for(const t of DB.data.transactions){
    if(t.type==='receive') cash += t.amount;
    if(t.type==='pay') cash -= t.amount;
  }
  return {sales:sales,purchases:purchases,cogs:cogs,profit:profit,receivable:receivable,payable:payable,cash:cash};
}
function currentCapital(){
  const t = totals();
  const stockVal = stockValue();
  return t.cash + stockVal + t.receivable - t.payable;
}

/* ============ ناوبری ============ */
const pages = {
  dashboard: renderDashboard, invoices: renderInvoices, products: renderProducts,
  warehouses: renderWarehouses, persons: renderPersons, transactions: renderTransactions,
  capital: renderCapital, reports: renderReports, settings: renderSettings
};
const pageTitles = {
  dashboard:'داشبورد',invoices:'فاکتورها',products:'کالاها',warehouses:'انبارها',
  persons:'اشخاص',transactions:'تراکنش‌ها',capital:'سرمایه و سود',reports:'گزارش‌ها',settings:'تنظیمات'
};
function navigate(page){
  $$('.nav-item').forEach(function(n){n.classList.toggle('active',n.dataset.page===page);});
  $('#pageTitle').textContent = pageTitles[page];
  $('#sidebar').classList.remove('open');
  pages[page]();
}
$$('.nav-item').forEach(function(n){n.onclick=function(){navigate(n.dataset.page);};});
$('#todayDate').textContent = todayJalali();
$('#sidebarShopName').textContent = DB.data.settings.shopName || 'فروشگاه من';

/* ============ داشبورد ============ */
let dashChart=null, dashChart2=null;
const chartTheme = {
  color:'#8b95a5',
  grid:'rgba(255,255,255,.06)',
  font:{family:'IRANSans, sans-serif', weight:'600'}
};
function renderDashboard(){
  const t = totals();
  const totalCapital = currentCapital();
  $('#content').innerHTML =
    '<div class="grid grid-4 mb-4">'+
      '<div class="stat"><div class="stat-label">موجودی نقدی</div><div class="stat-value">'+formatMoney(t.cash)+'</div><div class="stat-icon">💵</div></div>'+
      '<div class="stat s-success"><div class="stat-label">سود حاصل‌شده</div><div class="stat-value positive">'+formatMoney(t.profit)+'</div><div class="stat-icon">📈</div></div>'+
      '<div class="stat s-danger"><div class="stat-label">مطالبات (طلب ما)</div><div class="stat-value">'+formatMoney(t.receivable)+'</div><div class="stat-icon">📥</div></div>'+
      '<div class="stat s-warning"><div class="stat-label">بدهی‌ها (بدهی ما)</div><div class="stat-value">'+formatMoney(t.payable)+'</div><div class="stat-icon">📤</div></div>'+
    '</div>'+
    '<div class="grid grid-4 mb-4">'+
      '<div class="stat s-info"><div class="stat-label">سرمایه فعلی (تخمینی)</div><div class="stat-value">'+formatMoney(totalCapital)+'</div><div class="stat-icon">💰</div></div>'+
      '<div class="stat"><div class="stat-label">ارزش انبار</div><div class="stat-value">'+formatMoney(stockValue())+'</div><div class="stat-icon">📦</div></div>'+
      '<div class="stat s-success"><div class="stat-label">تعداد فاکتور</div><div class="stat-value">'+formatNum(DB.data.invoices.length)+'</div><div class="stat-icon">🧾</div></div>'+
      '<div class="stat"><div class="stat-label">اشخاص / کالاها</div><div class="stat-value">'+formatNum(DB.data.persons.length)+' / '+formatNum(DB.data.products.length)+'</div><div class="stat-icon">👥</div></div>'+
    '</div>'+
    '<div class="grid grid-2 mb-4">'+
      '<div class="card"><div class="card-header"><div class="card-title">روند فروش و خرید (۶ ماه اخیر)</div></div><canvas id="chart1" height="200"></canvas></div>'+
      '<div class="card"><div class="card-header"><div class="card-title">ترکیب دارایی‌ها</div></div><canvas id="chart2" height="200"></canvas></div>'+
    '</div>'+
    '<div class="grid grid-2">'+
      '<div class="card"><div class="card-header"><div class="card-title">آخرین فاکتورها</div><button class="btn btn-sm btn-ghost" onclick="navigate(\'invoices\')">همه</button></div>'+renderRecentInvoices()+'</div>'+
      '<div class="card"><div class="card-header"><div class="card-title">اشخاص با بیشترین مانده</div><button class="btn btn-sm btn-ghost" onclick="navigate(\'persons\')">همه</button></div>'+renderTopPersons()+'</div>'+
    '</div>';
  const months = lastSixMonths();
  const salesData = months.map(function(m){let s=0;for(const inv of DB.data.invoices){if(inv.type==='sale'&&jalaliMonth(inv.date)===m)s+=inv.total;}return s;});
  const purchaseData = months.map(function(m){let s=0;for(const inv of DB.data.invoices){if(inv.type==='purchase'&&jalaliMonth(inv.date)===m)s+=inv.total;}return s;});
  
  if(dashChart)dashChart.destroy();
  dashChart = new Chart($('#chart1'),{
    type:'bar',data:{labels:months.map(monthName),datasets:[
      {label:'فروش',data:salesData,backgroundColor:'#10b981',borderRadius:6,borderSkipped:false},
      {label:'خرید',data:purchaseData,backgroundColor:'#e63946',borderRadius:6,borderSkipped:false}
    ]},
    options:{
      responsive:true,
      plugins:{
        legend:{position:'bottom',labels:{color:chartTheme.color,font:chartTheme.font,padding:12}}
      },
      scales:{
        y:{ticks:{color:chartTheme.color,font:chartTheme.font,callback:function(v){return formatNum(v);}},grid:{color:chartTheme.grid}},
        x:{ticks:{color:chartTheme.color,font:chartTheme.font},grid:{display:false}}
      }
    }
  });
  if(dashChart2)dashChart2.destroy();
  dashChart2 = new Chart($('#chart2'),{
    type:'doughnut',
    data:{labels:['نقد','انبار','مطالبات'],datasets:[{data:[Math.max(t.cash,0),stockValue(),t.receivable],backgroundColor:['#3b82f6','#f59e0b','#10b981'],borderWidth:0}]},
    options:{
      responsive:true,cutout:'65%',
      plugins:{legend:{position:'bottom',labels:{color:chartTheme.color,font:chartTheme.font,padding:12}}}
    }
  });
}
function monthName(m){
  const names=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const p=m.split('/'); if(p.length<2)return m;
  return names[(Number(p[1])-1)]+' '+p[0].slice(2);
}
function lastSixMonths(){
  const g = new Date();
  const j = jalaali.toJalaali(g.getFullYear(),g.getMonth()+1,g.getDate());
  const arr=[];let y=j.jy,m=j.jm;
  for(let i=0;i<6;i++){arr.unshift(y+'/'+String(m).padStart(2,'0'));m--;if(m<1){m=12;y--;}}
  return arr;
}
function renderRecentInvoices(){
  const invs = [].concat(DB.data.invoices).sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,5);
  if(!invs.length)return '<div class="empty"><div class="icon">🧾</div><div class="title">فاکتوری ثبت نشده</div></div>';
  let rows = '';
  for(const i of invs){
    rows += '<tr><td>'+i.number+'</td><td><span class="badge '+(i.type==='sale'?'badge-success':'badge-danger')+'">'+(i.type==='sale'?'فروش':'خرید')+'</span></td><td class="num">'+i.date+'</td><td class="num">'+formatNum(i.total)+'</td></tr>';
  }
  return '<div class="table-wrap"><table><thead><tr><th>شماره</th><th>نوع</th><th>تاریخ</th><th>مبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function renderTopPersons(){
  const list = DB.data.persons.map(function(p){return {p:p,bal:personBalance(p.id)};}).filter(function(x){return Math.abs(x.bal)>=1;}).sort(function(a,b){return Math.abs(b.bal)-Math.abs(a.bal);}).slice(0,5);
  if(!list.length)return '<div class="empty"><div class="icon">👥</div><div class="title">مانده‌ای ثبت نشده</div></div>';
  let rows = '';
  for(const x of list){
    const l = personBalanceLabel(x.bal);
    rows += '<tr><td>'+x.p.name+'</td><td><span class="badge '+l.cls+'">'+l.text+'</span></td><td class="num">'+formatNum(Math.abs(x.bal))+'</td></tr>';
  }
  return '<div class="table-wrap"><table><thead><tr><th>نام</th><th>وضعیت</th><th>مبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function nextProductCode(){
  const nums = DB.data.products.map(function(p){return Number(String(p.code||'').replace(/\D/g,''))||0;});
  return 'K-' + String(Math.max.apply(null,[0].concat(nums))+1).padStart(4,'0');
}

/* ============ گردش حساب ============ */
function personLedger(id){
  const p = DB.data.persons.find(function(x){return x.id===id;});
  if(!p){toast('شخص یافت نشد','error');return;}
  const rows = [];
  for(const inv of DB.data.invoices){
    if(inv.personId===id){
      const rem = inv.total - (inv.paidAmount||0);
      rows.push({
        date: inv.date,
        desc: 'فاکتور ' + (inv.type==='sale'?'فروش':'خرید') + ' #' + inv.number + (rem>0?' (نسیه)':''),
        amount: inv.total,
        type: inv.type,
        refType: 'invoice',
        refId: inv.id
      });
    }
  }
  for(const t of DB.data.transactions){
    if(t.personId===id || t.toPersonId===id){
      let desc = t.type==='receive'?'دریافت وجه':t.type==='pay'?'پرداخت وجه':'انتقال';
      if(t.type==='transfer'){
        const otherId = t.personId===id? t.toPersonId : t.personId;
        const op = DB.data.persons.find(function(x){return x.id===otherId;});
        desc = 'انتقال ' + (t.personId===id?'به':'از') + ' ' + (op?op.name:'?');
      }
      rows.push({
        date: t.date,
        desc: desc,
        amount: t.amount,
        type: t.type,
        refType: 'transaction',
        refId: t.id
      });
    }
  }
  rows.sort(function(a,b){return b.date.localeCompare(a.date);});
  const bal = personBalance(id);
  const label = personBalanceLabel(bal);
  let rowsHtml = '';
  if(!rows.length){
    rowsHtml = '<tr><td colspan="5" class="text-center text-muted">موردی ثبت نشده</td></tr>';
  } else {
    for(const r of rows){
      let typeBadge = '';
      if(r.type==='sale') typeBadge = '<span class="badge badge-success">فروش</span>';
      else if(r.type==='purchase') typeBadge = '<span class="badge badge-danger">خرید</span>';
      else if(r.type==='receive') typeBadge = '<span class="badge badge-info">دریافت</span>';
      else if(r.type==='pay') typeBadge = '<span class="badge badge-warning">پرداخت</span>';
      else typeBadge = '<span class="badge badge-warning">انتقال</span>';
      let actionBtns = '';
      if(r.refType==='invoice'){
        actionBtns =
          '<button class="btn btn-sm btn-ghost" onclick="editFromLedger(\'invoice\',\''+r.refId+'\',\''+r.type+'\',true)">👁</button> '+
          '<button class="btn btn-sm btn-warning" onclick="editFromLedger(\'invoice\',\''+r.refId+'\',\''+r.type+'\',false)">✏️</button>';
      } else {
        actionBtns =
          '<button class="btn btn-sm btn-warning" onclick="editFromLedger(\'transaction\',\''+r.refId+'\',\''+r.type+'\',false)">✏️</button>';
      }
      rowsHtml += '<tr>'+
        '<td class="num">'+r.date+'</td>'+
        '<td>'+r.desc+'</td>'+
        '<td class="num">'+formatNum(r.amount)+'</td>'+
        '<td>'+typeBadge+'</td>'+
        '<td style="white-space:nowrap">'+actionBtns+'</td>'+
      '</tr>';
    }
  }
  openModal('گردش حساب: '+p.name,
    '<div class="flex justify-between mb-3 flex-wrap gap-2">'+
      '<div class="text-muted">تعداد تراکنش: '+rows.length+'</div>'+
      '<div>وضعیت: <span class="badge '+label.cls+'">'+label.text+' '+formatMoney(Math.abs(bal))+'</span></div>'+
    '</div>'+
    '<div class="table-wrap"><table><thead><tr>'+
      '<th>تاریخ</th><th>شرح</th><th>مبلغ</th><th>نوع</th><th>عملیات</th>'+
    '</tr></thead><tbody>'+rowsHtml+'</tbody></table></div>',
    '<button class="btn btn-ghost" onclick="closeModal()">بستن</button>',
    'lg'
  );
}
function editFromLedger(refType, refId, invType, viewOnly){
  closeModal();
  setTimeout(function(){
    if(refType==='invoice'){
      if(viewOnly){viewInvoice(refId);}
      else{invoiceForm(invType, refId);}
    } else {
      txForm(invType, refId);
    }
  }, 120);
}

    '</tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>';

function setInvFilter(f){invoiceFilter=f;renderInvoices();}
function nextInvoiceNumber(type){
  const prefix = type==='sale'?'F':'P';
  const nums = DB.data.invoices.filter(function(i){return i.type===type;}).map(function(i){return Number(i.number.replace(/\D/g,''))||0;});
  return prefix + '-' + String(Math.max.apply(null,[0].concat(nums))+1).padStart(4,'0');
}
let invoiceItems = [];

function renderInvoiceItems(){
  const body = $('#invItemsBody');
  if(!body)return;
  if(!invoiceItems.length){
    body.innerHTML = '<tr><td colspan="5" class="text-center text-muted" style="padding:16px">ردیفی اضافه نشده</td></tr>';
    recalcInvoice();
    return;
  }
  let html = '';
  for(let idx=0; idx<invoiceItems.length; idx++){
    html += invoiceItemsRowHTML(invoiceItems[idx], idx);
  }
  body.innerHTML = html;
  attachAllThousandsIn(body);
  recalcInvoice();
}
function invoiceItemsRowHTML(it,idx){
  let productOptions = '<option value="">— انتخاب کالا —</option>';
  for(const x of DB.data.products){
    productOptions += '<option value="'+x.id+'" '+(x.id===it.productId?'selected':'')+'>'+(x.code?'['+x.code+'] ':'')+x.name+'</option>';
  }
  return '<tr data-row="'+idx+'">'+
    '<td class="col-product"><select class="form-control product-select" onchange="updateItemProduct('+idx+',this.value)">'+productOptions+'</select></td>'+
    '<td class="col-qty"><input class="form-control num" type="number" min="1" value="'+it.qty+'" oninput="updateItemQty('+idx+',this.value)" style="width:100%"></td>'+
    '<td class="col-price"><input class="form-control num" data-thousands value="'+formatNum(it.price)+'" oninput="updateItemPrice('+idx+',this.value)" style="width:100%"></td>'+
    '<td class="col-total"><span class="num" style="font-weight:700">'+formatNum(it.qty*it.price)+'</span></td>'+
    '<td class="col-act"><button class="btn btn-sm btn-danger" onclick="removeInvoiceItem('+idx+')" title="حذف">✕</button></td>'+
  '</tr>';
}
function updateItemProduct(idx,val){
  invoiceItems[idx].productId = val;
  if(val){
    const p = DB.data.products.find(function(x){return x.id===val;});
    if(p && !invoiceItems[idx].price){
      const type = $('#invNumber').value.startsWith('F')?'sale':'purchase';
      invoiceItems[idx].price = type==='purchase'? (p.purchasePrice||0) : (p.salePrice||0);
      const row = $('#invItemsBody tr[data-row="'+idx+'"]');
      if(row){ const pi = row.querySelector('.col-price input'); if(pi) pi.value = formatNum(invoiceItems[idx].price); }
    }
  }
  updateRowTotal(idx);
  recalcInvoice();
}
function updateItemQty(idx,val){
  invoiceItems[idx].qty = Math.max(1,Number(val)||1);
  updateRowTotal(idx);
  recalcInvoice();
}
function updateItemPrice(idx,val){
  invoiceItems[idx].price = parseNum(val);
  updateRowTotal(idx);
  recalcInvoice();
}
function updateRowTotal(idx){
  const row = $('#invItemsBody tr[data-row="'+idx+'"]');
  if(!row)return;
  const cell = row.querySelector('.col-total .num');
  if(cell) cell.textContent = formatNum(invoiceItems[idx].qty*invoiceItems[idx].price);
}
function addInvoiceItem(){ invoiceItems.push({productId:'',qty:1,price:0}); renderInvoiceItems(); }
function removeInvoiceItem(idx){ invoiceItems.splice(idx,1); renderInvoiceItems(); }
function recalcInvoice(){
  const subtotal = invoiceItems.reduce(function(s,i){return s+(i.qty*i.price);},0);
  const shipping = parseNum(($('#invShipping')||{}).value||0);
  const customs = parseNum(($('#invCustoms')||{}).value||0);
  const paid = parseNum(($('#invPaidAmount')||{}).value||0);
  const total = subtotal + shipping + customs;
  const remaining = total - paid;
  if($('#invSubtotal'))$('#invSubtotal').textContent = formatNum(subtotal);
  if($('#invShipShow'))$('#invShipShow').textContent = formatNum(shipping);
  if($('#invCustShow'))$('#invCustShow').textContent = formatNum(customs);
  if($('#invTotal'))$('#invTotal').textContent = formatNum(total);
  if($('#invPaidShow'))$('#invPaidShow').textContent = formatNum(paid);
  if($('#invRemShow'))$('#invRemShow').textContent = formatNum(remaining);
}
function saveInvoice(type,editId){
  editId = editId || '';
  if(editId){
    const inv = DB.data.invoices.find(function(x){return x.id===editId;});
    if(inv) type = inv.type;
  }
  const personId = $('#invPerson').value;
  const whId = $('#invWh').value;
  const date = $('#invDate').value.trim();
  if(!personId){toast('شخص را انتخاب کنید','error');return;}
  if(!whId){toast('انبار را انتخاب کنید','error');return;}
  if(!validJalali(date)){toast('تاریخ معتبر نیست (مثال: 1403/01/01)','error');return;}
  if(!invoiceItems.length){toast('حداقل یک ردیف اضافه کنید','error');return;}
  if(invoiceItems.some(function(i){return !i.productId;})){toast('کالای هر ردیف را انتخاب کنید','error');return;}
  if(type==='sale'){
    for(const it of invoiceItems){
      const avail = stockOf(it.productId,whId,editId||null);
      if(avail < it.qty){
        const p = DB.data.products.find(function(x){return x.id===it.productId;});
        toast('موجودی کالای "'+p.name+'" کافی نیست (موجودی: '+avail+')','error');
        return;
      }
    }
  }
  const subtotal = invoiceItems.reduce(function(s,i){return s+(i.qty*i.price);},0);
  const shippingCost = parseNum($('#invShipping').value);
  const customsCost = parseNum($('#invCustoms').value);
  const paidAmount = parseNum($('#invPaidAmount').value);
  const total = subtotal + shippingCost + customsCost;
  const number = $('#invNumber').value.trim();
  const note = $('#invNote').value.trim();
  if(editId){
    DB.data.stockMoves = DB.data.stockMoves.filter(function(m){return m.refId!==editId;});
    const inv = DB.data.invoices.find(function(x){return x.id===editId;});
    Object.assign(inv,{personId:personId,warehouseId:whId,date:date,items:invoiceItems.map(function(i){return Object.assign({},i);}),shippingCost:shippingCost,customsCost:customsCost,total:total,paidAmount:paidAmount,number:number,note:note});
    for(const it of invoiceItems){
      DB.data.stockMoves.push({id:uid(),date:date,type:type==='purchase'?'in':'out',productId:it.productId,warehouseId:whId,qty:it.qty,refType:'invoice',refId:editId});
    }
  } else {
    const id = uid();
    DB.data.invoices.push({id:id,type:type,number:number,date:date,personId:personId,warehouseId:whId,items:invoiceItems.map(function(i){return Object.assign({},i);}),shippingCost:shippingCost,customsCost:customsCost,total:total,paidAmount:paidAmount,note:note,createdAt:nowJalaliFull()});
    for(const it of invoiceItems){
      DB.data.stockMoves.push({id:uid(),date:date,type:type==='purchase'?'in':'out',productId:it.productId,warehouseId:whId,qty:it.qty,refType:'invoice',refId:id});
    }
  }
  DB.save(); closeModal(); renderInvoices(); toast('فاکتور ذخیره شد','success');
}

function editFromViewInvoice(type, id){

}
function deleteInvoice(id){
  confirmAction('حذف این فاکتور؟ (گردش انبار نیز برگشت داده می‌شود)',function(){
    DB.data.invoices = DB.data.invoices.filter(function(i){return i.id!==id;});

/* ============ تراکنش‌ها ============ */
function renderTransactions(){
  const list = [].concat(DB.data.transactions).sort(function(a,b){return b.date.localeCompare(a.date);});
  let rowsHtml = '';
  if(!list.length){
    rowsHtml = '<tr><td colspan="6"><div class="empty"><div class="icon">💸</div><div class="title">تراکنشی ثبت نشده</div></div></td></tr>';
  } else {
    for(const t of list){
      let who = '-';
      if(t.type==='receive'||t.type==='pay'){
        const p = DB.data.persons.find(function(x){return x.id===t.personId;});
        who = p?p.name:'?';
      } else if(t.type==='transfer'){
        const from = DB.data.persons.find(function(x){return x.id===t.personId;});
        const to = DB.data.persons.find(function(x){return x.id===t.toPersonId;});
        who = (from?from.name:'?')+' → '+(to?to.name:'?');
      }
      const badge = t.type==='receive'?'badge-success':t.type==='pay'?'badge-danger':'badge-warning';
      const label = t.type==='receive'?'دریافت':t.type==='pay'?'پرداخت':'انتقال';
      rowsHtml += '<tr>'+
        '<td class="num">'+t.date+'</td>'+
        '<td><span class="badge '+badge+'">'+label+'</span></td>'+
        '<td>'+who+'</td>'+
        '<td class="num">'+formatNum(t.amount)+'</td>'+
        '<td>'+(t.note||'-')+'</td>'+
        '<td>'+
          '<button class="btn btn-sm btn-warning" onclick="txForm(\''+t.type+'\',\''+t.id+'\')" title="ویرایش">✏️</button> '+
          '<button class="btn btn-sm btn-danger" onclick="deleteTx(\''+t.id+'\')" title="حذف">🗑</button>'+
        '</td></tr>';
    }
  }
  $('#content').innerHTML =
    '<div class="flex justify-between items-center mb-4">'+
      '<div class="text-muted">دریافت، پرداخت و انتقال بین اشخاص</div>'+
      '<div class="flex gap-2">'+
        '<button class="btn btn-success" onclick="txForm(\'receive\')">📥 دریافت</button>'+
        '<button class="btn btn-danger" onclick="txForm(\'pay\')">📤 پرداخت</button>'+
        '<button class="btn btn-warning" onclick="txForm(\'transfer\')">🔁 انتقال</button>'+
      '</div>'+
    '</div>'+
    '<div class="card"><div class="table-wrap"><table><thead><tr>'+
      '<th>تاریخ</th><th>نوع</th><th>از / به</th><th>مبلغ</th><th>توضیح</th><th>عملیات</th>'+
    '</tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>';
}
function txForm(type, editId){
  editId = editId || null;
  if(!DB.data.persons.length){toast('ابتدا شخص اضافه کنید','warning');return;}
  const existing = editId? DB.data.transactions.find(function(t){return t.id===editId;}) : null;
  if(existing) type = existing.type;
  const isTransfer = type==='transfer';
  let fromOptions = '<option value="">انتخاب</option>';
  let toOptions = '<option value="">انتخاب</option>';
  let personOptions2 = '<option value="">انتخاب</option>';
  for(const p of DB.data.persons){
    fromOptions += '<option value="'+p.id+'" '+(existing&&existing.personId===p.id?'selected':'')+'>'+p.name+'</option>';
    toOptions += '<option value="'+p.id+'" '+(existing&&existing.toPersonId===p.id?'selected':'')+'>'+p.name+'</option>';
    personOptions2 += '<option value="'+p.id+'" '+(existing&&existing.personId===p.id?'selected':'')+'>'+p.name+'</option>';
  }
  let body = '<div class="form-group"><label class="form-label">تاریخ</label><input class="form-control" id="txDate" value="'+(existing?existing.date:todayJalali())+'" dir="ltr"></div>';
  if(isTransfer){
    body += '<div class="form-group"><label class="form-label">از شخص (پرداخت‌کننده) *</label><select class="form-control" id="txFrom">'+fromOptions+'</select></div>';
    body += '<div class="form-group"><label class="form-label">به شخص (دریافت‌کننده) *</label><select class="form-control" id="txTo">'+toOptions+'</select></div>';
    body += '<p class="text-muted" style="font-size:11px;margin-bottom:8px">💡 انتقال یعنی شخص «از» پول را مستقیم به شخص «به» می‌دهد (بدون دخالت صندوق شما). بدهی/طلب هر دو نفر به‌روز می‌شود.</p>';
  } else {
    body += '<div class="form-group"><label class="form-label">شخص *</label><select class="form-control" id="txPerson">'+personOptions2+'</select></div>';
  }
  body += '<div class="form-group"><label class="form-label">مبلغ *</label><input class="form-control" data-thousands id="txAmount" value="'+(existing?formatNum(existing.amount):'0')+'"></div>';
  body += '<div class="form-group"><label class="form-label">توضیحات</label><input class="form-control" id="txNote" value="'+(existing?(existing.note||''):'')+'"></div>';
  openModal(
    (type==='receive'?'ثبت دریافت وجه':type==='pay'?'ثبت پرداخت وجه':'انتقال بین اشخاص')+(editId?' (ویرایش)':''),
    body,
    '<button class="btn btn-ghost" onclick="closeModal()">انصراف</button>'+
    '<button class="btn btn-primary" onclick="saveTx(\''+type+'\',\''+(editId||'')+'\')">ذخیره</button>'
  );
}
function saveTx(type, editId){
  editId = editId || '';
  if(editId){
    const ex = DB.data.transactions.find(function(t){return t.id===editId;});
    if(ex) type = ex.type;
  }
  const date = $('#txDate').value.trim();
  if(!validJalali(date)){toast('تاریخ معتبر نیست','error');return;}
  const amount = parseNum($('#txAmount').value);
  if(amount<=0){toast('مبلغ را وارد کنید','error');return;}
  const note = $('#txNote').value.trim();
  const obj = {date:date,type:type,amount:amount,note:note};
  if(type==='transfer'){
    const from = $('#txFrom').value;
    const to = $('#txTo').value;
    if(!from||!to){toast('هر دو شخص را انتخاب کنید','error');return;}
    if(from===to){toast('اشخاص باید متفاوت باشند','error');return;}
    obj.personId = from; obj.toPersonId = to;
  } else {
    const person = $('#txPerson').value;
    if(!person){toast('شخص را انتخاب کنید','error');return;}
    obj.personId = person;
  }
  if(editId){
    const ex = DB.data.transactions.find(function(t){return t.id===editId;});
    Object.assign(ex,obj);
  } else {
    DB.data.transactions.push(Object.assign({id:uid()},obj));
  }
  DB.save(); closeModal(); renderTransactions(); toast('تراکنش ذخیره شد','success');
}
function deleteTx(id){
  confirmAction('حذف این تراکنش؟',function(){
    DB.data.transactions = DB.data.transactions.filter(function(t){return t.id!==id;});
    DB.save(); renderTransactions(); toast('حذف شد','success');
  });
}

    '</div>'+
    '<div class="card">'+
      '<div class="card-header"><div class="card-title">تنظیم سرمایه اولیه</div></div>'+
      '<div class="form-row">'+
        '<div class="form-group"><label class="form-label">سرمایه اولیه</label><input class="form-control" data-thousands id="capVal" value="'+formatNum(initial)+'"></div>'+
        '<div class="form-group"><label class="form-label">تاریخ شروع</label><input class="form-control" id="capDate" value="'+(DB.data.settings.initialCapitalDate||todayJalali())+'" dir="ltr"></div>'+

function saveCapital(){
  DB.data.settings.initialCapital = parseNum($('#capVal').value);
  DB.data.settings.initialCapitalDate = $('#capDate').value.trim();
  DB.save(); toast('سرمایه اولیه ذخیره شد','success'); renderCapital();
}

/* ============ گزارش‌ها ============ */
function renderReports(){
  const t = totals();
  const months = lastSixMonths();
  const monthSales = months.map(function(m){let s=0;for(const i of DB.data.invoices){if(i.type==='sale'&&jalaliMonth(i.date)===m)s+=i.total;}return s;});
  const monthPurchases = months.map(function(m){let s=0;for(const i of DB.data.invoices){if(i.type==='purchase'&&jalaliMonth(i.date)===m)s+=i.total;}return s;});
  const lowStock = DB.data.products.filter(function(p){return stockOf(p.id)<=p.minStock;});
  let lowStockHtml = '';
  if(lowStock.length){
    let rows = '';
    for(const p of lowStock){
      rows += '<tr><td>'+p.name+'</td><td class="num text-danger">'+formatNum(stockOf(p.id))+'</td><td class="num">'+formatNum(p.minStock)+'</td></tr>';
    }
    lowStockHtml = '<div class="table-wrap"><table><thead><tr><th>کالا</th><th>موجودی</th><th>حداقل</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  } else {
    lowStockHtml = '<div class="empty"><div class="icon">✓</div><div class="title">همه کالاها موجودی کافی دارند</div></div>';
  }
  let stockRows = '';
  if(DB.data.products.length){
    for(const p of DB.data.products){
      const q = stockOf(p.id);
      const avg = avgCostOf(p.id);
      stockRows += '<tr><td>'+(p.code||'-')+'</td><td>'+p.name+'</td><td class="num '+(q<=p.minStock?'text-danger':'')+'">'+formatNum(q)+'</td><td class="num" style="color:#60a5fa;font-weight:700">'+formatNum(avg)+'</td><td class="num">'+formatNum(q*avg)+'</td></tr>';
    }
  } else {
    stockRows = '<tr><td colspan="5" class="text-center text-muted">کالایی نیست</td></tr>';
  }
  $('#content').innerHTML =
    '<div class="grid grid-4 mb-4">'+
      '<div class="stat s-success"><div class="stat-label">کل فروش</div><div class="stat-value">'+formatMoney(t.sales)+'</div></div>'+
      '<div class="stat s-danger"><div class="stat-label">کل خرید</div><div class="stat-value">'+formatMoney(t.purchases)+'</div></div>'+
      '<div class="stat s-info"><div class="stat-label">سود ناخالص</div><div class="stat-value">'+formatMoney(t.profit)+'</div></div>'+
      '<div class="stat"><div class="stat-label">ارزش انبار</div><div class="stat-value">'+formatMoney(stockValue())+'</div></div>'+
    '</div>'+
    '<div class="grid grid-2 mb-4">'+
      '<div class="card"><div class="card-header"><div class="card-title">فروش و خرید ماهانه</div></div><canvas id="rChart1" height="220"></canvas></div>'+
      '<div class="card"><div class="card-header"><div class="card-title">کالاهای کم‌موجود</div></div>'+lowStockHtml+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="card-header"><div class="card-title">گزارش موجودی و بهای تمام‌شده</div></div>'+
      '<div class="table-wrap"><table><thead><tr><th>کد</th><th>کالا</th><th>موجودی</th><th>میانگین بهای تمام‌شده</th><th>ارزش موجودی</th></tr></thead><tbody>'+stockRows+'</tbody></table></div>'+
    '</div>';
  setTimeout(function(){
    new Chart($('#rChart1'),{
      type:'line',data:{labels:months.map(monthName),datasets:[
        {label:'فروش',data:monthSales,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.1)',tension:.35,fill:true,borderWidth:3},
        {label:'خرید',data:monthPurchases,borderColor:'#e63946',backgroundColor:'rgba(230,57,70,.1)',tension:.35,fill:true,borderWidth:3}
      ]},
      options:{
        responsive:true,
        plugins:{legend:{position:'bottom',labels:{color:chartTheme.color,font:chartTheme.font,padding:12}}},
        scales:{
          y:{ticks:{color:chartTheme.color,font:chartTheme.font,callback:function(v){return formatNum(v);}},grid:{color:chartTheme.grid}},
          x:{ticks:{color:chartTheme.color,font:chartTheme.font},grid:{display:false}}
        }
      }
    });
  },10);
}

        '<div class="stat"><div class="stat-label">فاکتورها</div><div class="stat-value">'+formatNum(DB.data.invoices.length)+'</div></div>'+

function saveSettings(){
  DB.data.settings.shopName = $('#setShop').value.trim()||'فروشگاه من';
  DB.data.settings.currency = $('#setCurrency').value;
  DB.save();
  $('#sidebarShopName').textContent = DB.data.settings.shopName;
  toast('تنظیمات ذخیره شد','success');
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB.data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('فایل پشتیبان دانلود شد','success');
}
function importData(e){
  const file = e.target.files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const parsed = JSON.parse(ev.target.result);
      confirmAction('اطلاعات فعلی جایگزین شود؟',function(){
        DB.data = Object.assign({},DB.data,parsed);
        DB.save();
        $('#sidebarShopName').textContent = DB.data.settings.shopName;
        toast('بازیابی انجام شد','success');
        navigate('dashboard');
      });
    }catch(err){toast('فایل معتبر نیست','error');}
  };
  reader.readAsText(file);
  e.target.value='';
}
function resetAccountingData(){
  confirmAction('همه فاکتورها، تراکنش‌ها و گردش انبار پاک شوند؟ (اشخاص، کالاها و انبارها حفظ می‌شوند)',function(){
    DB.resetAccounting();
    toast('اطلاعات حسابداری پاک شد','success');
    navigate('dashboard');
  });
}
function resetAllData(){
  confirmAction('⚠️ کل اطلاعات (فاکتورها، اشخاص، کالاها، انبارها) حذف شود؟ این عملیات برگشت‌پذیر نیست.',function(){
    DB.resetAll();
    toast('همه اطلاعات پاک شد','success');
    navigate('dashboard');
  });
}

/* ============ شروع ============ */
navigate('dashboard');
</script>
